function load(){S.docs={};try{var o=JSON.parse(lsGet(LS_KEY)||'null');if(o&&o.docs)S.docs=o.docs}catch(e){}seed().forEach(function(d){if(!S.docs[d.id])S.docs[d.id]=d})}

    if(m.t==='in'){var v=r.qty*r.avg+q*p;r.qty+=q;r.avg=r.qty>0?v/r.qty:p;r.inQ+=q;r.inV+=q*p}

function saveInv(){
  sugHide();

  INV.rows.forEach(function(r,i){
    if(!String(r.item).trim()&&!String(r.qty).trim()&&!String(r.price).trim())return;
    var d=parseD(r.date),n=String(r.item).trim(),q=r3(num(r.qty)),it=itemByName(n),un=it?it.unit:String(r.unit||'').trim();
    var bad=!d?'التاريخ':!n?'الصنف':q<=0?'الكمية':!un?'الوحدة (صنف جديد)':'';
    if(bad)errs.push([i,bad]);else ok.push({i:i,date:d,name:n,qty:q,price:num(r.price),party:String(r.party||'').trim(),it:it,unit:un});
  });
  document.querySelectorAll('#invBody tr').forEach(function(tr){tr.style.background=''});
  if(errs.length){errs.forEach(function(x){var tr=$('ir'+x[0]);if(tr)tr.style.background='var(--bad-soft)'});toast('سطر '+(errs[0][0]+1)+': ناقص '+errs[0][1],1);invFocus(errs[0][0],1);return}
  if(!ok.length){toast('الفاتورة فاضية',1);return}
  var doIt=function(){
    var newItems=0;
    ok.forEach(function(x){
      var it=x.it||itemByName(x.name);
      if(!it){var uid0=addUnit(x.unit);it={id:uid(),t:'item',name:x.name,cat:INV.cat,unit:uid0,sell:t==='out'?x.price:0,min:0};put(it);newItems++}
      put({id:uid(),t:t,item:it.id,date:x.date,qty:x.qty,price:x.price,party:x.party,note:INV.ref?'فاتورة '+INV.ref:''});
      if(t==='out'&&x.price&&!it.sell){var y=Object.assign({},S.docs[it.id]);y.sell=x.price;put(y)}
    });
    var tot=ok.reduce(function(s,x){return s+x.qty*x.price},0);
    LASTINV={t:t,ref:INV.ref,at:today(),rows:ok.map(function(x){var it=itemByName(x.name);return {date:x.date,name:x.name,qty:x.qty,unit:it?nm(it.unit):x.unit,price:x.price,party:x.party}}),total:tot};
    INV.rows=[];INV.ref='';render();
    toast('اتحفظت الفاتورة: '+ok.length+' سطر · '+money(tot)+' ج'+(newItems?' · '+newItems+' صنف جديد':''));
  };
  var noPrice=ok.filter(function(x){return !x.price}).length;
  var warn=[];
  if(t==='out'){var L=ledger(),need={};ok.forEach(function(x){if(x.it)need[x.it.id]=(need[x.it.id]||0)+x.qty});
    for(var k in need){var b=L[k]?L[k].qty:0;if(need[k]-b>0.0001)warn.push(esc(nm(k))+' (الرصيد '+fmt(b)+')')}
    ok.forEach(function(x){if(!x.it)warn.push(esc(x.name)+' (صنف مش موجود — رصيده صفر)')})}
  if(warn.length||noPrice)ask('تأكيد الحفظ',(warn.length?'الكمية أكبر من الرصيد في: <b>'+warn.join('، ')+'</b><br>':'')+(noPrice?noPrice+' سطر من غير سعر.<br>':'')+'تحفظ برضه؟',doIt,false,'احفظ');
  else doIt();
}

/* ===== تسوية فواتير بروفيجن (زي الإكسيل) =====
   المبلغ ثابت من الشيت. أول ما تكتب العدد السعر بيتحسب = المبلغ ÷ العدد.
   لو غيّرت السعر بإيدك بيتعلم بالأحمر، ولو الإجمالي مختلف عن المبلغ بيظهر الفرق. */
var SF='all';
function stRows(){return all('out').filter(function(m){return m.src}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.c||0)-(b.c||0)})}
function stDiff(m){return (+m.qty&&+m.price&&+m.amt)?m.qty*m.price-m.amt:0}
function stRowHtml(m,i){var it=S.docs[m.item]||{},df=stDiff(m),bad=Math.abs(df)>0.01,miss=!(+m.qty);
  return '<tr data-id="'+m.id+'" class="'+(bad?'st-bad':miss?'st-miss':'')+'"><td class="c-sub">'+(i+1)+'</td><td>'+sd(m.date)+'</td><td class="b">'+esc(nm(m.item))+'</td><td>'+esc(nm(it.unit))+'</td><td class="n">'+(+m.amt?money(m.amt):'<span class="c-sub">بدون قيمة</span>')+'</td>'+
  '<td style="padding:3px"><input class="sq ic2" data-id="'+m.id+'" data-f="qty" inputmode="decimal" value="'+(+m.qty?r3(m.qty):'')+'" placeholder="العدد"></td>'+
  '<td style="padding:3px"><input class="sq ic2'+(m.pman?' pman':'')+'" data-id="'+m.id+'" data-f="price" inputmode="decimal" value="'+(+m.price?Math.round(m.price*100)/100:'')+'" placeholder="السعر"></td>'+
  '<td class="n b st-tot">'+(+m.qty&&+m.price?money(m.qty*m.price):'—')+'</td><td class="n st-df '+(bad?'c-bad b':'')+'">'+(bad?money(df):'')+'</td></tr>'}
VIEWS.settle=function(){
  var rows=stRows(),done=rows.filter(function(m){return +m.qty}).length,bad=rows.filter(function(m){return Math.abs(stDiff(m))>0.01}).length;
  var show=rows.filter(function(m){return SF==='all'||(SF==='miss'&&!(+m.qty))||(SF==='bad'&&Math.abs(stDiff(m))>0.01)});

  '<div class="chips no-print"><div class="chip'+(SF==='all'?' on':'')+'" onclick="SF=\'all\';render()">الكل</div><div class="chip'+(SF==='miss'?' on':'')+'" onclick="SF=\'miss\';render()">ناقص العدد ('+(rows.length-done)+')</div><div class="chip'+(SF==='bad'?' on':'')+'" onclick="SF=\'bad\';render()">فيه فرق ('+bad+')</div></div>'+
  '<div class="card" style="padding:10px"><div class="tbl-wrap"><table class="xl st"><thead><tr><th>#</th><th>التاريخ</th><th>الصنف</th><th>الوحدة</th><th class="n">المبلغ</th><th style="min-width:90px">العدد</th><th style="min-width:90px">السعر</th><th class="n">الإجمالي</th><th class="n">الفرق</th></tr></thead><tbody id="stBody">'+
  (show.length?show.map(stRowHtml).join(''):'<tr><td colspan="9" class="empty">مفيش سطور</td></tr>')+'</tbody></table></div>'+
  '<p class="hint" style="margin-top:8px">⌨️ اكتب العدد والسعر بيتحسب لوحده من المبلغ. لو غيّرت السعر بيتعلم <b class="c-bad">بالأحمر</b>، ولو الإجمالي مختلف عن المبلغ بيظهر الفرق. <b>Enter</b> للخانة اللي بعدها، والأسهم للتنقل. الوحدة بتتغير من صفحة الأصناف.</p></div>'+shareBar('out');
};
function stCommit(el){
  var d=S.docs[el.getAttribute('data-id')];if(!d)return;d=Object.assign({},d);var f=el.getAttribute('data-f'),v=r3(num(el.value));
  if(f==='qty'){d.qty=v;if(!d.pman&&+d.amt&&v>0)d.price=Math.round(d.amt/v*10000)/10000;if(!v&&!d.pman)d.price=0;}
  else{d.price=v;var auto=(+d.amt&&+d.qty)?Math.round(d.amt/d.qty*100)/100:null;d.pman=(auto===null||Math.abs(v-auto)>0.005)&&v>0?1:0;if(!v)d.pman=0;}
  put(d);stPaint(d);
}
function stPaint(d){var tr=document.querySelector('#stBody tr[data-id="'+d.id+'"]');if(!tr)return;var df=stDiff(d),bad=Math.abs(df)>0.01;
  tr.className=bad?'st-bad':(!(+d.qty)?'st-miss':'');
  var pq=tr.querySelector('[data-f="price"]');if(pq&&document.activeElement!==pq)pq.value=+d.price?Math.round(d.price*100)/100:'';if(pq)pq.classList.toggle('pman',!!d.pman);
  tr.querySelector('.st-tot').textContent=+d.qty&&+d.price?money(d.qty*d.price):'—';var c=tr.querySelector('.st-df');c.textContent=bad?money(df):'';c.className='n st-df '+(bad?'c-bad b':'');}
document.addEventListener('change',function(e){var el=e.target;if(el.classList&&el.classList.contains('sq'))stCommit(el)});
document.addEventListener('keydown',function(e){var el=e.target;if(!el.classList||!el.classList.contains('sq'))return;
  var ins=Array.prototype.slice.call(document.querySelectorAll('#stBody .sq')),i=ins.indexOf(el),go=function(j){var t=ins[j];if(t){t.focus();try{t.select()}catch(x){}}};
  if(e.key==='Enter'){e.preventDefault();stCommit(el);go(i+(e.shiftKey?-1:1));}
  else if(e.key==='ArrowDown'){e.preventDefault();stCommit(el);go(i+2);}
  else if(e.key==='ArrowUp'){e.preventDefault();stCommit(el);go(i-2);}
  else if(e.key==='ArrowLeft'&&(el.selectionStart===el.value.length)){e.preventDefault();stCommit(el);go(i+1);}
  else if(e.key==='ArrowRight'&&el.selectionStart===0){e.preventDefault();stCommit(el);go(i-1);}
});
document.addEventListener('focusin',function(e){var el=e.target;if(el.classList&&el.classList.contains('sq')&&el.value)setTimeout(function(){try{el.select()}catch(x){}},0)});

var rpM='month',rpF='',rpT='',rpV='move';
function rpRange(){var t=today();if(rpM==='today')return [t,t];if(rpM==='week')return [addDays(t,-6),t];if(rpM==='month')return [t.slice(0,8)+'01',t];if(rpM==='year')return [t.slice(0,5)+'01-01',t];if(rpM==='all')return ['',''];return [rpF||t,rpT||t]}
function repSub(){var r=rpRange();return r[0]?'من '+arDate(r[0])+' إلى '+arDate(r[1]):'كل الفترات'}
function repData(){
  var rg=rpRange(),f=rg[0],to=rg[1],cm=costMap(),by={};
  function g(k){return by[k]||(by[k]={buy:0,sell:0,cogs:0,inQ:0,outQ:0})}
  all('in').forEach(function(m){if(!inRange(m.date,f,to))return;var r=g(m.item);r.buy+=m.qty*(m.price||0);r.inQ+=+m.qty});
  all('out').forEach(function(m){if(!inRange(m.date,f,to))return;var r=g(m.item);r.sell+=mvTot(m);r.cogs+=m.qty*(cm[m.id]||0);r.outQ+=+m.qty});
  var cat={};CATS.forEach(function(c){cat[c[0]]={buy:0,sell:0,cogs:0}});
  for(var k in by){var it=S.docs[k];if(it&&cat[it.cat]){['buy','sell','cogs'].forEach(function(x){cat[it.cat][x]+=by[k][x]})}}
  var T={buy:0,sell:0,cogs:0};for(var c in cat)['buy','sell','cogs'].forEach(function(x){T[x]+=cat[c][x]});
  var keys=Object.keys(by).filter(function(k){var it=S.docs[k];return it&&(!CAT||it.cat===CAT)}).sort(function(a,b){return by[b].sell-by[a].sell||by[b].buy-by[a].buy});
  return {by:by,cat:cat,T:T,keys:keys};
}

  var cr=CATS.map(function(c){var r=D.cat[c[0]];return '<tr><td class="l">'+(doc?c[2]:catPill(c[0]))+'</td><td class="n">'+money(r.buy)+'</td><td class="n">'+money(r.sell)+'</td><td class="n">'+money(r.cogs)+'</td><td class="n b '+pc(r.sell-r.cogs)+'">'+money(r.sell-r.cogs)+'</td></tr>'});
  var ct='<tr class="tot"><td>الإجمالي</td><td class="n">'+money(T.buy)+'</td><td class="n">'+money(T.sell)+'</td><td class="n">'+money(T.cogs)+'</td><td class="n">'+money(T.sell-T.cogs)+'</td></tr>';
  var ir=D.keys.map(function(k){var r=D.by[k];return '<tr><td class="l b">'+esc(nm(k))+'</td><td>'+esc(nm((S.docs[k]||{}).unit))+'</td><td class="n">'+fmt(r.inQ)+'</td><td class="n">'+fmt(r.outQ)+'</td><td class="n">'+money(r.buy)+'</td><td class="n">'+money(r.sell)+'</td><td class="n b '+pc(r.sell-r.cogs)+'">'+money(r.sell-r.cogs)+'</td></tr>'});
  var h1=['القسم','مشتريات','مبيعات','تكلفة المباع','الربح'],h2=['الصنف','الوحدة','وارد','منصرف','مشتريات','مبيعات','الربح'];
  if(doc)return kp+'<h3>حسب القسم</h3>'+dTable(h1,cr,ct)+'<h3>حسب الصنف</h3>'+dTable(h2,ir)+'<div class="note">الربح = سعر البيع − متوسط تكلفة الشراء وقت الصرف.</div>';
  function ht(h,rows,tot){return '<div class="tbl-wrap"><table><thead><tr>'+h.map(function(x,i){return '<th'+(i>0&&!(h===h2&&i===1)?' class="n"':'')+'>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+h.length+'" class="empty">مفيش حركات في الفترة دي</td></tr>')+(tot||'')+'</tbody></table></div>'}
  return kp+'<div class="card"><h3>حسب القسم</h3>'+ht(h1,cr,ct)+'</div><div class="card"><h3>حسب الصنف</h3>'+ht(h2,ir)+'<p class="hint" style="margin-top:8px">الربح = سعر البيع − متوسط تكلفة الشراء وقت الصرف (متوسط مرجّح).</p></div>';
}
/* تصفية المخزن: لو اتباع كل الموجود بسعر البيع */
function liqMk(){return num(lsGet('provwh.liqmk')||0)}
function liqData(){
  var L=ledger(),mk=liqMk(),rows=[],neg=[],noSell=0;
  items(CAT).forEach(function(i){var r=L[i.id];if(r.qty<-0.0001){neg.push(i.name);return}if(r.qty<=0.0001)return;
    var sp=+i.sell||0,est=false;if(!sp){sp=r.avg*(1+mk/100);est=true;noSell++}
    var cost=r.qty*r.avg,sale=r.qty*sp;rows.push({it:i,qty:r.qty,avg:r.avg,sp:sp,est:est,cost:cost,sale:sale,pr:sale-cost})});
  var cat={};CATS.forEach(function(c){cat[c[0]]={cost:0,sale:0}});var T={cost:0,sale:0};
  rows.forEach(function(x){cat[x.it.cat].cost+=x.cost;cat[x.it.cat].sale+=x.sale;T.cost+=x.cost;T.sale+=x.sale});
  return {rows:rows,cat:cat,T:T,neg:neg,noSell:noSell,mk:mk};
}
function pct(a,b){return b?(a/b*100):0}
function pctS(v){return (Math.round(v*10)/10).toLocaleString('en-US')+'%'}
function liqBody(doc){
  var D=liqData(),T=D.T,P=T.sale-T.cost,cl=function(v){return v<0?(doc?'neg':'c-bad'):(doc?'pos':'c-ok')};
  var kp=doc?'<div class="kp"><div><span>قيمة المخزون بالتكلفة</span><b>'+money(T.cost)+' ج</b></div><div><span>هيتباع بـ</span><b>'+money(T.sale)+' ج</b></div><div><span>المكسب</span><b>'+money(P)+' ج</b></div><div><span>نسبة الربح على التكلفة</span><b>'+pctS(pct(P,T.cost))+'</b></div><div><span>هامش الربح من البيع</span><b>'+pctS(pct(P,T.sale))+'</b></div></div>'
   :'<div class="kpis"><div class="kpi"><div class="l">قيمة المخزون بالتكلفة</div><div class="v">'+money(T.cost)+'<small>ج</small></div></div><div class="kpi"><div class="l">هيتباع بـ</div><div class="v">'+money(T.sale)+'<small>ج</small></div></div><div class="kpi hl"><div class="l">المكسب</div><div class="v">'+money(P)+'<small>ج</small></div></div><div class="kpi"><div class="l">نسبة الربح على التكلفة</div><div class="v '+cl(P)+'">'+pctS(pct(P,T.cost))+'</div></div><div class="kpi"><div class="l">هامش الربح من البيع</div><div class="v">'+pctS(pct(P,T.sale))+'</div></div></div>';
  var cr=CATS.filter(function(c){return D.cat[c[0]].cost||D.cat[c[0]].sale}).map(function(c){var r=D.cat[c[0]],p=r.sale-r.cost;return '<tr><td class="l">'+(doc?c[2]:catPill(c[0]))+'</td><td class="n">'+money(r.cost)+'</td><td class="n">'+money(r.sale)+'</td><td class="n b '+cl(p)+'">'+money(p)+'</td><td class="n">'+pctS(pct(p,r.cost))+'</td></tr>'});
  var ct='<tr class="tot"><td>الإجمالي</td><td class="n">'+money(T.cost)+'</td><td class="n">'+money(T.sale)+'</td><td class="n">'+money(P)+'</td><td class="n">'+pctS(pct(P,T.cost))+'</td></tr>';
  var ir=D.rows.sort(function(a,b){return b.pr-a.pr}).map(function(x){var spCell=doc?money(x.sp)+(x.est?' *':''):'<input class="lsell" data-id="'+x.it.id+'" inputmode="decimal" value="'+(x.it.sell||'')+'" placeholder="'+money(x.sp)+'" style="width:90px;padding:6px;text-align:center;'+(x.est?'border-color:var(--warn)':'')+'">';
    return '<tr><td class="l b">'+esc(x.it.name)+'</td><td class="n">'+fmt(x.qty)+'</td><td>'+esc(nm(x.it.unit))+'</td><td class="n">'+money(x.avg)+'</td><td class="n">'+spCell+'</td><td class="n">'+money(x.cost)+'</td><td class="n">'+money(x.sale)+'</td><td class="n b '+cl(x.pr)+'">'+money(x.pr)+'</td><td class="n">'+pctS(pct(x.pr,x.cost))+'</td></tr>'});
  var h1=['القسم','التكلفة','البيع','المكسب','% على التكلفة'],h2=['الصنف','الكمية','الوحدة','تكلفة الوحدة','سعر البيع','إجمالي التكلفة','إجمالي البيع','المكسب','% الربح'];
  var warn=(D.neg.length?'<div class="alert bad">أصناف رصيدها بالسالب ومش داخلة في الحساب: '+D.neg.map(esc).join('، ')+'</div>':'')+(D.noSell?'<div class="alert warn">'+D.noSell+' صنف من غير سعر بيع — اتحسبوا بالتكلفة + '+D.mk+'%. اكتب سعر البيع في الجدول تحت.</div>':'');
  var note='<div class="'+(doc?'note':'hint')+'" style="margin-top:8px">المكسب = (سعر البيع − متوسط تكلفة الشراء) × الكمية الموجودة. '+(D.noSell?'* سعر تقديري (التكلفة + '+D.mk+'%) لأن الصنف ملوش سعر بيع. ':'')+'نسبة الربح على التكلفة = المكسب ÷ التكلفة، والهامش = المكسب ÷ البيع.</div>';
  if(doc)return kp+(D.neg.length?'<div class="note neg">أصناف بالسالب مش محسوبة: '+D.neg.map(esc).join('، ')+'</div>':'')+'<h3>حسب القسم</h3>'+dTable(h1,cr,ct)+'<h3>حسب الصنف</h3>'+dTable(h2,ir)+note;
  function ht(h,rows,tot){return '<div class="tbl-wrap"><table><thead><tr>'+h.map(function(x,i){return '<th'+(i>0&&x!=='الوحدة'?' class="n"':'')+'>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+h.length+'" class="empty">المخزن فاضي</td></tr>')+(tot||'')+'</tbody></table></div>'}
  return kp+warn+'<div class="card no-print"><div class="field" style="margin:0"><label>نسبة ربح افتراضية للأصناف اللي ملهاش سعر بيع (%)</label><input inputmode="decimal" value="'+(D.mk||'')+'" placeholder="0" onchange="lsSet(\'provwh.liqmk\',num(this.value));render()"></div></div>'+
    '<div class="card"><h3>حسب القسم</h3>'+ht(h1,cr,ct)+'</div><div class="card"><h3>حسب الصنف <small class="c-sub" style="font-size:12px">(سعر البيع بيتعدّل من هنا)</small></h3>'+ht(h2,ir)+note+'</div>';
}
document.addEventListener('change',function(e){var el=e.target;if(!el.classList||!el.classList.contains('lsell'))return;var it=S.docs[el.getAttribute('data-id')];if(!it)return;var d=Object.assign({},it);d.sell=num(el.value);put(d);toast('اتحفظ سعر البيع لـ '+it.name);render()});
VIEWS.rep=function(){
  var top='<h2 class="sec">📈 التقارير</h2><div class="chips no-print"><div class="chip'+(rpV==='move'?' on':'')+'" onclick="rpV=\'move\';render()">📊 حركة الفترة</div><div class="chip'+(rpV==='liq'?' on':'')+'" onclick="rpV=\'liq\';render()">💰 تصفية المخزن</div></div>';
  if(rpV==='liq')return top+shareBar('liq',1)+catChips('render()')+'<p class="hint" style="margin-bottom:10px">لو اتباع كل اللي في المخزن دلوقتي بسعر البيع المسجّل لكل صنف.</p>'+liqBody(false);
  var rg=rpRange();
  return top+shareBar('rep',1)+
  '<div class="chips no-print">'+[['today','النهارده'],['week','آخر 7 أيام'],['month','الشهر ده'],['year','السنة دي'],['all','الكل'],['custom','فترة محددة']].map(function(x){return '<div class="chip'+(rpM===x[0]?' on':'')+'" onclick="rpM=\''+x[0]+'\';render()">'+x[1]+'</div>'}).join('')+'</div>'+
  (rpM==='custom'?'<div class="card no-print grid2"><div class="field"><label>من</label><input type="date" value="'+rg[0]+'" onchange="rpF=this.value;render()"></div><div class="field"><label>إلى</label><input type="date" value="'+rg[1]+'" onchange="rpT=this.value;render()"></div></div>':'')+
  '<p class="hint" style="text-align:center;margin-bottom:10px">'+repSub()+'</p>'+catChips('render()')+repBody(false);
};

/* ===== البيانات ===== */
VIEWS.data=function(){
  var bks=lsKeys().filter(function(k){return k&&k.indexOf(LS_BK)===0}).sort().reverse(),off=lsGet(LS_ON)==='OFF';
  return '<h2 class="sec">💾 البيانات والمزامنة</h2>'+
  '<div class="card"><h3>☁️ المزامنة</h3><p style="margin-bottom:8px"><span class="dot '+syncState.s+'"></span> '+esc(syncState.t)+'</p><p class="hint" style="margin-bottom:10px">كل حركة بتترفع لوحدها — جهازين يسجّلوا في نفس الوقت من غير ما حد يمسح شغل التاني.</p><button class="btn '+(off?'pri':'ghost')+' block" onclick="toggleSync()">'+(off?'▶️ شغّل المزامنة':'⏸️ وقّف المزامنة على الجهاز ده')+'</button></div>'+
  '<div class="card"><h3>📦 نسخ وتصدير</h3><div class="btnrow"><button class="btn ghost" onclick="exportJSON()">⬇️ نسخة JSON</button><button class="btn ghost" onclick="exportExcel()">📊 Excel</button><button class="btn ghost" onclick="$(\'impF\').click()">⬆️ استيراد/دمج</button></div><input type="file" id="impF" accept=".json" style="display:none" onchange="if(this.files[0])importJSON(this.files[0]);this.value=\'\'"><p class="hint" style="margin-top:8px">الاستيراد بيدمج بس — مش بيمسح حاجة.</p></div>'+
  '<div class="card"><h3>🗓️ نسخ يومية تلقائية</h3>'+(bks.length?bks.map(function(k){return '<div class="li"><span class="nm">'+arDate(k.slice(LS_BK.length))+'</span><button class="btn ghost sm" onclick="download(\'مخزن_بروفيجن_'+k.slice(LS_BK.length)+'.json\',lsGet(\''+k+'\'))">تنزيل</button></div>'}).join(''):'<p class="hint">لسه مفيش</p>')+'</div>'+
  '<p class="hint" style="text-align:center">المخزن · '+APP_VER+'</p>';
};
function download(name,text,type){var b=new Blob([text],{type:type||'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){download('مخزن_بروفيجن_'+today()+'.json',JSON.stringify({app:'provwh',ver:APP_VER,docs:S.docs}))}
function importJSON(file){var r=new FileReader();r.onload=function(){var o=null;try{o=JSON.parse(r.result)}catch(e){}if(!o||!o.docs){toast('الملف مش نسخة من البرنامج ده',1);return}
  var n=0,ids=[];for(var k in o.docs){var d=o.docs[k];if(!validDoc(d,k))continue;var l=S.docs[k];if(!l||d.u>l.u){S.docs[k]=d;n++;ids.push(k)}}persist();pushDocs(ids);toast('اتدمج '+n+' سجل');render()};r.readAsText(file)}
function exportExcel(){
  var L=ledger(),cm=costMap(),h='<html dir="rtl"><head><meta charset="UTF-8"></head><body>';
  function T(t,hd,rows){h+='<h3>'+t+'</h3><table border="1" cellpadding="4"><tr>'+hd.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table><br>'}
  T('الرصيد',['الصنف','القسم','الوحدة','الرصيد','متوسط التكلفة','القيمة'],items().map(function(i){var r=L[i.id];return [i.name,catOf(i.cat)[2],nm(i.unit),r3(r.qty),r3(r.avg),r3(r.val)]}));
  T('الوارد',['التاريخ','الصنف','الكمية','سعر الشراء','الإجمالي','المورد','ملاحظة'],moves('in').map(function(m){return [m.date,nm(m.item),m.qty,m.price,r3(m.qty*m.price),m.party||'',m.note||'']}));
  T('المنصرف',['التاريخ','الصنف','الكمية','سعر البيع','الإجمالي','الربح','العميل','ملاحظة'],moves('out').map(function(m){return [m.date,nm(m.item),m.qty,m.price,r3(m.qty*m.price),m.price?r3((m.price-(cm[m.id]||0))*m.qty):'',m.party||'',m.note||'']}));
  download('مخزن_بروفيجن_'+today()+'.xls','﻿'+h+'</body></html>','application/vnd.ms-excel');
}
function dailyBackup(){var k=LS_BK+today();if(lsGet(k)||!all('in').length)return;lsSet(k,JSON.stringify({docs:S.docs}));lsKeys().filter(function(x){return x&&x.indexOf(LS_BK)===0}).sort().slice(0,-10).forEach(lsDel)}

/* ===== المزامنة ===== */
var fbDb=null,fbRoot=null,fbL=false,syncState={s:'wait',t:'...'};
function syncUI(s,t){syncState={s:s,t:t};var d=$('syncDot'),x=$('syncTxt');if(d)d.className='dot '+s;if(x)x.textContent=t}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function initSync(){
  if(lsGet(LS_ON)==='OFF'){syncUI('','محلي فقط');return}
  syncUI('wait','بيتصل...');var V='https://www.gstatic.com/firebasejs/10.12.2/';
  (window.firebase&&window.firebase.database?Promise.resolve():loadScript(V+'firebase-app-compat.js').then(function(){return loadScript(V+'firebase-database-compat.js')})).then(function(){
    var app;try{app=firebase.app('provwh')}catch(e){app=firebase.initializeApp(FB_CFG,'provwh')}
    if(!fbDb){fbDb=firebase.database(app);fbDb.ref('.info/serverTimeOffset').on('value',function(s){srvOff=+s.val()||0});
      fbDb.ref('.info/connected').on('value',function(s){if(lsGet(LS_ON)==='OFF')return;if(s.val())syncUI('on','متزامن');else syncUI('wait','أوفلاين')})}
    fbDb.goOnline();fbRoot=fbDb.ref(FB_PATH);
    if(!fbL){fbL=true;fbRoot.on('value',function(s){mergeCloud(s.val()||{})},function(e){syncUI('err','خطأ صلاحيات');console.warn(e)})}
  }).catch(function(){syncUI('err','مش متصل')});
}
function mergeCloud(c){var ch=false,up={};
  for(var k in c){var d=c[k];if(!validDoc(d,k))continue;var l=S.docs[k];if(!l||d.u>l.u){S.docs[k]=d;ch=true}}
  for(var k2 in S.docs){var l2=S.docs[k2],cd=c[k2];if(!cd||l2.u>(cd.u||0))up[k2]=l2}
  if(Object.keys(up).length&&fbRoot)fbRoot.update(clean(up)).catch(console.warn);
  if(ch){persist();softRender()}}
function pushDocs(ids){if(!fbRoot)return;var u={};ids.forEach(function(id){if(S.docs[id])u[id]=S.docs[id]});fbRoot.update(clean(u)).catch(function(){syncUI('err','فشل الرفع')})}
function toggleSync(){if(lsGet(LS_ON)==='OFF'){lsSet(LS_ON,'1');initSync()}else{lsSet(LS_ON,'OFF');if(fbRoot){fbRoot.off('value');fbL=false}if(fbDb)fbDb.goOffline();fbRoot=null;syncUI('','محلي فقط')}render()}

/* ===== عام ===== */
function applyTheme(){var t=lsGet(LS_THEME);if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;lsSet(LS_THEME,dark?'light':'dark');applyTheme()}
document.addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});
window.addEventListener('storage',function(e){if(e.key===LS_KEY){load();softRender()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){dailyBackup();if(!typing())render()}});
applyTheme();load();persist();dailyBackup();render();initSync();
</script>
</body>
