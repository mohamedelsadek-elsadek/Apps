<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>تسجيل وتصنيع</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2739;--line:#2a3550;--tx:#e8edf7;--mut:#8b97b0;--acc:#4f8cff;--ok:#2ecc8f;--warn:#f5a524;--bad:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;padding:0 0 calc(80px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(15,20,32,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;flex:1}
.ver{font-size:11px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ok)}.dot.err{background:var(--bad)}.dot.wait{background:var(--warn)}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:10px;color:var(--mut);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;min-height:44px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(23,30,46,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:10px 0 8px;cursor:pointer}
nav.tabs button b{display:block;font-size:19px;font-weight:400}
nav.tabs button.on{color:var(--acc)}
.page{display:none}.page.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card2);border-radius:12px;padding:10px}
.kpi small{color:var(--mut);font-size:12px;display:block}
.kpi b{font-size:20px;display:block}
.bar{margin:8px 0}
.bar .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:3px}
.bar .t span:last-child{color:var(--mut)}
.bar .tr{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .fl{height:100%;background:var(--acc);border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 10px;margin:3px;font-size:13px}
.chip button{background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer;padding:0 2px}
.chip button.x{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:20px}
.mut{color:var(--mut);font-size:12px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ok);color:#06251a;padding:9px 18px;border-radius:20px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
/* ===== جدول إكسيل ===== */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.xg{border-collapse:collapse;width:100%;min-width:1120px;font-size:14px}
.xg th{position:sticky;top:0;background:var(--card2);color:var(--mut);font-weight:600;font-size:12px;padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.xg td{border-bottom:1px solid var(--line);border-left:1px solid rgba(42,53,80,.5);padding:0;vertical-align:middle}
.xg tr.grp td{background:#131a29;padding:9px 10px;font-weight:700;color:var(--acc);border-left:0}
.xg tr.grp td .mut{font-weight:400;margin-right:6px}
.xg tr.grp button{float:left}
.xg tr.cur td{background:rgba(79,140,255,.07)}
.xg .n{width:34px;text-align:center;color:var(--mut);font-size:12px}
.xl{border:0!important;border-radius:0;background:transparent;min-height:40px;padding:8px;font-size:14px;color:var(--tx);width:100%}
.xl:focus{outline:2px solid var(--acc);outline-offset:-2px;background:rgba(79,140,255,.08)}
select.xl{padding-left:4px}
.xl.flash{animation:fl .9s}
@keyframes fl{0%{background:rgba(46,204,143,.35)}100%{background:transparent}}
.prog{padding:0 8px;min-width:120px}
.prog .tr{height:7px;background:var(--card2);border-radius:5px;overflow:hidden}
.prog .fl{height:100%;border-radius:5px}
.prog small{display:block;font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.del{background:none;border:0;color:var(--mut);font-size:16px;min-width:36px;min-height:38px;cursor:pointer}
.tl{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl:last-child{border:0}
.tl .mut{display:block}
.st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--card2)}
.alert{background:rgba(245,165,36,.1);border:1px solid rgba(245,165,36,.4);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.alert b{color:var(--warn)}
.alert div{margin-top:4px}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🧪 تسجيل وتصنيع <span class="ver" id="verTag"></span></h1>
  <span id="syncTxt" class="mut">—</span><span id="syncDot" class="dot"></span>
</header>

<main>
<!-- ============ الأصناف ============ -->
<section class="page on" id="pg-items">
  <div class="card" style="padding:10px">
    <div class="grid2">
      <div><label>الشركة</label><select id="qCo"></select></div>
      <div><label>المرحلة</label><select id="qSt"></select></div>
    </div>
    <div style="margin-top:8px"><input id="qTxt" placeholder="بحث بالاسم أو المادة الفعالة..."></div>
  </div>
  <div class="tbl-wrap"><table class="xg" id="grid"></table></div>
  <p class="mut" style="margin:8px 4px">اكتب في الخانة على طول — Enter ينزل، الأسهم بتتنقل، والحفظ تلقائي. تغيير المرحلة بيتسجل في السجل ويحدّث التاريخ للشهر الحالي.</p>
</section>

<!-- ============ اللوحة ============ -->
<section class="page" id="pg-dash"><div id="dashBody"></div></section>

<!-- ============ السجل ============ -->
<section class="page" id="pg-log">
  <div class="card"><h2>تحركات المراحل</h2><div id="logList"></div></div>
</section>

<!-- ============ الإعدادات ============ -->
<section class="page" id="pg-set">
  <div class="card">
    <h2>الشركات</h2>
    <div id="coChips"></div>
    <div class="row" style="margin-top:8px"><input id="newCo" placeholder="شركة جديدة" style="flex:1"><button class="btn sm" id="addCo">إضافة</button></div>
  </div>
  <div class="card">
    <h2>مراحل التسجيل (بالترتيب)</h2>
    <p class="mut" style="margin-bottom:6px">الترتيب ده هو اللي بيحسب نسبة التقدم. ▲▼ لتغيير الترتيب.</p>
    <div id="stChips"></div>
    <div class="row" style="margin-top:8px"><input id="newSt" placeholder="مرحلة جديدة" style="flex:1"><button class="btn sm" id="addSt">إضافة</button></div>
  </div>
  <div class="card">
    <h2>المزامنة والنسخ الاحتياطي</h2>
    <p class="mut" id="syncInfo" style="margin-bottom:10px"></p>
    <div class="row">
      <button class="btn sec sm" id="syncToggle"></button>
      <button class="btn sec sm" id="expBtn">تصدير JSON</button>
      <button class="btn sec sm" id="impBtn">استيراد نسخة</button>
      <button class="btn sec sm" id="csvBtn">تصدير Excel (CSV)</button>
      <input type="file" id="impFile" accept=".json,application/json" style="display:none">
    </div>
  </div>
</section>
</main>

<nav class="tabs">
  <button data-p="items" class="on"><b>📋</b>الأصناف</button>
  <button data-p="dash"><b>📊</b>اللوحة</button>
  <button data-p="log"><b>🕘</b>السجل</button>
  <button data-p="set"><b>⚙️</b>الإعدادات</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
var APP_VER = '1.2';
var DEFAULT_FB = {
  apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",
  authDomain:"my-app-sync-11ad9.firebaseapp.com",
  databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",

var FB_PATH = 'reg_mfg';
var LS_KEY='regmfg.state.v1', LS_ON='regmfg.sync.on', LS_DEV='regmfg.sync.dev', LS_BK='regmfg.bk.', BK_KEEP=15;
var UNKNOWN='غير معروف';
var DEF_STAGES=[UNKNOWN,'لم يبدأ','سوفت فايل','موافقة سير','لجنة إخطار','إخطار','Pilot batch','مطابقة معامل','ثبات','تسجيل نهائي','تصنيع'];
var DEF_COS=['Unison','Nutrivit','Bio Vac','Elanomax'];
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
/* البيانات الأولى من الورق — أرقام ثابتة عشان لو جهازين فتحوا أول مرة مايتكررش */
var SEED=[
 ['Unison','Unitylocare','Tylosin tartrate','945,000 IU/g','إخطار','','تم استيفاء آلية الفحص','WSP'],
 ['Unison','Amikastax','Amikacin (as sulfate)','250 mg/ml','إخطار','','تم تقديم آلية الفحص','Injectable solution'],
 ['Unison','Tilmiclesti','Tilmicosin (as phosphate)','250 mg/ml','موافقة سير','2024-12','مطلوب تصنيع البايلوت','Solution for use in drinking water'],
 ['Unison','Streptomycin Unison Health Care','Streptomycin sulfate','100 g/100 g (= 80 g base)','موافقة سير','2025-06','في انتظار استلام موافقة السير','WSP'],
 ['Nutrivit','Optipencivet','Amoxicillin','400 mg','إخطار','','',''],
 ['Nutrivit','Nutrohyclate','Doxycycline (as hyclate)','200 mg/g','مطابقة معامل','','تم تقديم الملف للفحص','WSP'],
 ['Nutrivit','Nutrohyclate 50%','Doxycycline hyclate','500 mg/g','مطابقة معامل','','تم تقديم الملف للفحص','WSP'],
 ['Nutrivit','Rolitrosis','Amprolium','200 mg','مطابقة معامل','','التالي: ثبات',''],
 ['Nutrivit','Tyloseptamin','Tylosin tartrate','1.1 g/1.1 g',UNKNOWN,'','تم تقديم الملف للفحص','WSP'],
 ['Bio Vac','Tylosin Bio Vac Pharma','Tylosin tartrate','1000 mg/g','Pilot batch','','مطلوب تصنيع البايلوت','WSP'],
 ['Bio Vac','Difloxacin BioVac','Difloxacin','100 mg','موافقة سير','2025-10','',''],
 ['Bio Vac','Lincomycin/Spectinomycin Bio Vac Pharma','Lincomycin (as HCl) / Spectinomycin (as sulphate)','222 mg / 444.7 mg per g','موافقة سير','2025-05','مطلوب تصنيع البايلوت','WSP'],
 ['Elanomax','Elanoprocoxid','Amprolium (as HCl)','200 g/kg','لجنة إخطار','','ملف المعامل في الفحص','WSP'],
 ['Elanomax','Elanodiplomac','Difloxacin HCl','100 mg','لجنة إخطار','','تم تسليم ملف المعامل','Oral solution'],
 ['Elanomax','Elanonecrobiotic','Lincomycin (as HCl)','44 mg/g','لجنة إخطار','','ملف المعامل أخد استيفاء وفي انتظار العينات من مارتيروس','Premix'],
 ['Elanomax','Marbolisarvix','Marbofloxacin','100 mg/ml','موافقة سير','2024-12','مطلوب تصنيع البايلوت','Solution for injection'],
 ['Elanomax','Elanoprojac','Amikacin (as sulfate)','250 mg/ml','موافقة سير','','مطلوب تصنيع البايلوت','Sterile aqueous solution'],
 ['Elanomax','Drostakan','Narasin + Nicarbazin','80 g + 80 g /kg','سوفت فايل','','في انتظار استلام موافقة السير','Oral granular premix']
];
var SEED_PV=2;

/* items: {id:{id,co,nm,ai,cc,st,sd,nt,o,u,h:[{f,s,t}]}}  أو شاهد حذف {id,del:1,u}
   meta: co/st : {key:{n,o,u,del}} */
var S={items:{},meta:{co:{},st:{}}};

function $(id){return document.getElementById(id)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function lsKeys(){var o=[];try{for(var i=0;i<localStorage.length;i++)o.push(localStorage.key(i))}catch(e){}return o}
function fk(name){return encodeURIComponent(String(name)).replace(/\./g,'%2E')}
var srvOff=0;
function now(){return Date.now()+srvOff}
function stamp(prev){var t=now();return prev&&prev.u>=t?prev.u+1:t}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function thisMonth(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function niceM(s){if(!/^\d{4}-\d{2}$/.test(s||''))return '';return MONTHS[+s.slice(5)-1]+' '+s.slice(0,4)}
function niceT(t){if(!t||t<1000)return '';var d=new Date(t);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
var tT;function toast(msg,bad){var t=$('toast');t.textContent=msg;t.style.background=bad?'var(--bad)':'var(--ok)';t.style.color=bad?'#fff':'#06251a';t.classList.add('show');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('show')},bad?3200:1600)}

function defaultMeta(){
  var m={co:{},st:{}};
  DEF_COS.forEach(function(n,i){m.co[fk(n)]={n:n,o:i,u:0}});
  DEF_STAGES.forEach(function(n,i){m.st[fk(n)]={n:n,o:i,u:0}});
  return m;
}
function names(map){
  return Object.keys(map||{}).map(function(k){return map[k]}).filter(function(x){return x&&!x.del&&typeof x.n==='string'})
    .sort(function(a,b){return (a.o||0)-(b.o||0)}).map(function(x){return x.n});
}
function cos(){return names(S.meta.co)}
function stages(){return names(S.meta.st)}
/* v1.1: «تم التقديم» اتغيرت لـ «موافقة سير» */
var RENAMES=[['تم التقديم','موافقة سير']];
function migrateNames(){
  var batch={},ch=false;
  RENAMES.forEach(function(rn){
    var ok=fk(rn[0]),nk=fk(rn[1]),oe=S.meta.st[ok];
    if(oe&&!oe.del){
      if(!S.meta.st[nk]||S.meta.st[nk].del){S.meta.st[nk]={n:rn[1],o:oe.o,u:stamp(S.meta.st[nk])};batch['meta/st/'+nk]=S.meta.st[nk]}
      S.meta.st[ok]={n:rn[0],o:oe.o,u:stamp(oe),del:1};batch['meta/st/'+ok]=S.meta.st[ok];ch=true;
    }
    for(var k in S.items){var it=S.items[k];if(!it||it.del)continue;
      var hit=it.st===rn[0]||(it.h||[]).some(function(e){return e.f===rn[0]||e.s===rn[0]});
      if(!hit)continue;
      var n=JSON.parse(JSON.stringify(it)); if(n.st===rn[0])n.st=rn[1];
      (n.h||[]).forEach(function(e){if(e.f===rn[0])e.f=rn[1];if(e.s===rn[0])e.s=rn[1]});
      n.u=stamp(it);S.items[k]=n;batch['items/'+k]=n;ch=true;
    }
  });
  if(ch){persist();if(fbRoot)fbRoot.update(batch).catch(warn)}
  return ch;
}
/* v1.2: تصحيح الأسماء والمواد من شيت Follow up — مابيغيرش المرحلة.
   بيشتغل بعد أول دمج مع السحابة عشان مايمسحش تعديل اتعمل على جهاز تاني */
function patchV2(){
  var batch={},ch=false;
  function metaRen(kind,o,n){var ok=fk(o),nk=fk(n),oe=S.meta[kind][ok];if(!oe||oe.del)return;
    if(!S.meta[kind][nk]||S.meta[kind][nk].del){S.meta[kind][nk]={n:n,o:oe.o,u:stamp(S.meta[kind][nk])};batch['meta/'+kind+'/'+nk]=S.meta[kind][nk]}
    S.meta[kind][ok]={n:o,o:oe.o,u:stamp(oe),del:1};batch['meta/'+kind+'/'+ok]=S.meta[kind][ok];ch=true}
  metaRen('co','BioVac','Bio Vac');
  var sk=fk('سوفت فايل');
  if(!S.meta.st[sk]){var ms=S.meta.st[fk('موافقة سير')];S.meta.st[sk]={n:'سوفت فايل',o:ms?ms.o-0.5:1.5,u:1};batch['meta/st/'+sk]=S.meta.st[sk];ch=true}
  for(var k in S.items){var it=S.items[k];if(!it||it.del)continue;
    var m=/^eseed(\d+)$/.exec(k), r=m&&SEED[+m[1]-1], n=null;
    if(r&&(it.pv||0)<SEED_PV){n=JSON.parse(JSON.stringify(it));n.co=r[0];n.nm=r[1];n.ai=r[2];n.cc=r[3];n.nt=r[6];n.df=r[7]||'';n.pv=SEED_PV}
    else if(it.co==='BioVac'){n=JSON.parse(JSON.stringify(it));n.co='Bio Vac'}
    if(n){n.u=stamp(it);S.items[k]=n;batch['items/'+k]=n;ch=true}
  }
  if(ch){persist();if(fbRoot)fbRoot.update(batch).catch(warn)}
  return ch;
}
function validItem(k,it){
  if(!it||typeof it!=='object'||it.id!==k||!/^e[a-z0-9]{4,30}$/.test(k)||typeof it.u!=='number') return false;
  if(it.del) return true;
  return typeof it.co==='string'&&it.co!==''&&typeof it.nm==='string'&&it.nm!==''&&typeof it.st==='string';
}
function validEntry(e){return e&&typeof e==='object'&&typeof e.n==='string'&&e.n!==''&&typeof e.u==='number'}
function seed(){
  var ch=false;
  SEED.forEach(function(r,i){var id='eseed'+pad(i+1); if(S.items[id]) return;
    S.items[id]={id:id,co:r[0],nm:r[1],ai:r[2],cc:r[3],st:r[4],sd:r[5],nt:r[6],df:r[7]||'',o:i,u:1,h:[],pv:SEED_PV}; ch=true});
  return ch;
}
function load(){
  var raw=lsGet(LS_KEY),o=null; if(raw){try{o=JSON.parse(raw)}catch(e){}}
  S.items={};
  if(o&&o.items){for(var k in o.items){if(validItem(k,o.items[k]))S.items[k]=o.items[k]}}
  S.meta=(o&&o.meta&&o.meta.co&&o.meta.st)?o.meta:defaultMeta();
  if(!cos().length) mergeMetaMap('co',defaultMeta().co);
  if(!stages().length) mergeMetaMap('st',defaultMeta().st);
  if(seed()) persist();
  migrateNames();
  if(lsGet(LS_ON)==='OFF') patchV2();
}
var warnedQuota=false;
function persist(){if(!lsSet(LS_KEY,JSON.stringify(S))){if(!warnedQuota){warnedQuota=true;toast('⚠️ مساحة الجهاز مليانة — صدّر نسخة',true)}return false}return true}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function devId(){var d=lsGet(LS_DEV);if(!d){d='dev-'+Math.random().toString(36).slice(2,8);lsSet(LS_DEV,d)}return d}
function live(){var out=[];for(var k in S.items){var it=S.items[k];if(it&&!it.del)out.push(it)}return out}

/* التقدم: ترتيب المرحلة من غير "غير معروف" */
function stIdx(st){var l=stages().filter(function(x){return x!==UNKNOWN});return {i:l.indexOf(st),n:l.length,next:l[l.indexOf(st)+1]||''}}
function progHTML(it){

function saveCell(el){

  if(f==='sd'&&v&&!/^\d{4}-\d{2}$/.test(v)){toast('التاريخ بالشكل 2025-06',true);el.value=el._last;return}

    el.style.color=v===UNKNOWN?'var(--bad)':'';

/* تنقل زي الإكسيل */
function xlGridAttach(tbl,onSave){
  function cell(r,c){return tbl.querySelector('.xl[data-r="'+r+'"][data-c="'+c+'"]')}
  function go(el,dr,dc){
    var r=+el.getAttribute('data-r'),c=+el.getAttribute('data-c'),t=null,guard=0;
    while(guard++<40){r+=dr;c+=dc;if(c<0||c>7||r<0)break;t=cell(r,c);if(t)break;if(dr&&!tbl.querySelector('.xl[data-r="'+r+'"]'))break}
    if(!t) return;
    if(el.value!==el._last) onSave(el);
    t.focus(); if(t.select&&t.type!=='month') try{t.select()}catch(e){}
  }
  tbl.addEventListener('keydown',function(e){
    var el=e.target; if(!el.classList||!el.classList.contains('xl')) return;
    var isSel=el.tagName==='SELECT';
    if(e.key==='Enter'){e.preventDefault();go(el,e.shiftKey?-1:1,0)}
    else if(e.key==='ArrowDown'&&!isSel){e.preventDefault();go(el,1,0)}
    else if(e.key==='ArrowUp'&&!isSel){e.preventDefault();go(el,-1,0)}
    else if(e.key==='ArrowRight'){ if(isSel||el.selectionStart===0||el.type==='month'){e.preventDefault();go(el,0,-1)} }
    else if(e.key==='ArrowLeft'){ if(isSel||el.type==='month'||el.selectionEnd===el.value.length){e.preventDefault();go(el,0,1)} }
  });
  tbl.addEventListener('change',function(e){var el=e.target;if(el.classList&&el.classList.contains('xl')&&el.value!==el._last)onSave(el)});
  tbl.addEventListener('focusin',function(e){var el=e.target;if(!el.classList||!el.classList.contains('xl'))return;var tr=el.closest('tr');if(tr)tr.classList.add('cur');if(el.select&&el.type!=='month')setTimeout(function(){try{el.select()}catch(x){}},0)});
  tbl.addEventListener('focusout',function(e){var tr=e.target.closest&&e.target.closest('tr');if(tr)tr.classList.remove('cur');setTimeout(flushRender,50)});
}

function mergeData(o){
  if(!o||typeof o.items!=='object') return -1;
  var n=0,batch={};

  if(o.meta){['co','st'].forEach(function(kind){mergeMetaMap(kind,o.meta[kind]).forEach(function(k){batch['meta/'+kind+'/'+k]=S.meta[kind][k]})})}

var fbDb=null,fbRoot=null,fbReady=false,fbListening=false;
function warn(e){console.warn(e)}
function syncUI(state,txt){$('syncDot').className='dot '+(state||'');$('syncTxt').textContent=txt||''}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src))};document.head.appendChild(s)})}
function initSync(){
  if(lsGet(LS_ON)==='OFF'){syncUI('','محلي');return}
  syncUI('wait',navigator.onLine?'بيتصل...':'أوفلاين');
  var V='https://www.gstatic.com/firebasejs/10.12.2/';
  (window.firebase?Promise.resolve():loadScript(V+'firebase-app-compat.js').then(function(){return loadScript(V+'firebase-database-compat.js')}))
  .then(function(){
    var app=firebase.apps.length?firebase.app():firebase.initializeApp(DEFAULT_FB);
    if(!fbDb){
      fbDb=firebase.database(app);
      fbDb.ref('.info/serverTimeOffset').on('value',function(s){srvOff=+s.val()||0});
      fbDb.ref('.info/connected').on('value',function(s){if(lsGet(LS_ON)==='OFF')return;if(s.val())syncUI('on','متزامن');else syncUI(fbReady?'wait':'err',fbReady?'أوفلاين':'مش متصل')});
    }
    fbDb.goOnline(); fbRoot=fbDb.ref(FB_PATH);
    if(!fbListening){fbListening=true;fbRoot.on('value',function(snap){mergeCloud(snap.val()||{})},function(err){syncUI('err','خطأ صلاحيات');warn(err)})}
  }).catch(function(e){syncUI('err','مش متصل');warn(e)});
}
function mergeMetaMap(kind,incoming){
  var loc=S.meta[kind]||(S.meta[kind]={}),newer=[]; incoming=incoming||{};
  for(var k in incoming){var e=incoming[k];if(!validEntry(e))continue;var l=loc[k];if(!l||e.u>l.u)loc[k]=e}
  for(var k2 in loc){var c=incoming[k2];if(!c||loc[k2].u>c.u)newer.push(k2)}
  return newer;
}
function mergeCloud(c){
  var ci=c.items||{},before=JSON.stringify(S.meta),changed=false,toPush={};
  for(var k in ci){var it=ci[k],l=S.items[k];if(!validItem(k,it))continue;if(!l||it.u>l.u){S.items[k]=it;changed=true}}
  for(var k2 in S.items){var li=S.items[k2],cl=ci[k2];if(!cl||li.u>(cl.u||0))toPush['items/'+k2]=li}
  var cm=c.meta||{};
  ['co','st'].forEach(function(kind){mergeMetaMap(kind,cm[kind]).forEach(function(k){toPush['meta/'+kind+'/'+k]=S.meta[kind][k]})});
  if(migrateNames()) changed=true;
  if(patchV2()) changed=true;
  if(JSON.stringify(S.meta)!==before) changed=true;
  if(Object.keys(toPush).length){toPush['lastDevice']=devId();toPush['ver']=APP_VER;fbRoot.update(toPush).catch(warn)}
  fbReady=true;
  if(changed){persist();pendingRender=true;flushRender()}
}
function pushItem(it){if(fbRoot){var u={};u['items/'+it.id]=it;u['lastDevice']=devId();fbRoot.update(u).catch(warn)}}
function pushMetaKey(kind,k){if(fbRoot){var u={};u['meta/'+kind+'/'+k]=S.meta[kind][k];fbRoot.update(u).catch(warn)}}
function toggleSync(){
  if(lsGet(LS_ON)==='OFF'){lsSet(LS_ON,'1');initSync()}
  else{lsSet(LS_ON,'OFF');if(fbRoot){fbRoot.off('value');fbListening=false}if(fbDb)fbDb.goOffline();fbRoot=null;fbReady=false;syncUI('','محلي')}
  renderSettings();
}

  curPage=p;
  Array.prototype.forEach.call(document.querySelectorAll('.page'),function(x){x.classList.toggle('on',x.id==='pg-'+p)});
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(x){x.classList.toggle('on',x.getAttribute('data-p')===p)});
  renderAll(); window.scrollTo(0,0);
}
function renderAll(){
  if(curPage==='items') renderGrid();
  else if(curPage==='dash') renderDash();
  else if(curPage==='log') renderLog();
  else renderSettings();
}
function onAction(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null; if(!b) return;
  var act=b.getAttribute('data-act');
  if(act==='add') addItem(b.getAttribute('data-co'));
  else if(act==='del') delItem(b.getAttribute('data-id'));
  else if(act==='rm') removeFrom(b.getAttribute('data-kind'),b.getAttribute('data-n'));
  else if(act==='mv') moveSt(b.getAttribute('data-n'),+b.getAttribute('data-d'));
}
function boot(){
  $('verTag').textContent='v'+APP_VER;
  load(); refreshFilters(); dailyBackup();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  xlGridAttach($('grid'),saveCell);
  document.addEventListener('click',onAction);
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){b.onclick=function(){showPage(b.getAttribute('data-p'))}});
  $('qCo').onchange=renderGrid; $('qSt').onchange=renderGrid; $('qTxt').oninput=renderGrid;
  $('addCo').onclick=function(){if(addToList('co',$('newCo').value)){$('newCo').value='';refreshFilters();renderSettings()}};
  $('addSt').onclick=function(){if(addToList('st',$('newSt').value)){$('newSt').value='';refreshFilters();renderSettings()}};
  $('syncToggle').onclick=toggleSync;
  $('expBtn').onclick=exportJSON; $('csvBtn').onclick=exportCSV;
  $('impBtn').onclick=function(){$('impFile').click()};
  $('impFile').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var o=null;try{o=JSON.parse(r.result)}catch(e){}var n=mergeData(o);toast(n<0?'الملف مش صالح':'اتضاف/اتحدث '+n+' صنف',n<0)};r.readAsText(f);this.value=''};
  window.addEventListener('online',function(){if(fbDb&&lsGet(LS_ON)!=='OFF')fbDb.goOnline()});
  window.addEventListener('storage',function(e){if(e.key===LS_KEY){load();pendingRender=true;flushRender()}});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){pendingRender=true;flushRender()}});
  renderAll(); initSync();
}
boot();
</script>
</body>
</html>
