<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4d3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصنع الكوثر">
<title>مصنع الكوثر للأعلاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f2ea;--surface:#ffffff;--surface2:#f9f7f1;--line:#e4dfd0;--ink:#1d2721;--sub:#626b63;--mut:#959c93;
  --pri:#146b55;--pri-d:#0f5242;--pri-soft:#e2f0ea;--on-pri:#ffffff;
  --acc:#c98516;--acc-soft:#fbefd8;
  --ok:#1a8f4c;--ok-soft:#e1f4e8;--warn:#b86f05;--warn-soft:#fdf0d9;--bad:#cc3434;--bad-soft:#fbe6e6;--info:#2d68ad;--info-soft:#e4eefa;
  --hero:linear-gradient(135deg,#0d4136 0%,#146b55 62%,#1c8266 100%);
  --sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1411;--surface:#17201b;--surface2:#1d2722;--line:#2a3630;--ink:#e6ece8;--sub:#a2ada5;--mut:#77827b;
    --pri:#3dbb92;--pri-d:#2fa27c;--pri-soft:#173a2f;--on-pri:#062019;
    --acc:#eeae48;--acc-soft:#3a2d15;
    --ok:#4cc982;--ok-soft:#163222;--warn:#f0b04a;--warn-soft:#3a2c14;--bad:#f07070;--bad-soft:#3b1c1c;--info:#7ab0ee;--info-soft:#1a2a3d;
    --hero:linear-gradient(135deg,#0a2a22 0%,#10453a 62%,#16584a 100%);
    --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1411;--surface:#17201b;--surface2:#1d2722;--line:#2a3630;--ink:#e6ece8;--sub:#a2ada5;--mut:#77827b;
  --pri:#3dbb92;--pri-d:#2fa27c;--pri-soft:#173a2f;--on-pri:#062019;
  --acc:#eeae48;--acc-soft:#3a2d15;
  --ok:#4cc982;--ok-soft:#163222;--warn:#f0b04a;--warn-soft:#3a2c14;--bad:#f07070;--bad-soft:#3b1c1c;--info:#7ab0ee;--info-soft:#1a2a3d;
  --hero:linear-gradient(135deg,#0a2a22 0%,#10453a 62%,#16584a 100%);
  --sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Cairo',-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hero{background:var(--hero);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:40;box-shadow:0 6px 20px rgba(10,50,40,.25)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
.hero h1{font-size:18px;font-weight:800;line-height:1.3}
.hero .meta{font-size:11.5px;opacity:.92;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa;margin-left:4px;vertical-align:middle}
.dot.on{background:#6ee7a8}.dot.wait{background:#fcd34d}.dot.err{background:#fca5a5}.dot.off{background:#cbd5d0}
.hacts{display:flex;gap:6px}
.hbtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hbtn:active{transform:scale(.92)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 10px;max-width:1100px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:7px 13px;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;border:none}
.tab.on{background:#fff;color:#0f5242}
.wrap{padding:14px 16px 24px;max-width:1100px;margin:0 auto}
h2.sec{font-size:19px;font-weight:800;margin:4px 2px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2.sec small{font-size:12px;color:var(--sub);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card.editing{border:2px solid var(--acc)}
.edit-tag{background:var(--acc-soft);color:var(--acc);font-weight:800;font-size:13px;padding:6px 12px;border-radius:10px;margin-bottom:12px;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.field{margin-bottom:11px;min-width:0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);font-size:16px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);background:var(--surface)}
input:disabled{opacity:.6}
input[type=date]{min-height:46px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{flex:1;padding:10px 6px;border:none;background:none;font-weight:700;color:var(--sub);cursor:pointer;font-size:14px}
.seg button.on{background:var(--pri);color:var(--on-pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;border:none;font-weight:800;font-size:14.5px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.acc{background:var(--acc-soft);color:var(--acc)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.wa{background:#25d366;color:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.ib{border:none;background:var(--surface2);border:1px solid var(--line);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--sub)}
.ib.bad{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surface2);color:var(--sub);padding:10px 9px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tr.tot td{font-weight:800;background:var(--pri-soft)}
td.n,th.n{text-align:left;direction:ltr}
td.strong{font-weight:800}
.c-pri{color:var(--pri)}.c-acc{color:var(--acc)}.c-bad{color:var(--bad)}.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-info{color:var(--info)}.c-sub{color:var(--sub)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:800}
.pill.m{background:var(--pri-soft);color:var(--pri)}
.pill.f{background:var(--acc-soft);color:var(--acc)}
.pill.s{background:var(--info-soft);color:var(--info)}
.pill.d{background:var(--warn-soft);color:var(--warn)}
.pill.g{background:var(--surface2);color:var(--sub);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--sub);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .v small{font-size:12px;color:var(--sub);font-weight:700;margin-right:3px}
.kpi.hl{background:var(--hero);color:#fff;border:none}
.kpi.hl .l,.kpi.hl .v small{color:rgba(255,255,255,.85)}
.alert{border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.info{background:var(--info-soft);color:var(--info)}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.hbar .nm{width:120px;flex-shrink:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:12px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.hbar .tr>div{height:100%;background:var(--pri);border-radius:7px}
.hbar .vl{width:92px;text-align:left;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:26px 12px;color:var(--mut);font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 13px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pri);color:var(--on-pri);border-color:transparent}
.hint{font-size:12px;color:var(--sub);line-height:1.7}
.prev{background:var(--surface2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.prev .t{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.prev table td{border:none;padding:4px 6px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;margin-bottom:6px}
.li .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li input{width:90px;padding:6px 8px;font-size:14px}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input,.addrow select{flex:1}
.rtab td,.rtab th{padding:6px}
.rtab input{width:70px;padding:7px 4px;text-align:center;font-size:15px;border-radius:9px}
.stk{position:sticky;right:0;z-index:1;background:var(--surface)!important;box-shadow:-1px 0 0 var(--line)}
th.stk{background:var(--surface2)!important}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bnav button{flex:1;background:none;border:none;color:var(--mut);font-size:10.5px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px}
.bnav button b{font-size:19px;font-weight:400}
.bnav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,15,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.mbox{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.mbox{border-radius:20px}}
.mbox h3{font-size:17px;font-weight:800;margin-bottom:10px}
.mbox .msg{color:var(--sub);margin-bottom:16px;line-height:1.8;font-size:14px}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad);color:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--hero);padding:20px}
.login .box{background:var(--surface);border-radius:22px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.print-head{display:none}
.daily .card h3{font-size:16.5px;border-bottom:2px solid var(--line);padding-bottom:8px}
.daily td,.daily th{font-size:14.5px;padding:11px 10px}
@media print{
  @page{size:A4;margin:12mm}
  :root{--bg:#fff;--surface:#fff;--surface2:#f3f4f2;--line:#bbb;--ink:#000;--sub:#333;--mut:#555;--pri:#0f5242;--pri-soft:#e6efe9;--acc:#8a5a00;--acc-soft:#f6ecd8}
  body{background:#fff;padding:0;font-size:12pt}
  .hero,.bnav,.no-print,.toast,.modal{display:none!important}
  .wrap{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  .print-head{display:block;text-align:center;border-bottom:3px solid #0f5242;padding-bottom:10px;margin-bottom:14px}
  .print-head h1{font-size:20px;color:#0f5242}
  .print-head p{font-size:13px;font-weight:700}
  .tbl-wrap{overflow:visible;border-color:#bbb}
  th,td,.pill,tr.tot td,.kpi.hl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
"use strict";
/* =====================================================================
   مصنع الكوثر للأعلاف — v40 (إعادة بناء كاملة)
   - كل سجل وثيقة مستقلة بختم وقت (u) وحذف ناعم (del) → مزامنة سجل بسجل
     من غير ما جهاز يمسح شغل جهاز تاني.
   - التصنيع بيحفظ الخامات المخصومة وقت التسجيل (use) → تعديل التركيبة
     بعدين مايغيّرش أرصدة الأيام اللي فاتت.
   ===================================================================== */
var APP_VER='v40';
var APP_NAME='مصنع الكوثر للأعلاف';
var FB_CFG={
  apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",
  authDomain:"my-app-sync-11ad9.firebaseapp.com",
  databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"my-app-sync-11ad9",
  storageBucket:"my-app-sync-11ad9.firebasestorage.app",
  messagingSenderId:"177039534756",
  appId:"1:177039534756:web:367ecccc684c2cdfdd1431"
};
var FB_PATH='feedmill/docs';
var LS_KEY='feedmill.state.v1',LS_SES='feedmill.session',LS_DEV='feedmill.dev',LS_ON='feedmill.sync.on',LS_BK='feedmill.bk.',LS_THEME='feedmill.theme';
var BK_KEEP=10;
var FORMS=['محبب','مفتت'];
var DTYPE={store:'من المخزن',direct:'صرف مباشر'};
var MOVE_T=['prod','disp','matin','matout','xfer','opf','opm','extra'];

/* ================= البيانات الأساسية (القوايم) — من غير أي حركات ================= */
var SEED_FEEDS=["سوبر بادى","بادى","نامى","ناهى","قليل بروتين","عجول 14%","عجول 16%","عجول 19%","د محمد البدوي"];
var SEED_MATS=["ذره","صويا","زيت","مركزات","جيلوتين","رده","كسب عباد","كسب بنجر","قشر صويا","رجيع كون","مستخلص بذرة قطن","ذره عويجه","مونو","اخرى 2","اخرى 3"];
var SEED_RECIPE={
  "ذره":[550,550,608,656,850,250,250,512,651],
  "صويا":[370,400.5,339.9,295.15,110,0,70,310,300],
  "زيت":[20,8,15,15,0,0,0,0,8],
  "مركزات":[40,41.5,37.1,33.85,40,28,30,28,33],
  "جيلوتين":[20,0,0,0,0,0,0,0,0],
  "رده":[0,0,0,0,0,200,150,150,0],
  "كسب عباد":[0,0,0,0,0,157,150,0,0],
  "كسب بنجر":[0,0,0,0,0,150,150,0,0],
  "قشر صويا":[0,0,0,0,0,215,200,0,0],
  "مونو":[0,14.5,11,7,0,0,0,0,8]
};
var SEED_STORES=["المخزن الرئيسي"];
var SEED_CUSTS=["مزرعة الكوثر","مزرعة 5&6","مزرعة الحاج عبد الباسط","مزرعة اللواء وفيق","مزرعة العجول الجبل","مزرعة شريف اشرف","نقدى","اللواء احمد جاد","ابراهيم السراج","هنجر ميت فضاله"];
var SEED_SUPPS=[];
var SEED_ROLES=[
  ['superadmin','سوبر أدمن',['all','users']],
  ['manager','مدير المصنع',['all']],
  ['owner','مالك (مشاهدة)',['view']],
  ['accountant','محاسب',['recipe','settings']],
  ['production','مدير إنتاج',['prod']],
  ['store','مدير مخزن',['disp','matdisp','matin']]
];
var FIXED_ROLES=SEED_ROLES.map(function(r){return r[0]});
var PERM_LABELS={all:'كل شيء',view:'مشاهدة فقط',prod:'التصنيع',disp:'صرف العلف والتحويل',matin:'وارد الخامات',matdisp:'صرف الخامات',recipe:'التركيبات',settings:'القوائم وأول المدة',users:'إدارة المستخدمين'};
var ALL_PERMS=['all','prod','disp','matin','matdisp','recipe','settings','users'];

function seedDocs(){
  var d=[];
  SEED_MATS.forEach(function(n,i){d.push({id:'m'+(i+1),t:'mat',name:n,ord:i+1,min:0,u:1,c:1})});
  SEED_FEEDS.forEach(function(n,i){
    var r={};
    SEED_MATS.forEach(function(m,j){var v=(SEED_RECIPE[m]||[])[i]||0; if(v) r['m'+(j+1)]=v;});
    d.push({id:'f'+(i+1),t:'feed',name:n,ord:i+1,recipe:r,u:1,c:1});
  });
  SEED_STORES.forEach(function(n,i){d.push({id:'s'+(i+1),t:'store',name:n,ord:i+1,u:1,c:1})});
  SEED_CUSTS.forEach(function(n,i){d.push({id:'c'+(i+1),t:'cust',name:n,ord:i+1,u:1,c:1})});
  SEED_SUPPS.forEach(function(n,i){d.push({id:'p'+(i+1),t:'supp',name:n,ord:i+1,u:1,c:1})});
  SEED_ROLES.forEach(function(r){d.push({id:'r_'+r[0],t:'role',key:r[0],label:r[1],perms:r[2].slice(),u:1,c:1})});
  d.push({id:'u_admin',t:'user',login:'admin',pass:'0000',name:'المدير العام',role:'superadmin',u:1,c:1});
  return d;
}

/* ================= أدوات ================= */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(ds,n){var p=ds.split('-');var d=new Date(+p[0],p[1]-1,+p[2]);d.setDate(d.getDate()+n);return ymd(d)}
function arDate(ds){if(!ds)return '';var p=ds.split('-');var d=new Date(+p[0],p[1]-1,+p[2]);try{return d.toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}catch(e){return ds}}
function shortDate(ds){if(!ds)return '';var p=ds.split('-');return (+p[2])+'/'+(+p[1])}
function toEn(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776})}
function num(v){v=toEn(v).replace(/[,،\s]/g,'').replace('٫','.');var n=parseFloat(v);return isFinite(n)?n:0}
function r3(n){return Math.round((+n||0)*1000)/1000}
function fmt(n){n=+n||0;if(Math.abs(n)<0.0005)n=0;return n.toLocaleString('en-US',{maximumFractionDigits:2})}
function fmtT(kg){return ((+kg||0)/1000).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:2})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function lsKeys(){var o=[];try{for(var i=0;i<localStorage.length;i++)o.push(localStorage.key(i))}catch(e){}return o}
function sumBy(arr,k){return arr.reduce(function(s,x){return s+(+x[k]||0)},0)}
function inRange(d,from,to){if(from&&d<from)return false;if(to&&d>to)return false;return true}
var srvOff=0;
function now(){return Date.now()+srvOff}
function devName(){return lsGet(LS_DEV)||'جهاز'}

var S={docs:{}};
function load(){
  S.docs={};
  try{var o=JSON.parse(lsGet(LS_KEY)||'null');if(o&&o.docs&&typeof o.docs==='object')S.docs=o.docs}catch(e){}
  seedDocs().forEach(function(d){if(!S.docs[d.id])S.docs[d.id]=d});
}
function persist(){
  if(!lsSet(LS_KEY,JSON.stringify({docs:S.docs,ver:APP_VER}))){
    lsKeys().filter(function(k){return k&&k.indexOf(LS_BK)===0}).sort().slice(0,-2).forEach(lsDel);
    if(!lsSet(LS_KEY,JSON.stringify({docs:S.docs,ver:APP_VER})))toast('مساحة التخزين في المتصفح ممتلئة — نزّل نسخة احتياطية',1);
  }
}
function clean(o){return JSON.parse(JSON.stringify(o))}
function stamp(d){var t=now();d.u=t;if(!d.c)d.c=t;d.by=(cur&&cur.name?cur.name:'')+' · '+devName();return d}
function put(d){stamp(d);S.docs[d.id]=clean(d);persist();pushDocs([d.id])}
function putMany(arr){if(!arr.length)return;arr.forEach(function(d){stamp(d);S.docs[d.id]=clean(d)});persist();pushDocs(arr.map(function(d){return d.id}))}
function removeDoc(id){var d=S.docs[id];if(!d)return;d=Object.assign({},d);d.del=1;put(d)}
function all(t){var o=[];for(var k in S.docs){var d=S.docs[k];if(d&&d.t===t&&!d.del)o.push(d)}return o}
function list(t){return all(t).sort(function(a,b){return (a.ord||0)-(b.ord||0)||String(a.name).localeCompare(String(b.name),'ar')})}
function nm(id){var d=S.docs[id];return d?(d.name||d.label||id)+(d.del?' (محذوف)':''):'—'}
function moves(t){return all(t).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((b.c||0)-(a.c||0))})}
function validDoc(d,k){return d&&typeof d==='object'&&d.id===k&&typeof d.t==='string'&&typeof d.u==='number'}

function calcUse(feedId,qty){
  var f=S.docs[feedId],r=(f&&f.recipe)||{},u={};
  for(var m in r){var kg=+r[m]||0;if(kg>0&&S.docs[m]&&!S.docs[m].del)u[m]=r3(qty*kg/1000)}
  return u;
}
function recipeTotal(f){var s=0,r=(f&&f.recipe)||{};list('mat').forEach(function(m){s+=+r[m.id]||0});return r3(s)}
/* رصيد العلف: حسب النوع والشكل، لمخزن معيّن أو الكل، لحد تاريخ معيّن */
function feedLedger(upTo,store,excl){
  var m={};
  function g(f,fo){var k=f+'|'+fo;return m[k]||(m[k]={feed:f,form:fo,open:0,prod:0,xin:0,xout:0,disp:0,direct:0})}
  list('feed').forEach(function(f){FORMS.forEach(function(fo){g(f.id,fo)})});
  all('opf').forEach(function(o){if(!store||o.store===store)g(o.feed,o.form).open+=+o.qty||0});
  all('prod').forEach(function(p){if(p.id!==excl&&(!upTo||p.date<=upTo)&&(!store||p.store===store))g(p.feed,p.form).prod+=+p.qty||0});
  all('disp').forEach(function(p){if(p.id!==excl&&(!upTo||p.date<=upTo)&&(!store||p.store===store)){var r=g(p.feed,p.form);r.disp+=+p.qty||0;if(p.type==='direct')r.direct+=+p.qty||0}});
  if(store)all('xfer').forEach(function(x){if(x.id===excl||(upTo&&x.date>upTo))return;if(x.to===store)g(x.feed,x.form).xin+=+x.qty||0;if(x.from===store)g(x.feed,x.form).xout+=+x.qty||0});
  for(var k in m){var r=m[k];r.bal=r3(r.open+r.prod+r.xin-r.xout-r.disp)}
  return m;
}
function feedAvail(feed,form,store,excl){var r=feedLedger(null,store,excl)[feed+'|'+form];return r?r.bal:0}
function matLedger(upTo,excl){
  var m={};
  list('mat').forEach(function(x){m[x.id]={mat:x.id,open:0,inc:0,cons:0,sold:0}});
  function g(id){return m[id]}
  all('opm').forEach(function(o){var r=g(o.mat);if(r)r.open+=+o.qty||0});
  all('matin').forEach(function(x){if(x.id===excl||(upTo&&x.date>upTo))return;var r=g(x.mat);if(r)r.inc+=+x.qty||0});
  all('prod').forEach(function(p){if(p.id===excl||(upTo&&p.date>upTo))return;var u=p.use||{};for(var k in u){var r=g(k);if(r)r.cons+=+u[k]||0}});
  all('matout').forEach(function(x){if(x.id===excl||(upTo&&x.date>upTo))return;var r=g(x.mat);if(r)r.sold+=+x.qty||0});
  for(var k in m){var r=m[k];r.bal=r3(r.open+r.inc-r.cons-r.sold)}
  return m;
}
function matAvgPrice(matId){
  var q=0,v=0;all('matin').forEach(function(x){if(x.mat===matId&&+x.price>0&&+x.qty>0){q+=+x.qty;v+=x.qty*x.price}});
  return q?v/q:0;
}
/* متوسط الاستهلاك اليومي (تصنيع + بيع) آخر 14 يوم → تكفي كام يوم */
function matDailyUse(){
  var from=addDays(today(),-13),to=today(),o={};
  all('prod').forEach(function(p){if(!inRange(p.date,from,to))return;var u=p.use||{};for(var k in u)o[k]=(o[k]||0)+(+u[k]||0)});
  all('matout').forEach(function(x){if(inRange(x.date,from,to))o[x.mat]=(o[x.mat]||0)+(+x.qty||0)});
  for(var k in o)o[k]=o[k]/14;
  return o;
}
function isUsed(id){
  for(var k in S.docs){var d=S.docs[k];if(!d||d.del)continue;
    if(d.feed===id||d.mat===id||d.store===id||d.cust===id||d.supp===id||d.from===id||d.to===id)return true;}
  return false;
}

function fSel(id,label,t,sel,o){
  o=o||{};
  var items=list(t),opts='';
  if(o.blank)opts+='<option value="">'+o.blank+'</option>';
  if(sel&&!items.some(function(d){return d.id===sel})&&S.docs[sel])opts+='<option value="'+sel+'" selected>'+esc(nm(sel))+'</option>';
  opts+=items.map(function(d){return '<option value="'+d.id+'"'+(d.id===sel?' selected':'')+'>'+esc(d.name)+'</option>'}).join('');
  if(o.newLabel)opts+='<option value="__new">➕ '+o.newLabel+'</option>';
  var ch=(o.newLabel?'onNewOpt(this,\''+t+'\');':'')+(o.on||'');
  return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'"'+(ch?' onchange="'+ch+'"':'')+'>'+opts+'</select></div>';

  if(el.value!=='__new')return;
  var n=(prompt(NEW_LBL[t]||'الاسم:')||'').trim();
  if(!n){el.selectedIndex=0;return}
  var ex=list(t).filter(function(d){return d.name===n})[0];

VIEWS.dash=function(){
  var t=today();

  var fl=feedLedger(null,null),ml=matLedger(null),du=matDailyUse();
  var frows=[],ftot=0;
  list('feed').forEach(function(f){var b=0;FORMS.forEach(function(fo){b+=fl[f.id+'|'+fo].bal});if(Math.abs(b)>0.001)frows.push([f.name,b]);ftot+=b});
  var mtot=0;for(var k in ml)mtot+=ml[k].bal;
  var al=[];
  list('feed').forEach(function(f){FORMS.forEach(function(fo){var r=fl[f.id+'|'+fo];if(r.bal<-0.001)al.push(['bad','رصيد '+f.name+' '+fo+' بالسالب ('+fmt(r.bal)+' كجم) — راجع التصنيع أو الصرف'])})});
  list('mat').forEach(function(m){var r=ml[m.id];
    if(r.bal<-0.001)al.push(['bad','خامة '+m.name+' بالسالب ('+fmt(r.bal)+' كجم) — في وارد مش متسجل']);
    else if(m.min>0&&r.bal<m.min)al.push(['warn',m.name+' تحت الحد الأدنى ('+fmt(r.bal)+' من '+fmt(m.min)+' كجم)']);
    else if(du[m.id]>0&&r.bal/du[m.id]<3)al.push(['warn',m.name+' تكفي حوالي '+Math.max(0,Math.floor(r.bal/du[m.id]))+' يوم بمعدل الاستهلاك الحالي'])});
  var max=Math.max.apply(null,[1].concat(frows.map(function(x){return Math.abs(x[1])})));
  var rec=[].concat(all('prod'),all('disp'),all('matin'),all('matout'),all('xfer')).sort(function(a,b){return (b.c||0)-(a.c||0)}).slice(0,8);
  var noOps=!all('prod').length&&!all('disp').length&&!all('matin').length&&!all('opf').length&&!all('opm').length;
  return '<h2 class="sec">لوحة التحكم <small>'+arDate(t)+'</small></h2>'+
  (noOps?'<div class="alert info">🌱 النظام جديد ومفيش أرصدة. ابدأ بـ <b>أول المدة</b> (الموجود فعلاً في المخزن دلوقتي)، وبعدها سجّل الوارد والتصنيع والصرف.</div>':'')+
  '<div class="kpis">'+
  '<div class="kpi hl"><div class="l">تصنيع النهارده</div><div class="v">'+fmt(sumBy(prodT,'qty'))+'<small>كجم</small></div></div>'+
  '<div class="kpi"><div class="l">صرف النهارده</div><div class="v">'+fmt(sumBy(dispT,'qty'))+'<small>كجم</small></div></div>'+
  '<div class="kpi"><div class="l">رصيد العلف الجاهز</div><div class="v">'+fmtT(ftot)+'<small>طن</small></div></div>'+
  '<div class="kpi"><div class="l">رصيد الخامات</div><div class="v">'+fmtT(mtot)+'<small>طن</small></div></div></div>'+
  (al.length?'<div class="card"><h3>⚠️ تنبيهات</h3>'+al.slice(0,10).map(function(a){return '<div class="alert '+a[0]+'">'+esc(a[1])+'</div>'}).join('')+'</div>':'')+
  '<div class="card no-print"><div class="btnrow"><button class="btn pri" onclick="go(\'prod\')">🏭 تصنيع</button><button class="btn ghost" onclick="go(\'disp\')">🚚 صرف علف</button><button class="btn ghost" onclick="go(\'matin\')">📥 وارد خامات</button><button class="btn acc" onclick="go(\'daily\')">📋 تقرير اليوم</button></div></div>'+
  '<div class="card"><h3>🌾 رصيد العلف حسب النوع <span class="sp"></span><button class="btn ghost sm no-print" onclick="go(\'feedbal\')">التفاصيل</button></h3>'+
  (frows.length?frows.map(function(x){return '<div class="hbar"><div class="nm">'+esc(x[0])+'</div><div class="tr"><div style="width:'+Math.max(2,Math.abs(x[1])/max*100)+'%;'+(x[1]<0?'background:var(--bad)':'')+'"></div></div><div class="vl">'+fmt(x[1])+'</div></div>'}).join(''):'<div class="empty">مفيش رصيد علف</div>')+'</div>'+
  '<div class="card"><h3>🕒 آخر الحركات</h3>'+(rec.length?'<div class="tbl-wrap"><table><tbody>'+rec.map(function(d){var ic={prod:'🏭',disp:'🚚',matin:'📥',matout:'📤',xfer:'🔁'}[d.t];return '<tr><td>'+ic+'</td><td style="white-space:normal">'+esc(describe(d))+'</td><td class="c-sub" style="font-size:11.5px">'+esc((d.by||'').split(' · ')[0])+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">لسه مفيش حركات</div>')+'</div>';

function prevProd(){

  var tot=recipeTotal(f),warn=Math.abs(tot-1000)>0.5?'<div class="alert warn">مجموع تركيبة '+esc(f.name)+' = '+fmt(tot)+' كجم مش 1000 — راجع التركيبات</div>':'';

  if(qty<=0){el.innerHTML=warn;return}

function saveProd(){
  if(!need('prod'))return;
  var date=$('pDate').value,feed=$('pFeed').value,qty=r3(num($('pQty').value)),form=$('pForm').value,store=$('pStore').value,note=$('pNote').value.trim();
  if(!date||!S.docs[feed]||!S.docs[store]||qty<=0){toast('اكتب التاريخ والنوع والمخزن والكمية',1);return}
  var use=calcUse(feed,qty);
  if(!Object.keys(use).length){toast('التركيبة فاضية — عبّيها من صفحة التركيبات',1);return}
  var ml=matLedger(null,EDIT),short=Object.keys(use).filter(function(m){return (ml[m]?ml[m].bal:0)-use[m]<-0.001});
  var doIt=function(){
    var d=EDIT&&S.docs[EDIT]?Object.assign({},S.docs[EDIT]):{id:uid(),t:'prod'};
    Object.assign(d,{date:date,feed:feed,qty:qty,form:form,store:store,note:note,use:use});

    toast(wasEdit?'اتعدّلت الدفعة':'اتسجل تصنيع '+fmt(qty)+' كجم '+nm(feed)+' '+form);renderView();
  };
  if(short.length)ask('الخامات مش مكفية','الرصيد هيبقى بالسالب في: <b>'+short.map(function(m){return esc(nm(m))}).join('، ')+'</b>.<br>غالبًا في وارد لسه متسجلش. تكمّل التسجيل؟',doIt,false,'سجّل برضه');

/* ================= التقارير ================= */
var rpMode='today',rpFrom='',rpTo='';
function rpRange(){
  var t=today();
  if(rpMode==='today')return [t,t];
  if(rpMode==='yest'){var y=addDays(t,-1);return [y,y]}
  if(rpMode==='week')return [addDays(t,-6),t];
  if(rpMode==='month')return [t.slice(0,8)+'01',t];
  if(rpMode==='30')return [addDays(t,-29),t];
  return [rpFrom||t,rpTo||t];
}
function grpTable(title,heads,rows,empty){
  return '<div class="card"><h3>'+title+'</h3><div class="tbl-wrap"><table><thead><tr>'+heads.map(function(h,i){return '<th'+(i>=heads.length-(heads._n||1)?' class="n"':'')+'>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+heads.length+'" class="empty">'+(empty||'لا يوجد')+'</td></tr>')+'</tbody></table></div></div>';
}
VIEWS.report=function(){
  var rg=rpRange(),from=rg[0],to=rg[1];
  var P=all('prod').filter(function(x){return inRange(x.date,from,to)}),D=all('disp').filter(function(x){return inRange(x.date,from,to)}),
      I=all('matin').filter(function(x){return inRange(x.date,from,to)}),O=all('matout').filter(function(x){return inRange(x.date,from,to)});
  var pf={};P.forEach(function(p){var k=p.feed+'|'+p.form;pf[k]=(pf[k]||0)+(+p.qty||0)});
  var df={};D.forEach(function(d){var k=d.feed+'|'+d.form;var r=df[k]||(df[k]={t:0,s:0,d:0});r.t+=+d.qty||0;if(d.type==='direct')r.d+=+d.qty||0;else r.s+=+d.qty||0});
  var cf={};D.forEach(function(d){cf[d.cust]=(cf[d.cust]||0)+(+d.qty||0)});
  var im={};I.forEach(function(x){var r=im[x.mat]||(im[x.mat]={q:0,v:0});r.q+=+x.qty||0;r.v+=(+x.qty||0)/1000*(+x.price||0)});
  var cons={};P.forEach(function(p){var u=p.use||{};for(var k in u)cons[k]=(cons[k]||0)+(+u[k]||0)});
  var om={};O.forEach(function(x){om[x.mat]=(om[x.mat]||0)+(+x.qty||0)});
  function kv(o,fmtRow){return Object.keys(o).length?Object.keys(o).map(fmtRow).join(''):''}
  var pRows=kv(pf,function(k){var p=k.split('|');return '<tr><td><b>'+esc(nm(p[0]))+'</b></td><td>'+formPill(p[1])+'</td><td class="n c-pri strong">'+fmt(pf[k])+'</td></tr>'});
  var dRows=kv(df,function(k){var p=k.split('|'),r=df[k];return '<tr><td><b>'+esc(nm(p[0]))+'</b></td><td>'+formPill(p[1])+'</td><td class="n">'+fmt(r.s)+'</td><td class="n">'+fmt(r.d)+'</td><td class="n c-acc strong">'+fmt(r.t)+'</td></tr>'});
  var cRows=Object.keys(cf).sort(function(a,b){return cf[b]-cf[a]}).map(function(k){return '<tr><td><b>'+esc(nm(k))+'</b></td><td class="n strong">'+fmt(cf[k])+'</td></tr>'}).join('');
  var iRows=kv(im,function(k){return '<tr><td><b>'+esc(nm(k))+'</b></td><td class="n c-ok strong">'+fmt(im[k].q)+'</td><td class="n">'+(im[k].v?fmt(im[k].v):'—')+'</td></tr>'});
  var mRows=list('mat').filter(function(m){return cons[m.id]||om[m.id]}).map(function(m){return '<tr><td><b>'+esc(m.name)+'</b></td><td class="n c-acc">'+fmt(cons[m.id]||0)+'</td><td class="n">'+fmt(om[m.id]||0)+'</td></tr>'}).join('');
  var hI=['الخامة','الكمية (كجم)','القيمة (ج)'];hI._n=2;var hD=['النوع','الشكل','من المخزن','مباشر','الإجمالي'];hD._n=3;var hM=['الخامة','مستهلك تصنيع','مصروف/مباع'];hM._n=2;
  return '<h2 class="sec">📈 التقارير</h2>'+
  '<div class="chips no-print">'+[['today','النهارده'],['yest','امبارح'],['week','آخر 7 أيام'],['month','الشهر ده'],['30','آخر 30 يوم'],['custom','فترة محددة']].map(function(c){return '<div class="chip'+(c[0]===rpMode?' on':'')+'" onclick="rpMode=\''+c[0]+'\';renderView()">'+c[1]+'</div>'}).join('')+'</div>'+
  (rpMode==='custom'?'<div class="card no-print"><div class="grid2">'+fDate('rpF','من',from,'rpFrom=this.value;renderView()')+fDate('rpT','إلى',to,'rpTo=this.value;renderView()')+'</div></div>':'')+
  '<p class="hint" style="text-align:center;margin-bottom:10px">من '+arDate(from)+' إلى '+arDate(to)+'</p>'+
  '<div class="kpis"><div class="kpi hl"><div class="l">الإنتاج</div><div class="v">'+fmt(sumBy(P,'qty'))+'<small>كجم</small></div></div><div class="kpi"><div class="l">صرف العلف</div><div class="v">'+fmt(sumBy(D,'qty'))+'<small>كجم</small></div></div><div class="kpi"><div class="l">وارد الخامات</div><div class="v">'+fmt(sumBy(I,'qty'))+'<small>كجم</small></div></div><div class="kpi"><div class="l">عدد العملاء</div><div class="v">'+Object.keys(cf).length+'</div></div></div>'+
  grpTable('① الإنتاج حسب النوع',['النوع','الشكل','الكمية (كجم)'],pRows)+
  grpTable('② صرف العلف حسب النوع',hD,dRows)+
  grpTable('③ الصرف حسب العميل / المزرعة',['العميل','الكمية (كجم)'],cRows)+
  grpTable('④ وارد الخامات',hI,iRows)+
  grpTable('⑤ حركة الخامات (استهلاك وبيع)',hM,mRows);
};

  var u=S.docs[id];if(!u)return;if(!isSuper()&&u.login!==cur.login)return;
  var p=prompt('كلمة السر الجديدة لـ '+u.name+':');if(p===null)return;p=toEn(p.trim());if(p.length<3){toast('كلمة السر قصيرة',1);return}
  var d=Object.assign({},u);d.pass=p;put(d);toast('اتغيّرت كلمة السر');renderView();
}
function delUser(id){if(!isSuper())return;var u=S.docs[id];if(!u||u.login==='admin')return;ask('حذف المستخدم '+esc(u.name)+'؟','',function(){removeDoc(id);toast('اتحذف');renderView()},true,'حذف')}
function toggleRolePerm(key,p,on){if(!isSuper()||key==='superadmin')return;var r=Object.assign({},roleDoc(key));var ps=(r.perms||[]).filter(function(x){return x!==p});if(on)ps.push(p);r.perms=ps;put(r);toast('اتعدّلت صلاحيات '+r.label)}
function addRole(){if(!isSuper())return;var n=$('nrName').value.trim();if(!n){toast('اكتب اسم الدور',1);return}var key='role'+Date.now().toString(36);put({id:'r_'+key,t:'role',key:key,label:n,perms:['view']});renderView()}
function delRole(key){if(!isSuper())return;if(all('user').some(function(u){return u.role===key})){toast('في مستخدمين على الدور ده — غيّرهم الأول',1);return}ask('حذف الدور؟','',function(){removeDoc('r_'+key);renderView()},true,'حذف')}

/* ================= البيانات والمزامنة ================= */

  '<p class="hint">كل حركة بتترفع لوحدها فورًا — لو جهازين سجّلوا في نفس الوقت الاتنين بيتحفظوا، ومفيش جهاز بيمسح شغل التاني. لو النت فاصل بيشتغل عادي ويرفع لما يرجع.</p>'+
  '<div class="field" style="margin-top:10px"><label>اسم الجهاز ده</label><div class="addrow"><input id="devN" value="'+esc(devName())+'"><button class="btn ghost sm" onclick="setDev()">حفظ</button></div></div>'+
  '<button class="btn '+(syncOff?'pri':'ghost')+' block" onclick="toggleSync()">'+(syncOff?'▶️ شغّل المزامنة':'⏸️ وقّف المزامنة على الجهاز ده')+'</button></div>'+
  '<div class="card"><h3>📦 نسخ احتياطي وتصدير</h3><p class="hint" style="margin-bottom:10px">'+nOps+' حركة مسجلة · '+Object.keys(S.docs).length+' عنصر كلي</p>'+
  '<div class="btnrow"><button class="btn ghost" onclick="exportJSON()">⬇️ نسخة JSON</button><button class="btn ghost" onclick="exportExcel()">📊 Excel</button><button class="btn ghost" onclick="$(\'impF\').click()">⬆️ استيراد/دمج</button></div>'+
  '<input type="file" id="impF" accept=".json,application/json" style="display:none" onchange="if(this.files[0])importJSON(this.files[0]);this.value=\'\'">'+
  '<p class="hint" style="margin-top:8px">الاستيراد بيدمج: أي سجل أحدث في الملف بيتحدّث، ومفيش حاجة بتتمسح.</p></div>'+
  '<div class="card"><h3>🗓️ نسخ يومية تلقائية على الجهاز</h3>'+(bks.length?bks.map(function(k){var dd=k.slice(LS_BK.length);return '<div class="li"><span class="nm">'+arDate(dd)+'</span><button class="btn ghost sm" onclick="bkDownload(\''+k+'\')">تنزيل</button><button class="btn acc sm" onclick="bkRestore(\''+k+'\')">استرجاع</button></div>'}).join(''):'<p class="hint">لسه مفيش نسخ</p>')+'</div>'+
  '<div class="card"><h3>🎨 الشكل</h3><button class="btn ghost block" onclick="toggleTheme()">🌓 تبديل الوضع الليلي / النهاري</button></div>'+
  (can('settings')&&isSuper()?'<div class="card" style="border-color:var(--bad)"><h3 class="c-bad">🗑️ تصفير الحركات</h3><p class="hint" style="margin-bottom:10px">بيمسح كل التصنيع والصرف والوارد والتحويلات وأول المدة على كل الأجهزة. القوايم والتركيبات والمستخدمين بيفضلوا. بتتاخد نسخة قبلها.</p><button class="btn bad block" onclick="resetOps()">تصفير كل الحركات</button></div>':'')+
  '<p class="hint" style="text-align:center">'+APP_NAME+' · '+APP_VER+'</p>';
};
function setDev(){var v=$('devN').value.trim();if(v){lsSet(LS_DEV,v);toast('اتحفظ')}}
function download(name,text,type){var b=new Blob([text],{type:type||'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){download('الكوثر_نسخة_'+today()+'.json',JSON.stringify({app:'feedmill',ver:APP_VER,at:new Date().toISOString(),docs:S.docs}))}
function mergeDocs(docs,force){
  var n=0,ids=[];
  for(var k in docs){var d=docs[k];if(!validDoc(d,k))continue;var l=S.docs[k];
    if(force){var nd=clean(d);nd.u=now();S.docs[k]=nd;n++;ids.push(k)}
    else if(!l||d.u>l.u){S.docs[k]=clean(d);n++;ids.push(k)}}
  if(n){persist();pushDocs(ids)}
  return n;
}
function importJSON(file){
  var r=new FileReader();r.onload=function(){
    var o=null;try{o=JSON.parse(r.result)}catch(e){}
    if(!o||!o.docs){toast('الملف ده مش نسخة من النظام ده',1);return}
    ask('دمج النسخة؟','هيتحدّث أي سجل أحدث في الملف، ومش هيتمسح حاجة.',function(){var n=mergeDocs(o.docs);toast('اتدمج '+n+' سجل');renderView()});
  };r.readAsText(file);
}
function dailyBackup(){
  var k=LS_BK+today();if(lsGet(k))return;
  var n=0;MOVE_T.forEach(function(t){n+=all(t).length});if(!n)return;
  lsSet(k,JSON.stringify({docs:S.docs,at:Date.now()}));
  lsKeys().filter(function(x){return x&&x.indexOf(LS_BK)===0}).sort().slice(0,-BK_KEEP).forEach(lsDel);
}
function bkDownload(k){download('الكوثر_'+k.slice(LS_BK.length)+'.json',lsGet(k)||'{}')}
function bkRestore(k){
  if(!isSuper()&&!can('settings')){toast('مالكش صلاحية',1);return}
  var o=null;try{o=JSON.parse(lsGet(k))}catch(e){}if(!o||!o.docs){toast('النسخة تالفة',1);return}
  ask('استرجاع نسخة '+arDate(k.slice(LS_BK.length))+'؟','البيانات هترجع زي ما كانت يوم النسخة بالظبط، على كل الأجهزة. الحركات اللي اتسجلت بعدها هتتلغي (هنحفظ نسخة من الحالي الأول).',function(){
    download('الكوثر_قبل_الاسترجاع_'+today()+'.json',JSON.stringify({docs:S.docs}));
    var ch=[];
    for(var id in S.docs){var d=S.docs[id];if(!o.docs[id]&&MOVE_T.indexOf(d.t)>-1&&!d.del){var x=Object.assign({},d);x.del=1;ch.push(x)}}
    putMany(ch);mergeDocs(o.docs,true);toast('اترجعت النسخة');go('dash');
  },true,'استرجاع');
}
function resetOps(){
  if(!isSuper())return;
  var p=prompt('اكتب كلمة السر بتاعتك للتأكيد:');if(p===null)return;
  var u=userDoc(cur.login);if(!u||String(u.pass)!==toEn(p.trim())){toast('كلمة السر غلط',1);return}
  ask('تصفير كل الحركات؟','هيتمسح كل التصنيع والصرف والوارد والتحويلات وأول المدة على كل الأجهزة. هينزل ملف نسخة قبلها.',function(){
    download('الكوثر_قبل_التصفير_'+today()+'.json',JSON.stringify({docs:S.docs}));
    var ch=[];MOVE_T.forEach(function(t){all(t).forEach(function(d){var x=Object.assign({},d);x.del=1;ch.push(x)})});
    putMany(ch);toast('اتصفّرت الحركات');go('dash');
  },true,'تصفير');
}
function exportExcel(){
  var h='<html dir="rtl"><head><meta charset="UTF-8"></head><body style="font-family:Tahoma">';
  function T(t,head,rows){h+='<h3>'+t+'</h3><table border="1" cellspacing="0" cellpadding="4"><tr>'+head.map(function(x){return '<th style="background:#e2f0ea">'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join('')+'</table><br>'}
  var fl=feedLedger(null,null),ml=matLedger(null),fr=[];
  list('feed').forEach(function(f){FORMS.forEach(function(fo){var r=fl[f.id+'|'+fo];if(r.open||r.prod||r.disp||r.bal)fr.push([f.name,fo,r.open,r.prod,r.disp,r.bal])})});
  T('رصيد العلف',['النوع','الشكل','أول المدة','مصنّع','مصروف','المتبقي'],fr);
  T('رصيد الخامات',['الخامة','أول المدة','وارد','مستهلك','مصروف','المتبقي'],list('mat').map(function(m){var r=ml[m.id];return [m.name,r.open,r.inc,r.cons,r.sold,r.bal]}));
  T('التصنيع',['التاريخ','النوع','الشكل','الكمية','المخزن','ملاحظة'],moves('prod').map(function(d){return [d.date,nm(d.feed),d.form,d.qty,nm(d.store),d.note||'']}));
  T('صرف العلف',['التاريخ','العميل','النوع','الشكل','الكمية','الصرف','المخزن'],moves('disp').map(function(d){return [d.date,nm(d.cust),nm(d.feed),d.form,d.qty,DTYPE[d.type||'store'],nm(d.store)]}));
  T('وارد الخامات',['التاريخ','الخامة','المورد','الكمية','سعر الطن','البون'],moves('matin').map(function(d){return [d.date,nm(d.mat),d.supp?nm(d.supp):'',d.qty,d.price||'',d.ref||'']}));
  T('صرف الخامات',['التاريخ','العميل','الخامة','الكمية','سعر الطن'],moves('matout').map(function(d){return [d.date,nm(d.cust),nm(d.mat),d.qty,d.price||'']}));
  T('التحويلات',['التاريخ','النوع','الشكل','الكمية','من','إلى'],moves('xfer').map(function(d){return [d.date,nm(d.feed),d.form,d.qty,nm(d.from),nm(d.to)]}));
  h+='</body></html>';
  download('تقرير_الكوثر_'+today()+'.xls','﻿'+h,'application/vnd.ms-excel');
}

/* ================= المزامنة (Firebase) ================= */
var fbDb=null,fbRoot=null,fbListening=false,syncState={s:'wait',t:'...'};
function syncUI(s,t){syncState={s:s,t:t};var d=$('syncDot'),x=$('syncTxt');if(d)d.className='dot '+s;if(x)x.textContent=t}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error(src))};document.head.appendChild(s)})}
function initSync(){
  if(lsGet(LS_ON)==='OFF'){syncUI('off','محلي فقط');return}
  syncUI('wait',navigator.onLine?'بيتصل...':'أوفلاين');
  var V='https://www.gstatic.com/firebasejs/10.12.2/';
  (window.firebase&&window.firebase.database?Promise.resolve():loadScript(V+'firebase-app-compat.js').then(function(){return loadScript(V+'firebase-database-compat.js')}))
  .then(function(){
    var app;try{app=firebase.app('feedmill')}catch(e){app=firebase.initializeApp(FB_CFG,'feedmill')}
    if(!fbDb){
      fbDb=firebase.database(app);
      fbDb.ref('.info/serverTimeOffset').on('value',function(s){srvOff=+s.val()||0});
      fbDb.ref('.info/connected').on('value',function(s){if(lsGet(LS_ON)==='OFF')return;if(s.val())syncUI('on','متزامن');else syncUI('wait','أوفلاين — هيرفع لما النت يرجع')});
    }
    fbDb.goOnline();
    fbRoot=fbDb.ref(FB_PATH);
    if(!fbListening){fbListening=true;fbRoot.on('value',function(snap){mergeCloud(snap.val()||{})},function(err){syncUI('err','خطأ في صلاحيات السحابة');console.warn(err)})}
  }).catch(function(e){syncUI('err','مش متصل بالسحابة');console.warn(e)});
}
function mergeCloud(c){
  var changed=false,up={};
  for(var k in c){var d=c[k];if(!validDoc(d,k))continue;var l=S.docs[k];if(!l||d.u>l.u){S.docs[k]=d;changed=true}}
  for(var k2 in S.docs){var l2=S.docs[k2],cd=c[k2];if(!cd||l2.u>(cd.u||0))up[k2]=l2}
  if(Object.keys(up).length&&fbRoot)fbRoot.update(clean(up)).catch(console.warn);
  if(changed){persist();if(cur){var u=userDoc(cur.login);if(!u){logout();return}cur.name=u.name;cur.role=u.role}softRender()}
}
function pushDocs(ids){if(!fbRoot)return;var u={};ids.forEach(function(id){if(S.docs[id])u[id]=S.docs[id]});fbRoot.update(clean(u)).catch(function(e){console.warn(e);syncUI('err','فشل الرفع — هيحاول تاني')})}
function toggleSync(){
  if(lsGet(LS_ON)==='OFF'){lsSet(LS_ON,'1');initSync()}
  else{lsSet(LS_ON,'OFF');if(fbRoot){fbRoot.off('value');fbListening=false}if(fbDb)fbDb.goOffline();fbRoot=null;syncUI('off','محلي فقط')}
  renderView();
}

/* ================= عام ================= */
function applyTheme(){var t=lsGet(LS_THEME);if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){
  var cur0=document.documentElement.getAttribute('data-theme');
  var dark=cur0?cur0==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  lsSet(LS_THEME,dark?'light':'dark');applyTheme();
}
function printPage(){window.print()}
document.addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});
window.addEventListener('storage',function(e){if(e.key===LS_KEY){load();softRender()}});
window.addEventListener('online',function(){if(fbDb&&lsGet(LS_ON)!=='OFF')fbDb.goOnline()});
document.addEventListener('visibilitychange',function(){if(!document.hidden){dailyBackup();if(cur&&!typing())renderView()}});

function boot(){
  applyTheme();
  if(!lsGet(LS_DEV))lsSet(LS_DEV,/iPhone|iPad/.test(navigator.userAgent)?'آيفون':/Mac/.test(navigator.userAgent)?'ماك':'جهاز');
  load();persist();dailyBackup();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  renderApp();initSync();
}
boot();
