<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة مزارع الدواجن - الشركة المصرية</title>
<style>:root{--bg:#f6f7fb; --bg2:#eef0f7; --surface:#ffffff; --card:#ffffff; --card2:#f8f9fd; --border:#e7e9f2; --border2:#d8dbe9; --ring:rgba(99,91,255,.35); --primary:#635bff; --primary-d:#5147e6; --primary-l:#8b85ff; --primary-soft:#eef0ff; --txt:#1a1c2e; --txt2:#5b607a; --txt3:#9095af; --txt-on:#ffffff; --green:#0f9d58; --green-l:#16c172; --red:#e23048;   --red-l:#fb5a6f; --amber:#d68310; --amber-l:#f5a623; --cyan:#0e9bbd;  --cyan-l:#22d3ee; --purple:#8b3ff0;--purple-l:#a855f7; --blue:#2f6bff;  --blue-l:#5b8def; --orange:#e8590c;--orange-l:#fb923c; --pink:#d6457f;  --pink-l:#ec4899; --teal:#0d9488;  --teal-l:#2dd4bf; --slate:#566073; --slate-l:#7c889e; --indigo:#4f46e5;--indigo-l:#818cf8; --ok-bg:rgba(15,157,88,.12); --warn-bg:rgba(214,131,16,.14); --bad-bg:rgba(226,48,72,.12); --info-bg:rgba(99,91,255,.12); --grad:linear-gradient(135deg,#635bff,#8b85ff 55%,#a855f7); --grad2:linear-gradient(135deg,#5147e6,#7c5cff); --grad-green:linear-gradient(135deg,#0f9d58,#16c172); --grad-red:linear-gradient(135deg,#e23048,#fb5a6f); --grad-blue:linear-gradient(135deg,#2f6bff,#5b8def); --grad-surface:linear-gradient(180deg,#ffffff,#fbfbfe); --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-pill:999px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --sh-xs:0 1px 2px rgba(26,28,46,.06); --sh-sm:0 2px 6px rgba(26,28,46,.07),0 1px 2px rgba(26,28,46,.05); --sh-md:0 8px 24px rgba(26,28,46,.09),0 2px 6px rgba(26,28,46,.05); --sh-lg:0 18px 48px rgba(26,28,46,.14),0 6px 16px rgba(26,28,46,.08); --sh-primary:0 8px 24px rgba(99,91,255,.32); --sh-focus:0 0 0 4px var(--ring); --fs-xs:11.5px; --fs-sm:12.5px; --fs-base:14px; --fs-md:15px; --fs-lg:18px; --fs-xl:22px; --fs-2xl:28px; --fs-3xl:34px; --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.16,1,.3,1)}
:root[data-theme=dark]{--bg:#0f1117;--bg2:#161923;--surface:#1a1d28;--card:#1a1d28;--card2:#22263340;--border:#2a2e3d;--border2:#353a4d;--txt:#e8eaf2;--txt2:#a0a6bd;--txt3:#6b7189;--primary-soft:#2a2570;--ok-bg:rgba(15,157,88,.18);--warn-bg:rgba(214,131,16,.2);--bad-bg:rgba(226,48,72,.18);--info-bg:rgba(99,91,255,.2);--grad-surface:linear-gradient(180deg,#1a1d28,#161923);--sh-xs:0 1px 2px rgba(0,0,0,.3);--sh-sm:0 2px 6px rgba(0,0,0,.35);--sh-md:0 8px 24px rgba(0,0,0,.4);--sh-lg:0 18px 48px rgba(0,0,0,.5)}
:root[data-theme=dark] .qa-bar button{background:var(--surface)!important;border-color:var(--border2)!important}
:root[data-theme=dark] table td{background:transparent}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden;max-width:100%}
body{font-family:'Inter','Segoe UI','Helvetica Neue',Tahoma,Arial,sans-serif; background:
radial-gradient(900px 500px at 88% -8%,#eceaff,transparent 60%),
radial-gradient(700px 500px at -5% 0%,#e7f6ff,transparent 55%),
var(--bg); background-attachment:fixed; color:var(--txt); font-size:var(--fs-base); line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:var(--r-pill);border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--primary-l)}
::selection{background:var(--primary-soft);color:var(--primary-d)}
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px; background:
radial-gradient(800px 500px at 75% -10%,#e4e1ff,transparent 60%),
radial-gradient(700px 500px at 10% 110%,#dff3ff,transparent 55%),
var(--bg)}
.login-card{background:var(--grad-surface);border:1px solid var(--border);border-radius:var(--r-xl); padding:44px 38px;width:100%;max-width:430px;box-shadow:var(--sh-lg);position:relative;overflow:hidden; animation:popIn .5s var(--ease-out) both}
.login-card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
.login-card .logo{font-size:54px;text-align:center;margin-bottom:10px;filter:drop-shadow(0 6px 14px rgba(99,91,255,.3))}
.login-card h1{font-size:var(--fs-xl);text-align:center;margin-bottom:6px;font-weight:800;letter-spacing:-.5px; background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-card .sub{text-align:center;color:var(--txt2);font-size:var(--fs-sm);margin-bottom:30px}
.login-card label{display:block;font-size:var(--fs-sm);color:var(--txt2);margin:16px 0 7px;font-weight:600}
.login-card select,.login-card input{width:100%}
.login-err{color:var(--red);font-size:var(--fs-sm);text-align:center;margin-top:14px;min-height:16px;font-weight:600}
input,select,textarea{background:var(--surface);border:1.5px solid var(--border);color:var(--txt); padding:11px 13px;border-radius:var(--r-sm);font-family:inherit;font-size:var(--fs-base); outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease),background .18s; max-width:100%}
input:hover,select:hover,textarea:hover{border-color:var(--border2)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:var(--sh-focus)}
input::placeholder{color:var(--txt3)}
select{cursor:pointer}
button{font-family:inherit;cursor:pointer;border:none;transition:transform .15s var(--ease),box-shadow .2s var(--ease),filter .2s,background .2s}
.btn{background:var(--grad);color:var(--txt-on);padding:11px 20px;border-radius:var(--r-sm); font-size:var(--fs-base);font-weight:600;box-shadow:var(--sh-primary);letter-spacing:.1px; display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 12px 28px rgba(99,91,255,.42)}
.btn:active{transform:translateY(0);filter:brightness(.98)}
.btn-lg{width:100%;padding:14px;font-size:var(--fs-md);margin-top:24px;justify-content:center}
.btn-sec{background:var(--surface);color:var(--txt);border:1.5px solid var(--border2);box-shadow:var(--sh-xs)}
.btn-sec:hover{background:var(--card2);border-color:var(--primary-l);color:var(--primary-d);filter:none}
.btn-green{background:var(--grad-green);box-shadow:0 8px 24px rgba(15,157,88,.3)}
.btn-red{background:var(--grad-red);box-shadow:0 8px 24px rgba(226,48,72,.3)}
.btn-amber{background:linear-gradient(135deg,#d68310,#f5a623);box-shadow:0 8px 24px rgba(214,131,16,.3)}
.btn-green:hover,.btn-red:hover,.btn-amber:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn-sm{padding:7px 13px;font-size:var(--fs-sm);border-radius:var(--r-xs)}
.btn-xs{padding:5px 10px;font-size:var(--fs-xs);border-radius:var(--r-xs);box-shadow:none}
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px 22px; background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(16px); border-bottom:1px solid var(--border);box-shadow:var(--sh-xs)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:var(--fs-md);white-space:nowrap;letter-spacing:-.3px}
.topbar .brand .ic{font-size:24px;filter:drop-shadow(0 3px 8px rgba(99,91,255,.35))}
.topbar .brand span:last-child{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .spacer{flex:1}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--border); padding:6px 13px;border-radius:var(--r-pill);font-size:var(--fs-sm);box-shadow:var(--sh-xs)}
.user-chip .role{color:var(--primary-d);font-weight:700}
.menu-btn{display:none;background:var(--card2);border:1px solid var(--border);color:var(--txt); width:40px;height:40px;border-radius:var(--r-sm);font-size:18px}
.layout{display:flex;min-height:calc(100vh - 58px)}
.sidebar{width:248px;background:rgba(255,255,255,.6);backdrop-filter:blur(8px); border-left:1px solid var(--border);padding:18px 12px;flex-shrink:0;overflow-y:auto}
.nav-group{font-size:var(--fs-xs);color:var(--txt3);text-transform:uppercase;letter-spacing:.7px; margin:20px 12px 8px;font-weight:800}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-sm); color:var(--txt2);cursor:pointer;font-size:13.5px;margin-bottom:3px;font-weight:600;position:relative; transition:background .18s var(--ease),color .18s,transform .12s}
.nav-item .ic{font-size:18px;width:24px;text-align:center}
.nav-item:hover{background:var(--primary-soft);color:var(--primary-d)}
.nav-item.active{background:var(--grad);color:var(--txt-on);box-shadow:var(--sh-primary)}
.nav-item.active::before{content:'';position:absolute;right:-12px;top:50%;transform:translateY(-50%); width:4px;height:60%;background:var(--primary);border-radius:var(--r-pill)}
.main{flex:1;padding:26px;overflow-x:auto;min-width:0}
.page{display:none;animation:fade .3s var(--ease-out)}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:none}
}
.page-head{display:flex;align-items:center;gap:13px;margin-bottom:24px;flex-wrap:wrap}
.page-head h2{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.7px}
.page-head .desc{color:var(--txt2);font-size:var(--fs-sm)}
.page-head .spacer{flex:1}
.card{background:var(--grad-surface);border:1px solid var(--border);border-radius:var(--r-lg); padding:22px;box-shadow:var(--sh-sm);transition:box-shadow .25s var(--ease),transform .25s var(--ease);min-width:0;max-width:100%}
.card:hover{box-shadow:var(--sh-md)}
.card+.card{margin-top:18px}
.card-title{font-size:var(--fs-md);font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:9px;letter-spacing:-.3px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;position:relative;overflow:hidden; border-top:3px solid var(--primary);box-shadow:var(--sh-xs);transition:transform .25s var(--ease-out),box-shadow .25s}
.kpi::before{content:'';position:absolute;right:-20px;top:-20px;width:80px;height:80px; background:radial-gradient(circle,var(--primary),transparent 70%);border-radius:50%;opacity:.06}
.kpi.g{border-top-color:#16a34a}
.kpi.g .val{color:#15803d}
.kpi.g::before{background:radial-gradient(circle,#16a34a,transparent 70%)}
.kpi.r{border-top-color:#e11d48}
.kpi.r .val{color:#be123c}
.kpi.r::before{background:radial-gradient(circle,#e11d48,transparent 70%)}
.kpi.a{border-top-color:#d97706}
.kpi.a .val{color:#b45309}
.kpi.a::before{background:radial-gradient(circle,#d97706,transparent 70%)}
.kpi.c{border-top-color:#0891b2}
.kpi.c .val{color:#0e7490}
.kpi.c::before{background:radial-gradient(circle,#0891b2,transparent 70%)}
.kpi.p{border-top-color:#9333ea}
.kpi.p .val{color:#7e22ce}
.kpi.p::before{background:radial-gradient(circle,#9333ea,transparent 70%)}
.kpi .lbl{font-size:var(--fs-sm);color:var(--txt2);margin-bottom:8px;display:flex;align-items:center;gap:7px;font-weight:600}
.kpi .val{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-1px;color:var(--txt);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .sub{font-size:var(--fs-xs);color:var(--txt3);margin-top:6px;font-weight:500}
.kpi.lift:hover{transform:translateY(-3px);box-shadow:var(--sh-md)}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-xs);background:var(--surface);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}
thead th{background:var(--grad2);color:var(--txt-on);font-weight:700;padding:13px 15px;text-align:right; position:sticky;top:0;z-index:5;font-size:var(--fs-sm);letter-spacing:.2px; box-shadow:0 2px 0 rgba(0,0,0,.06)}
thead th:first-child{border-top-right-radius:var(--r-md)}
thead th:last-child{border-top-left-radius:var(--r-md)}
tbody td{padding:12px 15px;border-bottom:1px solid var(--border);color:var(--txt)}
tbody tr:nth-child(even){background:var(--card2)}
tbody tr:hover{background:var(--primary-soft);transition:background .15s}
tbody tr:last-child td{border-bottom:none}
tbody td:first-child{color:var(--primary-d);font-weight:700;border-right:3px solid transparent}
tbody tr:hover td:first-child{border-right-color:var(--primary)}
.tbl-total td{background:var(--grad);color:var(--txt-on)!important;font-weight:800;border-top:2px solid var(--primary-l)}
.tbl-total td:first-child{color:var(--txt-on)!important}
td.editable{cursor:pointer;border-radius:var(--r-xs);transition:.15s}
td.editable:hover{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:4px 11px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;letter-spacing:.2px}
.b-ok{background:var(--ok-bg);color:var(--green)}
.b-warn{background:var(--warn-bg);color:var(--amber)}
.b-bad{background:var(--bad-bg);color:var(--red)}
.b-info{background:var(--info-bg);color:var(--primary-d)}
.b-mut{background:var(--bg2);color:var(--txt2)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:9px 12px;font-size:13px}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:var(--fs-sm);color:var(--txt2);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%}
.row-fields{display:grid;gap:14px}
.row-fields>*{min-width:0}
.hint{font-size:var(--fs-xs);color:var(--txt3);margin-top:5px;line-height:1.5}
.divider{height:1px;background:var(--border);margin:18px 0}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden}
.seg-b{background:var(--surface);color:var(--txt2);padding:6px 14px;font-size:13px;font-weight:700}
.seg-b.on{background:var(--primary);color:#fff}
.empty{text-align:center;padding:52px 20px;color:var(--txt3)}
.empty .ic{font-size:50px;margin-bottom:14px;opacity:.55;display:block}
.access-deny{text-align:center;padding:64px 20px;color:var(--txt2)}
.access-deny .ic{font-size:58px;margin-bottom:16px;display:block}
.modal-bg{position:fixed;inset:0;background:rgba(26,28,46,.42);backdrop-filter:blur(5px); display:none;align-items:center;justify-content:center;z-index:200;padding:18px;animation:fade .2s}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg); width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg); animation:popIn .32s var(--ease-out)}
.modal-h{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border); position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{font-size:var(--fs-lg);flex:1;font-weight:800;letter-spacing:-.3px}
.modal-h .x{background:var(--card2);border:1px solid var(--border);color:var(--txt2); width:32px;height:32px;border-radius:var(--r-xs);font-size:16px;transition:.15s}
.modal-h .x:hover{background:var(--bad-bg);color:var(--red);border-color:var(--red)}
.modal-b{padding:22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-start; position:sticky;bottom:0;background:var(--surface)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px); background:var(--grad-green);color:#fff;padding:13px 24px;border-radius:var(--r-pill);font-weight:700; z-index:500;opacity:0;transition:.35s var(--ease-out);box-shadow:var(--sh-lg)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--grad-red)}
.shift-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.shift-tab{flex:1;min-width:120px;background:var(--surface);border:1.5px solid var(--border); border-radius:var(--r-md);padding:13px;text-align:center;cursor:pointer;transition:.18s var(--ease);box-shadow:var(--sh-xs)}
.shift-tab:hover{border-color:var(--primary-l);transform:translateY(-2px);box-shadow:var(--sh-sm)}
.shift-tab .t{font-size:var(--fs-base);font-weight:700;margin-bottom:3px}
.shift-tab .h{font-size:var(--fs-xs);color:var(--txt3)}
.shift-tab.active{border-color:transparent;background:var(--grad);color:var(--txt-on);box-shadow:var(--sh-primary)}
.shift-tab.active .h{color:rgba(255,255,255,.8)}
.shift-tab.done{border-color:var(--green)}
.shift-tab.done .t::after{content:' ✓';color:var(--green)}
.shift-tab.active.done .t::after{color:#fff}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--sh-xs)}
.seg button{background:transparent;color:var(--txt2);padding:8px 15px;font-size:var(--fs-sm);font-weight:700;transition:.15s}
.seg button:hover{background:var(--primary-soft);color:var(--primary-d)}
.seg button.on{background:var(--grad);color:var(--txt-on)}
.house-block{background:var(--card2);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;margin-bottom:13px}
.house-block h4{font-size:13.5px;margin-bottom:11px;color:var(--primary-d)}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-xs)}
.chart-wrap canvas{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--txt2);margin-top:10px}
.legend .it{display:flex;align-items:center;gap:7px;font-weight:600}
.legend .sw{width:16px;height:4px;border-radius:var(--r-pill)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .nm{width:150px;font-size:var(--fs-sm);color:var(--txt2);flex-shrink:0;font-weight:600}
.bar-track{flex:1;background:var(--bg2);border-radius:var(--r-pill);height:24px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:flex-end; padding:0 10px;font-size:var(--fs-xs);font-weight:800;color:#fff;min-width:30px;box-shadow:var(--sh-xs)}
.bar-row .vl{width:128px;text-align:left;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;font-weight:600}
.statrow{display:flex;align-items:center;justify-content:space-between;border-radius:var(--r-md); padding:12px 16px;margin-bottom:8px;background:var(--surface);border:1px solid var(--border); border-right:4px solid var(--primary);transition:border-color .18s var(--ease),box-shadow .18s;box-shadow:var(--sh-xs)}
.statrow:hover{box-shadow:var(--sh-sm);border-right-color:var(--primary)}
.statrow .lab{font-size:var(--fs-sm);font-weight:600;color:var(--txt2)}
.statrow .num{font-size:var(--fs-lg);font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
.st-blue{border-right-color:#3b82f6}
.st-blue .num{color:#1d4ed8}
.st-green{border-right-color:#16a34a}
.st-green .num{color:#15803d}
.st-amber{border-right-color:#d97706}
.st-amber .num{color:#b45309}
.st-cyan{border-right-color:#0891b2}
.st-cyan .num{color:#0e7490}
.st-purple{border-right-color:#9333ea}
.st-purple .num{color:#7e22ce}
.st-rose{border-right-color:#e11d48}
.st-rose .num{color:#be123c}
.st-teal{border-right-color:#0d9488}
.st-teal .num{color:#0f766e}
.st-slate{border-right-color:#64748b}
.st-slate .num{color:#475569}
.st-indigo{border-right-color:#4f46e5}
.st-indigo .num{color:#3730a3}
.st-orange{border-right-color:#ea580c}
.st-orange .num{color:#c2410c}
.st-trader{border-right-color:#9333ea}
.st-trader .num{color:#7e22ce}
.owner-hero{background:var(--grad);border-radius:var(--r-xl);padding:26px 28px;margin-bottom:20px; box-shadow:var(--sh-lg);position:relative;overflow:hidden;animation:popIn .5s var(--ease-out) both;color:#fff}
.owner-hero::after{content:'';position:absolute;left:-50px;top:-50px;width:220px;height:220px; background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
.owner-hero h2{font-size:var(--fs-2xl);color:#fff;margin-bottom:5px;font-weight:800;letter-spacing:-.6px}
.owner-hero .d{color:rgba(255,255,255,.9);font-size:var(--fs-sm)}
.owner-hero .date{position:absolute;left:26px;top:26px;background:rgba(255,255,255,.2); padding:7px 15px;border-radius:var(--r-pill);font-size:var(--fs-sm);color:#fff;font-weight:700;backdrop-filter:blur(4px)}
.ov-val{position:relative;background:var(--warn-bg)!important;border-radius:var(--r-xs);padding:2px 8px; box-shadow:inset 0 0 0 1.5px var(--amber);font-weight:800;color:var(--amber)}
.ov-val::after{content:'✏';font-size:9px;margin-right:4px;opacity:.85}
.ov-edit{cursor:pointer}
.ov-edit:hover{outline:1.5px dashed var(--amber);outline-offset:2px;border-radius:var(--r-xs)}
.ref-good{color:var(--green);font-weight:700}
.ref-bad{color:var(--amber);font-weight:700}
.spacer{flex:1}
@keyframes popIn{from{opacity:0;transform:translateY(16px) scale(.97)}
to{opacity:1;transform:none}
}
@keyframes growBar{from{width:0!important}
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(99,91,255,.45)}
50%{box-shadow:0 0 0 9px rgba(99,91,255,0)}
}
@keyframes spin{to{transform:rotate(360deg)}
}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-left:5px}
#saveInd{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px); background:var(--grad2);color:#fff;padding:10px 20px;border-radius:var(--r-pill);font-weight:700;font-size:13px; z-index:600;opacity:0;transition:.3s var(--ease-out);box-shadow:var(--sh-lg);display:flex;align-items:center;gap:4px}
#saveInd.show{transform:translateX(-50%) translateY(0);opacity:1}
#saveInd.done{background:var(--grad-green)}
.anim-kpi{animation:popIn .5s var(--ease-out) both}
.anim-kpi:nth-child(1){animation-delay:.04s}
.anim-kpi:nth-child(2){animation-delay:.1s}
.anim-kpi:nth-child(3){animation-delay:.16s}
.anim-kpi:nth-child(4){animation-delay:.22s}
.grow{animation:growBar 1s var(--ease-out) both}
.pulse{animation:pulse 2s infinite}
@media(max-width:1024px){.g4,.g5{grid-template-columns:repeat(2,1fr)}
.main{padding:20px}
}
@media(max-width:880px){.sidebar{position:fixed;right:0;top:58px;bottom:0;z-index:60;transform:translateX(100%); transition:transform .28s var(--ease-out);box-shadow:var(--sh-lg);width:264px;overflow-y:auto}
.sidebar.open{transform:none}
.menu-btn{display:block}
.g2,.g3,.g4,.g5{grid-template-columns:1fr}
.main{padding:16px}
.uname{display:none}
.page-head h2{font-size:var(--fs-xl)}
.bar-row .nm{width:110px}
.bar-row .vl{width:92px}
.sb-overlay{display:none;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.4);z-index:55;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sb-overlay.show{display:block}
}
@media(max-width:520px){.topbar{padding:9px 12px;gap:6px}
.brand span:last-child{display:none}
.main{padding:12px 10px}
.card{padding:14px 13px;border-radius:var(--r-md)}
.statrow{padding:11px 13px}
.statrow .num{font-size:var(--fs-md)}
.statrow .lab{font-size:13px}
.kpi{padding:15px 16px}
.kpi .val{font-size:var(--fs-xl)}
.page-head h2{font-size:var(--fs-lg)}
.page-head .sub{font-size:12px}
.btn,.btn-sec,.btn-green,.btn-red,.btn-amber{padding:11px 16px;font-size:14px}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:6px 10px;font-size:12px}
table{font-size:12px}
th,td{padding:8px 7px}
.modal{max-width:100%;margin:0;border-radius:16px 16px 0 0;max-height:94vh;position:fixed;bottom:0;left:0;right:0}
.modal-bg{align-items:flex-end}
.toolbar{gap:6px}
.toolbar select,.toolbar input{font-size:13px;padding:8px 10px}
.field input,.field select,.field textarea{font-size:16px;padding:10px 12px}
.seg button{padding:8px 11px;font-size:12.5px}
.tbl-wrap{max-height:64vh}
.syncBadge,#syncBadge{font-size:10px}
.user-chip .role{font-size:10px}
.nav-item{padding:13px 14px}
}
@media(max-width:400px){.brand .ic{font-size:18px}
.page-head .ic-wrap{width:38px;height:38px;font-size:18px}
.kpi .val{font-size:18px}
}
@media(hover:none) and (pointer:coarse){.nav-item,.btn,.btn-sec,.btn-sm,button{min-height:40px}
input[type=checkbox]{width:20px;height:20px}
}
/* ===== 📱 تجربة موبايل احترافية ===== */
.modal{display:flex;flex-direction:column;max-height:92vh}
.modal-b{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.modal-f{position:sticky;bottom:0;background:var(--surface);z-index:5}
#bottomNav{display:none;position:fixed;bottom:0;right:0;left:0;background:var(--surface);border-top:1px solid var(--border);z-index:150;padding:5px 4px calc(5px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#bottomNav button{flex:1;max-width:88px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:var(--txt2);padding:5px 2px;cursor:pointer;border-radius:12px;font-family:inherit}
#bottomNav button.on{color:var(--primary);font-weight:800;background:var(--primary-soft)}
#bottomNav button .ic{font-size:21px;line-height:1.15}
.modal-bg.show~#bottomNav{display:none!important}
@media(max-width:880px){
 html{-webkit-text-size-adjust:100%}
 input,select,textarea{font-size:16px!important;min-height:44px;border-radius:11px}
 input[type=date]{min-width:0}
 button,.btn,.btn-sec{min-height:42px}
 .btn-xs{min-height:34px!important;font-size:12px}
 #main{padding:12px 10px calc(20px + env(safe-area-inset-bottom))!important}
 .topbar{position:sticky;top:0;z-index:80;padding-top:calc(8px + env(safe-area-inset-top))}
 .card{padding:14px 12px;border-radius:15px}
 .grid.g4,.grid.g3{grid-template-columns:1fr 1fr;gap:10px}
 .kpi .val{font-size:19px}
 .tbl-wrap{-webkit-overflow-scrolling:touch;border-radius:12px}
 table th,table td{padding:10px 8px;font-size:12.5px;white-space:nowrap}
 .qa-bar button{min-width:72px!important;padding:10px 12px!important}
 .shift-tabs{overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}
 .shift-tab{flex:0 0 auto!important}
 .modal-bg{align-items:flex-end;padding:0}
 .modal{width:100%!important;max-width:100%!important;height:96vh;height:96dvh;max-height:96vh;max-height:96dvh;border-radius:20px 20px 0 0;margin:0}
 .modal-h{padding:14px 16px;position:sticky;top:0;background:var(--surface);z-index:5}
 .modal-f{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px}
 .modal-f .btn,.modal-f .btn-green,.modal-f .btn-sec{flex:1;min-height:50px;font-size:16px;font-weight:800}
 .sidebar{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
}
/* ===== ⚡ وضع الأداء للأندرويد (perf-lite) — بلور وأنيميشن أقل = سلاسة أعلى ===== */
.perf-lite .topbar{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}
.perf-lite .sidebar{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}
.perf-lite .sb-overlay{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.perf-lite .modal-bg{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(26,28,46,.55)}
.perf-lite .owner-hero .date{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.3)}
.perf-lite .page,.perf-lite .modal,.perf-lite .modal-bg,.perf-lite .login-card,.perf-lite .owner-hero,.perf-lite .anim-kpi,.perf-lite .grow,.perf-lite .pulse{animation:none!important}
/* 🔒 قفل سكرول الخلفية والقايمة/المودال مفتوحين (كل الأجهزة) */

const MERGE_ARRAYS=['users','farms','cycles','daily','feedMoves','medMoves','birdMoves','sales','yearlyRef','workers','wAbsence','medStock','equipment','faults','cleaning','issues','symptomLogs','attendanceLogs','cleaningJobs'];
function recTime(r){return Number(r&&(r._ts||r._mt))||0;}
/* مقارنة مستقرة بترتيب المفاتيح — كائنان بنفس المحتوى يتساويان حتى لو ترتيب المفاتيح مختلف */
function stableStr(o){
 if(o===null||typeof o!=='object')return JSON.stringify(o);
 if(Array.isArray(o))return '['+o.map(stableStr).join(',')+']';
 const keys=Object.keys(o).sort();
 return '{'+keys.map(k=>JSON.stringify(k)+':'+stableStr(o[k])).join(',')+'}';
}
function stableEq(a,b){try{return stableStr(a)===stableStr(b);}catch(e){return false;}}
/* دمج ذكي: يوحّد الصفوف بالـ id، الأحدث يكسب، ويحترم المحذوفات (tombstones)
   ⚡ v71: يرجّع {db,changed} — changed=true فقط لو المحلي أضاف حاجة مش موجودة بالسحابة
   (بديل مكافئ لـ stableEq القديمة لكن بدون تكلفتها القاتلة على الأندرويد)
   ⚠️ الدالة بتعدّل remote مباشرة (بدون نسخة عميقة) — تُستدعى فقط بـ snapshot جديد من Firebase */
function mergeDB(local,remote){
 const out=remote; // نبدأ من السحابة — snap.val() كائن جديد كل مرة فآمن نعدّله
 let changed=false;
 // اجمع المحذوفات من الجهتين
 const rDel=remote._del||{};
 const delMap=Object.assign({},rDel,local._del||{});
 MERGE_ARRAYS.forEach(key=>{
  const lArr=Array.isArray(local[key])?local[key]:[];
  const rArr=Array.isArray(remote[key])?remote[key]:[];
  const byId={};
  rArr.forEach(r=>{if(r&&r.id)byId[r.id]=r;else changed=true;/* صف بلا id بيتشال — لازم رفع تنظيف */});
  lArr.forEach(l=>{
   if(!l||!l.id){return;}
   const r=byId[l.id];
   if(!r){
    // موجود محلياً فقط: أضِفه إلا لو محذوف في السحابة بعد تعديله محلياً
    const delT=delMap[l.id]||0;
    if(delT&&delT>=recTime(l)){/* محذوف أحدث → تجاهل */}
    else {byId[l.id]=l;changed=true;}
   }else{
    // موجود في الجهتين: الأحدث يكسب
    if(recTime(l)>recTime(r)){byId[l.id]=l;changed=true;}
   }
  });
  // طبّق المحذوفات
  out[key]=Object.values(byId).filter(rec=>{
   const delT=delMap[rec.id]||0;
   if(delT&&delT>=recTime(rec)){changed=true;return false;}
   return true;
  });
 });
 // وحّد سجل المحذوفات واحتفظ بآخر 2000 فقط
 const allDel=Object.entries(delMap).sort((a,b)=>b[1]-a[1]).slice(0,2000);
 out._del={};allDel.forEach(([id,t])=>out._del[id]=t);
 // لو سجل المحذوفات النهائي مختلف عن اللي في السحابة → لازم رفع
 if(!changed){
  const rKeys=Object.keys(rDel),oKeys=Object.keys(out._del);
  if(rKeys.length!==oKeys.length)changed=true;
  else for(const id of oKeys){if(rDel[id]!==out._del[id]){changed=true;break;}}
 }
 // الإعدادات والكائنات غير المصفوفية: الأحدث بالـ _meta.rev/at
 const lMeta=local._meta||{},rMeta=remote._meta||{};
 if((lMeta.at||0)>(rMeta.at||0)){
  out.settings=local.settings||out.settings;
  out._meta=lMeta;
  changed=true;
 }
 return {db:normalizeDB(out),changed};
}

// ضغط LZW بسيط لتوفير مساحة النسخ الاحتياطية (بدون مكتبات خارجية)
function lzwCompress(str){
 const data=unescape(encodeURIComponent(str+'')); // UTF-8 → كل بايت في نطاق 0-255 (يدعم العربي)
 const dict={};let out=[];let curr='';let code=256;const MAX=65000;
 for(let i=0;i<256;i++)dict[String.fromCharCode(i)]=i;
 for(let i=0;i<data.length;i++){
  const c=data.charAt(i);const cc=curr+c;
  if(dict.hasOwnProperty(cc))curr=cc;
  else{out.push(dict[curr]);if(code<MAX)dict[cc]=code++;curr=c;}
 }
 if(curr!=='')out.push(dict[curr]);
 return out.map(n=>String.fromCharCode(n)).join('');
}
function lzwDecompress(comp){
 const data=(comp+'');const dict={};let curr=data.charAt(0);let out=curr;let code=256;const MAX=65000;
 for(let i=0;i<256;i++)dict[i]=String.fromCharCode(i);
 for(let i=1;i<data.length;i++){
  const k=data.charCodeAt(i);let entry;
  if(dict.hasOwnProperty(k))entry=dict[k];
  else if(k===code)entry=curr+curr.charAt(0);
  else return null;
  out+=entry;if(code<MAX)dict[code++]=curr+entry.charAt(0);curr=entry;
 }
 try{return decodeURIComponent(escape(out));}catch(e){return out;}
}

 if(bak.data)return bak.data; // نسخة قديمة
 if(bak.c){try{return JSON.parse(lzwDecompress(bak.c));}catch(e){return null;}}
 return null;
}
const LOCAL_BAK_DAYS=14; // محلياً 14 يوم (السحابة 30)
function autoBackup(){
 const baks=loadBackups();
 const day=todayISO();
 // ⚡ تخفيف: لا تضغط نسخة جديدة إلا كل 10 دقائق كحد أقصى (الضغط ثقيل مع البيانات الكبيرة)
 const existing=baks[day];
 if(existing&&existing.ts&&(Date.now()-existing.ts)<10*60*1000)return;
 // خزّن مضغوط
 try{
  const c=lzwCompress(JSON.stringify(DB));
  baks[day]={ts:Date.now(),c};
 }catch(e){ baks[day]={ts:Date.now(),data:DB}; }
 const days=Object.keys(baks).filter(k=>!k.startsWith('_')).sort();
 while(days.length>LOCAL_BAK_DAYS){const d=days.shift();delete baks[d];}
 try{localStorage.setItem(BAKKEY,JSON.stringify(baks));}
 catch(e){
  // امتلأ التخزين — احذف الأقدم تباعاً
  const dd=Object.keys(baks).filter(k=>!k.startsWith('_')).sort();
  while(dd.length){delete baks[dd.shift()];try{localStorage.setItem(BAKKEY,JSON.stringify(baks));break;}catch(e2){}}
 }
}
function restoreBackup(day){
 const baks=loadBackups();const bak=baks[day];if(!bak)return;
 const data=backupData(bak);
 if(!data){toast('تعذّر قراءة النسخة',1);return;}
 if(!confirm('استرجاع نسخة يوم '+day+'؟ سيتم استبدال البيانات الحالية.\n(سيتم حفظ نسخة طوارئ قبل الاسترجاع.)'))return;
 const baks2=loadBackups();
 try{baks2['_pre_restore']={ts:Date.now(),c:lzwCompress(JSON.stringify(DB))};}catch(e){baks2['_pre_restore']={ts:Date.now(),data:DB};}
 try{localStorage.setItem(BAKKEY,JSON.stringify(baks2));}catch(e){}
 DB=JSON.parse(JSON.stringify(data));
 localStorage.setItem(DBKEY,JSON.stringify(DB));
 if(FB_ON)fbPush();
 toast('تم استرجاع نسخة '+day+' ✓');renderApp();
}

function ventRateForWeight(kg){
 if(kg<=VENT_MIN[0][0])return VENT_MIN[0][1];
 for(let i=0;i<VENT_MIN.length-1;i++){
 if(kg>=VENT_MIN[i][0]&&kg<=VENT_MIN[i+1][0]){
 const [w1,r1]=VENT_MIN[i],[w2,r2]=VENT_MIN[i+1];
 return r1+(r2-r1)*(kg-w1)/(w2-w1);
 }
 }
 return VENT_MIN[VENT_MIN.length-1][1];
}

function saleAges(cyc){
 // v94: متوسط العمر مرجّح بعدد الطيور المباع في كل عمر — Σ(العمر×عدده) ÷ إجمالي المباع
 const s=DB.sales.filter(x=>x.cycleId===cyc.id)
  .map(x=>({a:ageOnDate(cyc,x.date),n:Number(x.count)||0})).filter(x=>x.a>0);
 if(!s.length)return {start:0,end:0,avg:0};
 const tot=s.reduce((t,x)=>t+x.n,0);
 const avg=tot>0?(s.reduce((t,x)=>t+x.a*x.n,0)/tot):(s.reduce((t,x)=>t+x.a,0)/s.length);
 return {start:Math.min(...s.map(x=>x.a)),end:Math.max(...s.map(x=>x.a)),avg:Math.round(avg*100)/100};
}
let _cfCache={}, _cfVer=0;
function invalidateCache(){_cfCache={};_cfVer++;}
function cycleFinal(cyc){
 const ck=cyc.id;
 if(_cfCache[ck])return _cfCache[ck];
 const _r=_cycleFinalCompute(cyc);
 _cfCache[ck]=_r;
 return _r;
}
function _cycleFinalCompute(cyc){
 const placed=cyclePlaced(cyc);
 const dead=deadCumulative(cyc.id);
 const culls=cycleCulls(cyc.id);
 const sales=cycleSales(cyc.id);
 const feedDaily=cycleFeedUsed(cyc.id);
 const feedIn=feedInTotal(cyc.id);
 const inv=cyc.endInventory||{};
 const hasInv=inv.feed!==''&&inv.feed!=null&&!isNaN(Number(inv.feed));
 const feedRemain=hasInv?Number(inv.feed):0;
 // v91: بطلب محمد — العلف في التقارير النهائية = صافي الوارد (وارد + محول وارد − محول صادر − مرتجع)
 // ومع الجرد بيتخصم المتبقي. المستهلك اليومي المسجل بيفضل متاح للمرجعية في feedDaily
 const feed=hasInv?Math.max(0,feedIn-feedRemain):feedIn;
 const feedMethod=hasInv?'inv':'in';
 const remain=birdsRemaining(cyc.id);
 const lw=lastWeight(cyc.id);
 const deadPct=placed?(dead/placed*100):0;
 const livability=100-deadPct;
 const avgFeedBird=sales.count?(feed/sales.count):0;
 const liveMeat=remain*(lw/1000);
 const totalMeat=sales.weight+liveMeat;
 const avgWeightBird=sales.count?(sales.weight/sales.count):(lw/1000);
 const fcr=totalMeat>0?(feed/totalMeat):0;
 const ages=saleAges(cyc);
 const costs=cyc.costs||{chick:0,feedKg:0,other:0};
 const chickCost=placed*(costs.chick||0);
 const feedCost=feed*(costs.feedKg||0);
 const expenses=cycleExpenses(cyc);
 const totalCost=chickCost+feedCost+expenses.total;
 const revenue=sales.amount;
 const traderDiscount=Number(cyc.traderDiscount)||0;
 const profit=revenue-totalCost-traderDiscount;
 const avgPrice=sales.weight?(sales.amount/sales.weight):0;
 const costPerKg=totalMeat>0?(totalCost/totalMeat):0;
 const profitPerKg=totalMeat>0?(profit/totalMeat):0;
 const rofFeed=feed>0?(profit/feed):0;
 const cfcr=fcr>0?(fcr+((2-avgWeightBird)/4)):0;
 const fcrTargetKg=Number(DB.settings.fcrTarget)||2.0;
 const fcrDiff=fcrTargetKg-avgWeightBird;
 const adjFCR=fcr>0?(fcr+(fcrDiff/4.5)):0;
 const adjFCRValid=Math.abs(fcrDiff)<=0.227;
 const epefAge=ages.avg||ageOnDate(cyc,todayISO());
 const epef=(epefAge>0&&fcr>0)?((livability*avgWeightBird)/(epefAge*fcr)*100):0;
 const R={placed,dead,culls,sales,feed,feedIn,feedRemain,feedMethod,feedDaily,remain,lw,deadPct,livability,avgFeedBird,
 liveMeat,totalMeat,avgWeightBird,fcr,ages,chickCost,feedCost,expenses,totalCost,
 revenue,traderDiscount,profit,avgPrice,costPerKg,profitPerKg,rofFeed,
 cfcr,adjFCR,adjFCRValid,fcrTargetKg,epef,costs};
 const ov=cyc.overrides||{};
 R._ov={};
 Object.keys(ov).forEach(k=>{ if(ov[k]!==''&&ov[k]!=null){ R[k]=Number(ov[k]); R._ov[k]=true; } });
 return R;
}

function aggregateCycles(cycList){

 cycList.forEach(c=>{

 });

 A.adjFCR=A.fcr>0?(A.fcr+(_fcrD/4.5)):0;

function autoCloseCycle(cycleId){
 const c=cycleById(cycleId);
 if(!c||c.status==='مغلقة')return false;
 const remain=birdsRemaining(cycleId);
 const placed=cyclePlaced(c);
 if(placed>0&&remain<=0){
  c.status='مغلقة';
  c._autoClosed=todayISO();
  c._ts=Date.now();
  save();
  toast(`🔒 دورة ${c.code} اتقفلت تلقائياً — المتبقي ${fmt(remain)}`);
  return true;
 }
 return false;
}
// فحص شامل: يقفل كل الدورات النشطة اللي متبقيها صفر أو سالب (يشتغل عند فتح البرنامج)
function autoCloseSweep(){
 let closed=[];
 DB.cycles.filter(c=>c.status!=='مغلقة').forEach(c=>{
  const placed=cyclePlaced(c);
  if(placed>0&&birdsRemaining(c.id)<=0){
   c.status='مغلقة';
   c._autoClosed=c._autoClosed||todayISO();
   c._ts=Date.now();
   closed.push(c.code);
  }
 });
 if(closed.length){
  save();
  toast(`🔒 اتقفلت تلقائياً ${closed.length} دورة (متبقيها صفر): ${closed.join('، ')}`);
 }
 return closed.length;
}

function carryMedStockAuto(srcId,dstId){
 const dst=cycleById(dstId);if(!dst)return 0;let n=0;
 ['drug','vaccine','disinfectant'].forEach(kind=>{
  medItemsOfCycle(srcId,kind).forEach(it=>{
   const bal=medBalance(srcId,kind,it);
   if(bal>0.0001){
    DB.medStock.push({id:uid('sk'),_ts:Date.now(),cycleId:dstId,farmId:dst.farm,kind,item:it,
     unit:medUnitOf(srcId,kind,it),move:'carry',qty:Number(bal.toFixed(3)),date:todayISO(),
     note:'مرحّل من '+(cycleById(srcId)?.code||'')});
    n++;
   }
  });
 });
 return n;
}

let _undoSnap=null,_undoTimer=null;
function snapshotForUndo(label,after){
 try{_undoSnap={data:JSON.stringify(DB),label:label||'العملية',after:after||null,at:Date.now()};}catch(e){_undoSnap=null;}
}
function toastUndo(msg){
 const t=$('#toast');if(!t)return;
 t.innerHTML=esc(msg)+' <button onclick="doUndo()" style="margin-right:10px;background:#fff;color:#111;border:none;border-radius:6px;padding:3px 12px;font-weight:700;cursor:pointer;font-size:13px">↩️ تراجع</button>';
 t.className='toast show';
 clearTimeout(_undoTimer);
 _undoTimer=setTimeout(()=>{t.className='toast';_undoSnap=null;},8000);
}
function doUndo(){
 if(!_undoSnap){toast('لا يوجد ما يمكن التراجع عنه',1);return;}
 try{
  DB=normalizeDB(JSON.parse(_undoSnap.data));
  invalidateCache();
  const after=_undoSnap.after;
  _undoSnap=null;clearTimeout(_undoTimer);
  save();
  toast('تم التراجع ✓');
  if(after&&typeof window[after]==='function')window[after]();
  else if(typeof go==='function')go(CUR);
 }catch(e){toast('تعذّر التراجع',1);}
}

const PRINT_COLORS={'st-blue':'#3b82f6','st-green':'#16a34a','st-amber':'#d97706','st-cyan':'#0891b2','st-purple':'#9333ea','st-rose':'#e11d48','st-teal':'#0d9488','st-slate':'#64748b','st-indigo':'#4f46e5','st-orange':'#ea580c','g':'#16a34a','r':'#e11d48','a':'#d97706','c':'#0891b2','p':'#9333ea'};
function rowColor(el,def){
 for(const c of (el.className||'').split(/\s+/)){ if(PRINT_COLORS[c])return PRINT_COLORS[c]; }
 return def||'#635bff';
}
function walkPrint(node,parts){
 if(!node||!node.children)return;
 let pendingCards=[];
 const flushCards=()=>{
 if(!pendingCards.length)return;
 parts.push('<div class="pcards">'+pendingCards.map(([l,v,sub,col])=>
 `<div class="pcard" style="border-right-color:${col}"><div class="pc-l">${l}</div><div class="pc-v" style="color:${col}">${v}${sub?`<span class="pc-s">${sub}</span>`:''}</div></div>`).join('')+'</div>');
 pendingCards=[];
 };
 [...node.children].forEach(ch=>{
 if(!ch.classList)return;
 if(ch.classList.contains('toolbar')||ch.classList.contains('no-print'))return;
 if(ch.classList.contains('card-title')){
 flushCards();
 const txt=ch.textContent.replace(/🖨️.*$/,'').replace(/\s+/g,' ').trim();
 if(txt)parts.push('<h3>'+esc(txt)+'</h3>');
 return;
 }
 if(ch.classList.contains('statrow')){
 const lbl=(ch.querySelector('.lab')||{}).textContent||'';
 const numEl=ch.querySelector('.num');
 let val=(numEl||{}).textContent||'';
 let sub='';const hintEl=numEl&&numEl.querySelector('.hint');
 if(hintEl){sub=hintEl.textContent.trim();val=val.replace(sub,'').trim();}
 pendingCards.push([esc(lbl.trim()),esc(val.trim()),esc(sub),rowColor(ch)]);
 return;
 }
 if(ch.classList.contains('kpi')){
 const lbl=(ch.querySelector('.lbl')||{}).textContent||'';
 const val=(ch.querySelector('.val')||{}).textContent||'';
 const subEl=ch.querySelector('.sub');const sub=subEl?subEl.textContent.trim():'';
 pendingCards.push([esc(lbl.trim()),esc(val.trim()),esc(sub),rowColor(ch)]);
 return;
 }
 if(ch.classList.contains('tbl-wrap')){
 flushCards();
 const t=ch.querySelector('table');
 if(t)parts.push(t.outerHTML);
 return;
 }
 if(ch.tagName==='TABLE'){ flushCards(); parts.push(ch.outerHTML); return; }
 if(ch.classList.contains('hint')){
 flushCards();
 const txt=ch.textContent.trim();
 if(txt)parts.push('<div style="font-size:11px;color:#888;margin:4px 0">'+esc(txt)+'</div>');
 return;
 }
 if(ch.classList.contains('card')){
 flushCards();
 const sub=[]; walkPrint(ch,sub);
 if(sub.length)parts.push('<div class="pcard-group">'+sub.join('')+'</div>');
 return;
 }
 if(ch.classList.contains('grid')){
 flushCards();
 walkPrint(ch,parts);
 return;
 }
 if(ch.querySelector&&(ch.querySelector('table')||ch.querySelector('.statrow')||ch.querySelector('.kpi')||ch.querySelector('.card-title'))){
 flushCards();
 walkPrint(ch,parts);
 }
 });
 flushCards();
}

 const fanCap=Number(DB.settings.fanCapacity)||36000;

 if(!kg||!birds){return `<div class="hint">⚠️ أدخل متوسط الوزن وعدد الطيور لعرض الاحتياجات.</div>`;}
 const ratePerBird=ventRateForWeight(kg);

 const dates=[...new Set(DB.daily.filter(d=>d.cycleId===cyc.id).map(d=>d.date))].sort();
 let actual=[],cumDead=0;
 dates.forEach(dt=>{const d=cycleDayData(cyc,dt);cumDead+=d.dead;
 let v=metric==='weight'?d.weight:metric==='feed'?d.feed:cumDead;
 actual.push({age:d.age,v});});
 actual=actual.filter(p=>p.age>0);
 const maxAge=Math.max(actual.length?Math.max(...actual.map(p=>p.age)):1, 1);
 let ref=[];
 if(metric!=='dead'){ROSS308.filter(r=>r.d<=maxAge+1).forEach(r=>{ref.push({age:r.d,v:metric==='weight'?r.w:r.fd});});}
 const allV=[...actual.map(p=>p.v),...ref.map(p=>p.v)].filter(v=>v>0);
 const maxV=allV.length?Math.max(...allV)*1.1:1;const maxX=maxAge;
 const X=a=>pad.l+(a-1)/(Math.max(maxX-1,1))*(W-pad.l-pad.r);
 const Y=v=>H-pad.b-(v/maxV)*(H-pad.t-pad.b);
 ctx.strokeStyle='#e7e9f2';ctx.fillStyle='#9095af';ctx.font='11px Tahoma';ctx.lineWidth=1;
 for(let i=0;i<=4;i++){const y=pad.t+i*(H-pad.t-pad.b)/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
 ctx.textAlign='right';ctx.fillText(fmt(maxV*(1-i/4),0),pad.l-6,y+4);}
 ctx.textAlign='center';
 for(let a=1;a<=maxX;a+=Math.ceil(maxX/10)){ctx.fillText(a,X(a),H-pad.b+16);}
 function line(pts,color,dash){if(pts.length<1)return;ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.setLineDash(dash||[]);
 ctx.beginPath();pts.forEach((p,i)=>{const x=X(p.age),y=Y(p.v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();ctx.setLineDash([]);}
 if(ref.length)line(ref,'#f5a623',[6,4]);
 if(actual.length)line(actual,'#635bff');
 ctx.fillStyle='#635bff';actual.forEach(p=>{ctx.beginPath();ctx.arc(X(p.age),Y(p.v),2.6,0,7);ctx.fill();});
 const ml={weight:'الوزن (جم)',feed:'العلف اليومي (جم)',dead:'النافق التراكمي'}[metric];
 $('#dashLegend').innerHTML=`<div class="it"><span class="sw" style="background:#635bff"></span>الفعلي — ${ml}</div>`+
 (ref.length?`<div class="it"><span class="sw" style="background:#f5a623"></span>مرجع Ross 308</div>`:'');
}

 const txt=(document.getElementById('slPasteTxt')?.value||'').trim();
 const msg=document.getElementById('slParseMsg');
 if(!txt){if(msg)msg.textContent='الصق النص أولاً';return;}
 const cats=['مجزر','قطاعي','ثقيل','خفيف'];
 const parsed=[];const skipped=[];
 txt.split(/\n+/).forEach((line,li)=>{
  line=line.trim();if(!line)return;
  // تطبيع: أرقام عربية → إنجليزية، فاصلة عشرية عربية ٫ → . ، شيل فاصل الآلاف ٬ والفواصل
  line=line.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))
           .replace(/٫/g,'.').replace(/[٬,]/g,'');
  // تجاهل سطور التاريخ (فيها /) وسطور بدون أرقام
  if(/\d+\s*\/\s*\d+/.test(line)){skipped.push('سطر تاريخ');return;}
  const nums=(line.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(!nums.length)return;
  // النص = الاسم (+ تصنيف لو مكتوب)
  let text=line.replace(/\d+(?:\.\d+)?/g,' ').replace(/[|\-_.:]/g,' ').replace(/\s+/g,' ').trim();
  let cat='';
  cats.forEach(c=>{if(text.includes(c)){cat=c;text=text.replace(c,'').trim();}});
  const trader=text;
  // سطر بدون اسم = غالباً صف الإجمالي أو سعر منفرد → تجاهل
  if(!trader){skipped.push('سطر إجمالي/رقم بدون اسم');return;}
  if(nums.length<2){skipped.push(`سطر ${li+1}: أرقام غير كافية`);return;}
  let count='',weight='',price='',amount='';
  const big=nums.filter(n=>n>=10000);
  if(big.length){
   // صيغة الدفتر: الاسم | وزنه | عدد | مبلغ  (المبلغ هو الرقم الكبير)
   amount=Math.max(...big);
   const rest=nums.filter(n=>n!==amount);
   if(rest.length>=2){
    // الوزن غالباً فيه كسر عشري؛ لو مفيش كسر: الأول وزن والثاني عدد (حسب ترتيب الدفتر)
    const dec=rest.find(n=>!Number.isInteger(n));
    if(dec!==undefined){weight=dec;count=rest.find(n=>n!==dec)??'';}
    else{weight=rest[0];count=rest[1];}
   }else if(rest.length===1){weight=rest[0];}
   price=(weight&&amount)?Math.round(amount/weight*100)/100:'';
  }else{
   // الصيغة المختصرة: الاسم عدد وزن سعر
   [count,weight,price]=nums;
   amount=(weight&&price)?Math.round(weight*price*100)/100:'';
  }
  parsed.push({count:count||'',weight:weight||'',price:price||'',amount:amount||'',
   houseId:'',trader,traderCat:cat,traderPhone:'',traderAddr:'',returnCount:'',note:''});
 });
 if(!parsed.length){if(msg)msg.textContent='لم يتم التعرف على أي عربية. كل سطر: اسم التاجر + الأرقام (وزن/عدد/مبلغ أو عدد/وزن/سعر)';return;}
 const existing=_saleLines.filter(l=>Number(l.count)>0||Number(l.weight)>0);
 _saleLines=existing.concat(parsed);
 // ملء بيانات التجار المعروفين
 _saleLines.forEach(l=>{
  if(l.trader){
   const prev=DB.sales.filter(x=>x.trader===l.trader).sort((a,b)=>(b._ts||0)-(a._ts||0))[0];
   if(prev){
    if(!l.traderPhone&&prev.traderPhone)l.traderPhone=prev.traderPhone;
    if(!l.traderAddr&&prev.traderAddr)l.traderAddr=prev.traderAddr;
    if(!l.traderCat&&prev.traderCat)l.traderCat=prev.traderCat;
   }
  }
 });
 slRenderLines();
 if(msg)msg.innerHTML=`✅ تم تحليل <b>${parsed.length} عربية</b>${skipped.length?` · تم تجاهل ${skipped.length} سطر (تاريخ/إجمالي)`:''} — راجع الأرقام وحدد العنبر لكل عربية.`;
 toast(`تم ملء ${parsed.length} عربية من اللصق ✓`);
}

 }

/* ⚖️ v91: توزيع عربية «غير محدد» تلقائياً على العنابر بنسبة العدد المتبقي (وإلا التسكين) */
function autoDistributeSale(cycleId,line){
 const cyc=cycleById(cycleId);if(!cyc)return[];
 const houses=(farmById(cyc.farm)?.houses||[]).filter(h=>Number((cyc.placedByHouse||{})[h.id])>0);
 if(!houses.length)return[];
 let ws=houses.map(h=>Math.max(0,birdsRemainingHouse(cycleId,h.id)));
 if(ws.reduce((a,b)=>a+b,0)<=0)ws=houses.map(h=>Number((cyc.placedByHouse||{})[h.id])||0);
 const tot=ws.reduce((a,b)=>a+b,0);if(tot<=0)return[];
 const count=Number(line.count)||0,weight=Number(line.weight)||0,amount=Number(line.amount)||0;
 const raw=ws.map(w=>count*w/tot);
 const base=raw.map(Math.floor);
 let rem=count-base.reduce((a,b)=>a+b,0);
 const order=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
 for(let k=0;k<rem;k++)base[order[k%order.length][1]]++;
 return houses.map((h,i)=>({houseId:h.id,count:base[i],
  weight:count?Number((weight*base[i]/count).toFixed(1)):0,
  amount:count?Number((amount*base[i]/count).toFixed(2)):0})).filter(x=>x.count>0);
}
function saveSale(id){
 const cycleId=$('#slCycle').value;
 const date=$('#slDate').value;
 const farmId=cycleById(cycleId)?.farm;
 const lines=_saleLines.filter(l=>Number(l.count)>0);
 if(!lines.length){toast('أدخل عربية واحدة على الأقل بعدد',1);return;}
 // لو المزرعة فيها عنبر واحد بس، اختاره تلقائياً لكل العربيات
 const cycHouses=(farmById(cycleById(cycleId)?.farm)?.houses||[]);
 if(cycHouses.length===1)lines.forEach(l=>{if(!l.houseId)l.houseId=cycHouses[0].id;});
 const noHouseIdx=[];
 _saleLines.forEach((l,i)=>{if(Number(l.count)>0&&!l.houseId)noHouseIdx.push(i);});
 if(noHouseIdx.length){
  // علّم العربيات الناقصة بإطار أحمر واضح
  slRenderLines();
  setTimeout(()=>{
   const box=document.getElementById('slLines');
   if(box){
    const cards=box.children;
    noHouseIdx.forEach(i=>{if(cards[i]){cards[i].style.border='2.5px solid #dc2626';cards[i].style.background='#fef2f2';}});
    if(cards[noHouseIdx[0]]&&cards[noHouseIdx[0]].scrollIntoView)cards[noHouseIdx[0]].scrollIntoView({behavior:'smooth',block:'center'});
   }
  },50);
  toast(`⚠️ اختر العنبر للعربيات المعلّمة بالأحمر (${noHouseIdx.length} عربية) ثم احفظ`,1);
  return;
 }
 if(id){
  const ex=DB.sales.find(x=>x.id===id);
  if(isManager()&&!within24h(ex)){toast('انتهت مهلة التعديل',1);return;}
  const l=lines[0];
  if(l.houseId==='__auto__'){toast('التوزيع التلقائي متاح عند إضافة بيع جديد فقط — اختر عنبراً محدداً للتعديل',1);return;}
  Object.assign(ex,{date,cycleId,farmId,houseId:l.houseId,count:Number(l.count),weight:Number(l.weight)||0,
   price:Number(l.price)||0,amount:Number(l.amount)||0,
   trader:(l.trader||'').trim(),traderCat:l.traderCat||'',traderPhone:(l.traderPhone||'').trim(),
   traderAddr:(l.traderAddr||'').trim(),returnCount:Number(l.returnCount)||0,note:(l.note||'').trim()});
  save();closeModal();toast('تم تعديل البيع ✓');
  if(autoCloseCycle(cycleId)){renderSales();return;}renderSales();return;
 }
 // v91: توسيع عربيات «التوزيع التلقائي» لصفوف لكل عنبر بنسبة العدد المتبقي
 const expanded=[];
 lines.forEach(l=>{
  if(l.houseId==='__auto__'){
   const parts=autoDistributeSale(cycleId,l);
   if(!parts.length){expanded.push({...l,houseId:''});return;}
   parts.forEach(p=>expanded.push({...l,houseId:p.houseId,count:p.count,weight:p.weight,amount:p.amount,
    note:(((l.note||'')+' ').trim()+'(موزع تلقائياً)').trim()}));
  }else expanded.push(l);
 });
 const grp=uid('grp');
 expanded.forEach((l,idx)=>{
  DB.sales.push({id:uid('s'),_ts:Date.now()+idx,date,cycleId,farmId,houseId:l.houseId,
   count:Number(l.count),weight:Number(l.weight)||0,price:Number(l.price)||0,amount:Number(l.amount)||0,
   trader:(l.trader||'').trim(),traderCat:l.traderCat||'',traderPhone:(l.traderPhone||'').trim(),
   traderAddr:(l.traderAddr||'').trim(),returnCount:Number(l.returnCount)||0,note:(l.note||'').trim(),
   groupId:grp});
 });
 save();closeModal();
 toast(`تم تسجيل ${expanded.length} ${expanded.length>lines.length?'صف بيع (بعد التوزيع التلقائي)':'عربية'} ✓`);
 if(autoCloseCycle(cycleId)){renderSales();return;}renderSales();
}

function _repTitle(){return ((REP_TABS.find(t=>t.id===repState.tab)||{}).name||'تقرير').replace(/[^\u0600-\u06FF\w\s]/g,'').trim();}
function domToPng(el,cb,mime,quality){
 try{
  const w=Math.min(Math.max(el.scrollWidth,el.offsetWidth,600),1800);
  const ht=Math.max(el.scrollHeight,el.offsetHeight,200);
  let css='';document.querySelectorAll('style').forEach(s=>css+=s.textContent);
  const clone=el.cloneNode(true);
  clone.querySelectorAll('.no-print,.toolbar,select,button').forEach(x=>{if(x.closest('table'))return;x.remove();});
  clone.style.width=w+'px';
  const xml=new XMLSerializer().serializeToString(clone);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+ht+'">'
   +'<foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="background:#f4f5fb;font-family:-apple-system,Segoe UI,Tahoma,Arial,sans-serif">'
   +'<style>'+css+'</style>'+xml+'</div></foreignObject></svg>';
  const img=new Image();
  img.onload=()=>{
   try{
    const cv=document.createElement('canvas');
    const sc=2;cv.width=w*sc;cv.height=ht*sc;
    const ctx=cv.getContext('2d');ctx.scale(sc,sc);
    ctx.fillStyle='#f4f5fb';ctx.fillRect(0,0,w,ht);
    ctx.drawImage(img,0,0);
    cv.toBlob(b=>cb(b||null,w*sc,ht*sc),mime||'image/png',quality);
   }catch(e){console.warn('shot',e);cb(null);}
  };
  img.onerror=()=>cb(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 }catch(e){console.warn('shot',e);cb(null);}
}
/* 📄 v103: بناء PDF صفحة واحدة من صورة JPEG يدوياً — بدون أي مكتبة خارجية (offline-first) */
function buildImagePdfBytes(jpegBytes,wPx,htPx){
 const enc=new TextEncoder();
 const parts=[];let offset=0;const offsets=[];
 function push(x){if(typeof x==='string')x=enc.encode(x);parts.push(x);offset+=x.length;}
 push('%PDF-1.4\n');
 offsets[1]=offset;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 offsets[2]=offset;push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
 offsets[3]=offset;push('3 0 obj\n<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 4 0 R >> >> /MediaBox [0 0 '+wPx+' '+htPx+'] /Contents 5 0 R >>\nendobj\n');
 offsets[4]=offset;
 push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+wPx+' /Height '+htPx+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegBytes.length+' >>\nstream\n');
 push(jpegBytes);
 push('\nendstream\nendobj\n');
 const content='q '+wPx+' 0 0 '+htPx+' 0 0 cm /Im0 Do Q';
 offsets[5]=offset;push('5 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
 const xrefStart=offset;
 let xref='xref\n0 6\n0000000000 65535 f \n';
 for(let i=1;i<=5;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
 push(xref);
 push('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');
 let total=0;parts.forEach(p=>total+=p.length);
 const out=new Uint8Array(total);let pos=0;
 parts.forEach(p=>{out.set(p,pos);pos+=p.length;});
 return out;
}

function repFarmsWeek(){
 const af=activeFarms();
 let h=`<div class="card"><div class="card-title">📆 التقرير الأسبوعي المفصّل + مرجع Ross</div>`;
 if(!af.length)return h+emptyState('📆','لا توجد مزارع نشطة.')+`</div>`;
 h+=`<div class="tbl-wrap"><table><thead><tr><th>المزرعة</th><th class="num">العمر الحالي</th>
 <th class="num">الأسبوع</th><th class="num">متوسط الوزن</th><th class="num">وزن المرجع</th>
 <th class="num">% للمرجع</th><th class="num">نافق% تراكمي</th><th class="num">علف تراكمي</th></tr></thead><tbody>`;
 af.forEach(f=>{
  const cyc=activeCycleOfFarm(f.id);if(!cyc)return;
  const age=ageOnDate(cyc,todayISO());const wk=Math.max(1,Math.ceil(age/7));const ref=rossRow(age);
  const lw=lastWeight(cyc.id);const pct=ref&&lw?(lw/ref.w*100):0;
  const dp=cyclePlaced(cyc)?(deadCumulative(cyc.id)/cyclePlaced(cyc)*100):0;
  h+=`<tr><td><b>${esc(f.name)}</b></td><td class="num">${age} ي</td><td class="num">أسبوع ${wk}</td>
  <td class="num">${lw?fmt(lw):'-'}</td><td class="num">${ref?fmt(ref.w):'-'}</td>
  <td class="num">${pct?`<span class="badge ${pct>=98?'b-ok':pct>=92?'b-warn':'b-bad'}">${pct.toFixed(0)}%</span>`:'-'}</td>
  <td class="num">${dp.toFixed(1)}%</td><td class="num">${fmt(cycleFeedUsed(cyc.id))} كجم</td></tr>`;
 });
 h+=`</tbody></table></div></div>`;
 // 📊 v77: تفصيل أسبوع بأسبوع لكل مزرعة — أسبوعي + كلي (من عمر يوم لنهاية الأسبوع المعروض)
 af.forEach(f=>{
  const cyc=activeCycleOfFarm(f.id);if(!cyc||!cyc.startDate)return;
  const placed=cyclePlaced(cyc);if(!placed)return;
  const age=Math.max(1,ageOnDate(cyc,todayISO()));
  const dISO=a=>{const d=new Date(cyc.startDate+'T12:00:00');d.setDate(d.getDate()+a-1);return d.toISOString().slice(0,10);};
  const daily=DB.daily.filter(d=>d.cycleId===cyc.id);
  const sales=DB.sales.filter(s=>s.cycleId===cyc.id);
  const moves=DB.birdMoves.filter(m=>m.cycleId===cyc.id);
  let cumDead=0,cumCulls=0,cumFeed=0,cumSold=0,cumSoldW=0,cumMoveNet=0,prevW=0;
  const nWk=Math.ceil(age/7);
  let rows='';
  for(let w=1;w<=nWk;w++){
   const d1=(w-1)*7+1,d2=Math.min(w*7,age);
   const from=dISO(d1),to=dISO(d2);
   const inWk=r=>r.date>=from&&r.date<=to;
   const wkDead=daily.filter(inWk).reduce((s,d)=>s+(Number(d.dead)||0),0);
   const wkCulls=daily.filter(inWk).reduce((s,d)=>s+(Number(d.culls)||0),0);
   const wkFeed=daily.filter(inWk).reduce((s,d)=>s+(Number(d.feed)||0),0);
   const wkSold=sales.filter(inWk).reduce((s,x)=>s+(Number(x.count)||0),0);
   const wkSoldW=sales.filter(inWk).reduce((s,x)=>s+(Number(x.weight)||0),0);
   const wkMoveNet=moves.filter(inWk).reduce((s,m)=>s+(m.type==='transfer_in'?1:-1)*(Number(m.qty)||Number(m.count)||0),0);
   const aliveStart=placed+cumMoveNet-cumDead-cumCulls-cumSold;
   cumDead+=wkDead;cumCulls+=wkCulls;cumFeed+=wkFeed;cumSold+=wkSold;cumSoldW+=wkSoldW;cumMoveNet+=wkMoveNet;
   const aliveEnd=Math.max(1,placed+cumMoveNet-cumDead-cumCulls-cumSold);
   const aliveAvg=Math.max(1,(aliveStart+aliveEnd)/2);
   const wkDeadPct=aliveStart>0?(wkDead/aliveStart*100):0;
   const cumDeadPct=placed?(cumDead/placed*100):0;
   const fpbWk=wkFeed*1000/aliveAvg;
   const fpbCum=cumFeed*1000/aliveEnd;
   const wrecs=daily.filter(d=>Number(d.weight)>0&&d.date<=to).sort((a,b)=>a.date<b.date?1:-1);
   const wEnd=wrecs.length?Number(wrecs[0].weight):0;
   const wkGain=wEnd&&prevW?(wEnd-prevW):(wEnd&&w===1?wEnd-44:0);
   const ref=rossRow(d2);
   const wPct=ref&&wEnd?(wEnd/ref.w*100):0;
   const liveKg=aliveEnd*wEnd/1000;
   const fcrCum=(liveKg+cumSoldW)>0&&wEnd?(cumFeed/(liveKg+cumSoldW)):0;
   const isCur=w===nWk;
   rows+=`<tr ${isCur?'style="background:var(--info-bg)"':''}>
    <td><b>أسبوع ${w}</b><div class="hint" style="font-size:10px">يوم ${d1}-${d2}</div></td>
    <td class="num">${fmt(aliveStart)}${w===1?'<div class="hint" style="font-size:10px">التسكين</div>':''}</td>
    <td class="num">${wkDead?fmt(wkDead):'0'}</td>
    <td class="num">${wkDeadPct?wkDeadPct.toFixed(2)+'%':'0%'}</td>
    <td class="num"><b>${fmt(cumDead)}</b></td>
    <td class="num"><b>${cumDeadPct?cumDeadPct.toFixed(2)+'%':'0%'}</b></td>
    <td class="num" style="color:var(--green)"><b>${fmt(aliveEnd)}</b></td>
    <td class="num">${fmt(wkFeed)}</td>
    <td class="num"><b>${fmt(cumFeed)}</b></td>
    <td class="num">${fpbWk?fmt(fpbWk,0):'—'}</td>
    <td class="num"><b>${fpbCum?fmt(fpbCum,0):'—'}</b>${ref?`<div class="hint" style="font-size:10px">مرجع ${fmt(ref.fc)}</div>`:''}</td>
    <td class="num">${wEnd?fmt(wEnd):'—'}${ref?`<div class="hint" style="font-size:10px">مرجع ${fmt(ref.w)}</div>`:''}</td>
    <td class="num">${wkGain?fmt(wkGain):'—'}</td>
    <td class="num">${wPct?`<span class="badge ${wPct>=98?'b-ok':wPct>=92?'b-warn':'b-bad'}">${wPct.toFixed(0)}%</span>`:'—'}</td>
    <td class="num">${fcrCum?fcrCum.toFixed(2):'—'}${ref?`<div class="hint" style="font-size:10px">مرجع ${ref.fcr.toFixed(2)}</div>`:''}</td></tr>`;
   if(wEnd)prevW=wEnd;
  }
  h+=`<div class="card"><div class="card-title">🐔 ${esc(f.name)} — ${esc(cyc.code)} <span class="badge b-info">عمر ${age} يوم · ${fmt(placed)} تسكين</span></div>
  <div class="tbl-wrap"><table><thead><tr>
   <th>الأسبوع</th>
   <th class="num">العدد أول<br>الأسبوع</th>
   <th class="num">نافق<br>الأسبوع</th><th class="num">نسبة نافق<br>الأسبوع %</th>
   <th class="num">نافق<br>كلي</th><th class="num">نسبة نافق<br>كلي %</th>
   <th class="num">العدد<br>المتبقي</th>
   <th class="num">علف الأسبوع<br>(كجم)</th><th class="num">علف كلي<br>(كجم)</th>
   <th class="num">علف/طائر<br>الأسبوع (جم)</th><th class="num">علف/طائر<br>كلي (جم)</th>
   <th class="num">الوزن الكلي<br>(جم)</th><th class="num">الوزن المكتسب<br>بالأسبوع (جم)</th>
   <th class="num">%<br>للمرجع</th><th class="num">FCR<br>تراكمي</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="hint" style="margin-top:6px">«كلي» = من عمر يوم حتى نهاية الأسبوع المعروض. «العدد أول الأسبوع» في أول صف = التسكين. نسبة النافق الأسبوعي على العدد الحي أول الأسبوع، والكلية على التسكين. العدد المتبقي بيخصم النافق والإعدام والمبيعات والتحويلات حتى نهاية الأسبوع. علف/طائر الكلي على الطائر الحي (زي مرجع Ross). FCR التراكمي = العلف الكلي ÷ (وزن الحي + وزن المبيعات). الصف الملون = الأسبوع الحالي.</div></div>`;
 });
 return h+`<div class="card"><div class="hint">% للمرجع = متوسط الوزن الفعلي ÷ وزن Ross المستهدف لنفس العمر. أخضر ≥98% — أصفر 92-98% — أحمر <92%.</div></div>`;

/* 🧹 v100: تقرير التجهيز اليومي بين الدورات — من يوم إقفال آخر دورة، يوم بيوم */
function repRestPrep(){
 const mgr=isManager();
 const farms=mgr?DB.farms.filter(f=>f.id===ME.farm):DB.farms;
 if(!farms.length)return `<div class="card">${emptyState('🧹','لا توجد مزارع.')}</div>`;

 if(!repState.farmId||!farms.find(f=>f.id===repState.farmId))repState.farmId=farms[0].id;
 const farm=farmById(repState.farmId);
 // آخر دورة مقفولة = بداية فترة التجهيز
 const closed=DB.cycles.filter(c=>c.farm===farm.id&&c.status==='مغلقة')
  .map(c=>({c,end:cycleEndDate(c)})).sort((a,b)=>b.end.localeCompare(a.end));
 let h=`<div class="card"><div class="toolbar">
  ${mgr?`<b>🏠 ${esc(farm.name)}</b>`:`<select onchange="repState.farmId=this.value;renderReports()">
   ${farms.map(f=>`<option value="${f.id}" ${f.id===repState.farmId?'selected':''}>${esc(f.name)}</option>`).join('')}</select>`}
  <div class="spacer" style="flex:1"></div>
  <button class="btn btn-sm" onclick="cjFarm='${farm.id}';cleaningJobModal()">+ تسجيل يوم تجهيز</button>
 </div></div>`;
 if(!closed.length)return h+`<div class="card">${emptyState('🧹','لا توجد دورة مقفولة بعد في المزرعة دي — التقرير بيبدأ من يوم إقفال الدورة.')}</div>`;
 return h+_restPrepInner(farm,closed);

/* الجسم المشترك — بيستخدمه تبويب التقارير + التقرير اليومي وقت الراحة */
function _restPrepInner(farm,closedList){
 const closed=closedList||DB.cycles.filter(c=>c.farm===farm.id&&c.status==='مغلقة')
  .map(c=>({c,end:cycleEndDate(c)})).sort((a,b)=>b.end.localeCompare(a.end));
 if(!closed.length)return `<div class="card">${emptyState('🧹','لا توجد دورة مقفولة بعد.')}</div>`;
 let h='';
 const last=closed[0];
 // نهاية الفترة: بداية دورة جديدة (لو اتفتحت بعد الإقفال) أو النهارده
 const nextCyc=DB.cycles.filter(c=>c.farm===farm.id&&c.startDate&&c.startDate>last.end)
  .sort((a,b)=>a.startDate.localeCompare(b.startDate))[0];
 const periodEnd=nextCyc?nextCyc.startDate:todayISO();
 // v103: دمج التجهيز المبكر (أثناء الدورة قبل الإقفال) مع سجل ما بعد الإقفال في جدول واحد متصل زمنياً
 const earlyJobs=_earlyPrepJobs(farm,last.c,last.end); // من بداية آخر دورة حتى إقفالها
 // أيام الفترة (من اليوم التالي للإقفال) — بحد أقصى 90 يوم
 const days=[];
 const d0=new Date(last.end+'T12:00:00');
 for(let i=1;i<=90;i++){
  const d=new Date(d0.getTime()+i*864e5).toISOString().slice(0,10);
  if(d>periodEnd)break;
  days.push({n:i,date:d});
 }
 const jobsByDate={};
 (DB.cleaningJobs||[]).filter(j=>j.farmId===farm.id&&j.date>last.end&&j.date<=periodEnd)
  .forEach(j=>{(jobsByDate[j.date]=jobsByDate[j.date]||[]).push(j);});
 const regDays=Object.keys(jobsByDate).length;
 // v101: تقسيم العمالة — خارجية (باليومية) / مزرعة (بيسجلوا حضور عادي)
 const jExt=j=>(j.extWorkers!=null?Number(j.extWorkers):((j.team||[]).reduce((s,g)=>s+(Number(g.count)||0),0)));
 const jFarm=j=>Number(j.farmWorkers)||0;
 let totExt=0,totFarmW=0,totC=0;
 earlyJobs.forEach(j=>{totExt+=jExt(j);totFarmW+=jFarm(j);totC+=j.totalCost||(j.team||[]).reduce((s,g)=>s+(Number(g.count)||0)*(Number(g.costPer)||0),0);});
 Object.values(jobsByDate).forEach(list=>list.forEach(j=>{
  totExt+=jExt(j);totFarmW+=jFarm(j);
  totC+=j.totalCost||(j.team||[]).reduce((s,g)=>s+(Number(g.count)||0)*(Number(g.costPer)||0),0);
 }));
 const totW=totExt+totFarmW;
 h+=`<div class="grid g4" style="margin-bottom:14px">
  ${kpi('c','🔒 آخر دورة',esc(last.c.code),'اتقفلت: '+esc(last.end))}
  ${kpi('p','📆 أيام التجهيز',days.length+' يوم'+(earlyJobs.length?(' + '+earlyJobs.length+' سجل مبكر'):''),nextCyc?('لحد تسكين '+esc(nextCyc.code)):'حتى النهارده')}
  ${kpi(regDays<days.length?'a':'g','✅ أيام مسجلة',regDays+' / '+days.length,regDays<days.length?('ناقص '+(days.length-regDays)+' يوم'):'كامل ✓')}
  ${kpi('','👷 إجمالي العمالة',fmt(totW)+' عامل','🚚 خارجي '+fmt(totExt)+' · 🏠 مزرعة '+fmt(totFarmW)+' · '+fmt(totC)+' '+DB.settings.currency)}
 </div>`;
 const rowActs=(j)=>{
  const ew=jExt(j),fw=jFarm(j);
  const c=j.totalCost||(j.team||[]).reduce((s,g)=>s+(Number(g.count)||0)*(Number(g.costPer)||0),0);
  const actsTxt=Array.isArray(j.acts)&&j.acts.length?j.acts:(j.task?[j.task]:[]);
  return {ew,fw,c,actsTxt};
 };
 h+=`<div class="card"><div class="card-title">🧹 سجل التجهيز الكامل — ${esc(farm.name)} <span class="badge b-info">من بداية ${esc(last.c.code)} حتى ${nextCyc?('تسكين '+esc(nextCyc.code)):'النهارده'}</span></div>
  <div class="tbl-wrap"><table><thead><tr>
   <th>المرحلة</th><th>التاريخ</th><th class="num">🏠 عمالة<br>المزرعة</th><th class="num">🚚 عمالة<br>خارجية</th><th class="num">👷 إجمالي<br>اليوم</th><th>الأعمال المنفذة</th>
   <th class="num">تكلفة الخارجي</th><th>ملاحظات</th><th class="no-print"></th></tr></thead><tbody>`;
 // 1) صفوف التجهيز المبكر (أثناء الدورة، قبل الإقفال) — بترتيب زمني تصاعدي
 earlyJobs.forEach(j=>{
  const {ew,fw,c,actsTxt}=rowActs(j);
  h+=`<tr style="background:var(--primary-soft)"><td><span class="badge b-info">🐣 قبل الإقفال</span></td><td>${esc(j.date)}</td>
   <td class="num">${fw?fmt(fw):'—'}</td><td class="num">${ew?fmt(ew):'—'}</td><td class="num"><b>${fmt(ew+fw)}</b></td>
   <td>${actsTxt.map(a=>`<span class="badge b-info" style="margin:1px">${esc(a)}</span>`).join(' ')}</td>
   <td class="num">${c?fmt(c):'—'}</td><td style="font-size:12px">${esc(j.note||'')}</td>
   <td class="num no-print"><button class="btn-sec btn-xs" onclick="cleaningJobModal('${j.id}')">تعديل</button>
    <button class="btn-red btn-xs" onclick="delCleaningJob('${j.id}')">حذف</button></td></tr>`;
 });
 // 2) صفوف الفترة الرسمية بعد الإقفال — يوم بيوم (الأحدث أولاً زي ما كان، بعد المبكرة اللي فوق)
 days.slice().reverse().forEach(dy=>{
  const list=jobsByDate[dy.date]||[];
  if(!list.length){
   h+=`<tr style="opacity:.55"><td class="num">${dy.n}</td><td>${esc(dy.date)}</td>
    <td class="num">—</td><td class="num">—</td><td class="num">—</td><td style="color:var(--txt3)">لم يُسجل</td><td class="num">—</td><td></td>
    <td class="num no-print"><button class="btn-sec btn-xs" onclick="cjFarm='${farm.id}';cleaningJobModal();setTimeout(()=>{const d=document.getElementById('cjDate');if(d)d.value='${dy.date}';},60)">+ سجّل</button></td></tr>`;
   return;
  }
  list.forEach((j,li)=>{
   const {ew,fw,c,actsTxt}=rowActs(j);
   h+=`<tr><td class="num">${li===0?('<b>'+dy.n+'</b>'):''}</td><td>${li===0?esc(dy.date):''}</td>
    <td class="num">${fw?fmt(fw):'—'}</td>
    <td class="num">${ew?fmt(ew):'—'}</td>
    <td class="num"><b>${fmt(ew+fw)}</b></td>
    <td>${actsTxt.map(a=>`<span class="badge b-info" style="margin:1px">${esc(a)}</span>`).join(' ')}</td>
    <td class="num">${c?fmt(c):'—'}</td>
    <td style="font-size:12px">${esc(j.note||'')}</td>
    <td class="num no-print"><button class="btn-sec btn-xs" onclick="cleaningJobModal('${j.id}')">تعديل</button>
     <button class="btn-red btn-xs" onclick="delCleaningJob('${j.id}')">حذف</button></td></tr>`;
  });
 });
 h+=`<tr class="tbl-total"><td colspan="2">الإجمالي (${regDays} يوم مسجل${earlyJobs.length?(' + '+earlyJobs.length+' سجل مبكر'):''})</td>
  <td class="num">${fmt(totFarmW)}</td><td class="num">${fmt(totExt)}</td><td class="num"><b>${fmt(totW)}</b></td><td>—</td><td class="num">${fmt(totC)} ${DB.settings.currency}</td><td colspan="2">—</td></tr>`;
 h+=`</tbody></table></div>
 <div class="hint" style="margin-top:8px">الصفوف الملونة بعلامة «🐣 قبل الإقفال» = تجهيز اتسجل أثناء الدورة نفسها قبل ما تتقفل رسمياً. باقي الصفوف من اليوم التالي للإقفال — الباهتة منها لسه من غير تسجيل، دوس «+ سجّل» لتكملتها.</div>

 return h;

/* ===== 🤝 تقرير التجار ===== */
let tradersState={sort:'score',cat:''};
function repTraders(){
 const scope=isManager()?(()=>{const ids=mgrCycles().map(c=>c.id);return DB.sales.filter(s=>ids.includes(s.cycleId)||(s.farmId===ME.farm&&!s.cycleId));})():DB.sales;
 const withTrader=scope.filter(s=>s.trader&&s.trader.trim());
 if(!withTrader.length)return `<div class="card">${emptyState('🤝','لا توجد مبيعات مسجّلة باسم تاجر بعد. أضف اسم التاجر عند تسجيل البيع.')}</div>`;
 // تجميع حسب التاجر
 const map={};
 withTrader.forEach(s=>{
  const k=s.trader.trim();
  if(!map[k])map[k]={name:k,cat:s.traderCat||'',phone:s.traderPhone||'',addr:s.traderAddr||'',
   count:0,weight:0,amount:0,returns:0,deals:new Set(),lastDate:'',firstDate:'',prices:[]};
  const t=map[k];
  t.count+=Number(s.count)||0;
  t.weight+=Number(s.weight)||0;
  t.amount+=Number(s.amount)||0;
  t.returns+=Number(s.returnCount)||0;
  if(s.groupId)t.deals.add(s.date+'|'+s.groupId);else t.deals.add(s.id);
  if(s.traderCat&&!t.cat)t.cat=s.traderCat;
  if(s.traderPhone&&!t.phone)t.phone=s.traderPhone;
  if(s.traderAddr&&!t.addr)t.addr=s.traderAddr;
  if(Number(s.weight)>0&&Number(s.price)>0)t.prices.push(Number(s.price));
  if(!t.lastDate||s.date>t.lastDate)t.lastDate=s.date;
  if(!t.firstDate||s.date<t.firstDate)t.firstDate=s.date;
 });
 let traders=Object.values(map);
 // فلترة بالتصنيف
 if(tradersState.cat)traders=traders.filter(t=>t.cat===tradersState.cat);
 // إجماليات (قبل الترتيب — بتدخل في حساب التقييم)
 const tot={count:0,weight:0,amount:0,returns:0};
 traders.forEach(t=>{tot.count+=t.count;tot.weight+=t.weight;tot.amount+=t.amount;tot.returns+=t.returns;});
 // ⭐ v73: نسبة المرتجع % + تقييم شامل لكل تاجر (0-100)
 // حجم الشراء 40 + نظافة المرتجع 30 + متوسط السعر مقابل السوق 15 + الحداثة 15
 const maxAmount=Math.max(1,...traders.map(t=>t.amount));
 const overallAvgP=tot.weight>0?tot.amount/tot.weight:0;
 traders.forEach(t=>{
  t.retPct=t.count>0?(t.returns/t.count*100):0;
  t.avgP=t.prices.length?(t.prices.reduce((s,p)=>s+p,0)/t.prices.length):0;
  const sVol=40*(t.amount/maxAmount);
  const sRet=30*Math.max(0,1-t.retPct/5); // 0% مرتجع = 30 نقطة · 5%+ = صفر
  let sPrice=7.5; // محايد لو مفيش مرجع
  if(overallAvgP>0&&t.avgP>0){const r=t.avgP/overallAvgP;sPrice=15*Math.min(1,Math.max(0,(r-0.95)/0.10));}
  const days=t.lastDate?Math.max(0,Math.floor((Date.now()-new Date(t.lastDate+'T12:00:00').getTime())/864e5)):999;
  const sRec=15*Math.max(0,1-Math.max(0,days-7)/53); // آخر 7 أيام = كامل · 60 يوم+ = صفر
  t.score=Math.round(Math.min(100,sVol+sRet+sPrice+sRec));
 });
 // ترتيب
 const sortKey=tradersState.sort;
 traders.sort((a,b)=>{
  if(sortKey==='score')return b.score-a.score||b.amount-a.amount;
  if(sortKey==='amount')return b.amount-a.amount;
  if(sortKey==='count')return b.count-a.count;
  if(sortKey==='returns')return b.retPct-a.retPct||b.returns-a.returns;
  if(sortKey==='recent')return (b.lastDate||'').localeCompare(a.lastDate||'');
  return b.score-a.score;
 });
 const cur=DB.settings.currency;
 const cats=['مجزر','قطاعي','ثقيل','خفيف'];
 const scoreBadge=s=>{
  const c=s>=80?['var(--green)','var(--ok-bg)','ممتاز']:s>=60?['var(--blue)','var(--info-bg)','جيد']:s>=40?['var(--amber)','var(--warn-bg)','متوسط']:['var(--red)','var(--bad-bg)','ضعيف'];
  return `<span class="badge" style="background:${c[1]};color:${c[0]};font-weight:800">${s} · ${c[2]}</span>`;
 };
 const retBadge=t=>{
  if(!t.count)return '0';
  const p=t.retPct;
  const col=p<=1?'var(--green)':p<=2.5?'var(--amber)':'var(--red)';
  return `<span style="color:${col};font-weight:700">${fmt(t.returns)}<span style="font-size:10px"> · ${p<0.05?'0':p.toFixed(1)}%</span></span>`;
 };
 let h=`<div class="card"><div class="card-title">🤝 تقرير التجار (${traders.length} تاجر)</div>
 <div class="toolbar" style="flex-wrap:wrap;gap:8px">
  <div class="seg">
   ${[['score','⭐ الأفضل لي'],['amount','الأعلى شراءً'],['count','الأكثر عدداً'],['returns','الأعلى مرتجعاً %'],['recent','الأحدث']].map(([k,l])=>`<button class="${tradersState.sort===k?'on':''}" onclick="tradersState.sort='${k}';renderReports()">${l}</button>`).join('')}
  </div>
  <select onchange="tradersState.cat=this.value;renderReports()">
   <option value="">كل التصنيفات</option>
   ${cats.map(c=>`<option value="${c}" ${tradersState.cat===c?'selected':''}>${c}</option>`).join('')}
  </select>
 </div></div>`;
 // بطاقات ملخص لأعلى ٣ تجار
 h+=`<div class="grid g3" style="margin-bottom:14px">`;
 traders.slice(0,3).forEach((t,i)=>{
  const medal=['🥇','🥈','🥉'][i];
  h+=`<div class="kpi"><div class="lbl">${medal} ${esc(t.name)} ${t.cat?`<span class="badge b-info" style="font-size:9px">${esc(t.cat)}</span>`:''} ${scoreBadge(t.score)}</div>
   <div class="val">${fmt(t.amount)} ${cur}</div>
   <div class="sub">${fmt(t.count)} طائر · ${t.deals.size} صفقة · مرتجع ${t.retPct<0.05?'0':t.retPct.toFixed(1)}%</div></div>`;
 });
 h+=`</div>`;
 // الجدول التفصيلي
 h+=`<div class="card"><div class="tbl-wrap"><table><thead><tr>
  <th>التاجر</th><th>⭐ تقييم</th><th>التصنيف</th><th>الموبايل</th><th class="num">صفقات</th>
  <th class="num">إجمالي العدد</th><th class="num">إجمالي الوزن</th><th class="num">متوسط السعر</th>
  <th class="num">إجمالي المبلغ</th><th class="num">المرتجع · %</th><th class="num">آخر تعامل</th></tr></thead><tbody>`;
 traders.forEach(t=>{
  h+=`<tr>
   <td><b>${esc(t.name)}</b>${t.addr?`<div class="hint" style="font-size:10px">📍 ${esc(t.addr)}</div>`:''}</td>
   <td>${scoreBadge(t.score)}</td>
   <td>${t.cat?`<span class="badge b-info">${esc(t.cat)}</span>`:'—'}</td>
   <td style="font-size:12px">${t.phone?`<a href="tel:${esc(t.phone)}" style="color:var(--primary)">${esc(t.phone)}</a>`:'—'}</td>
   <td class="num">${t.deals.size}</td>
   <td class="num">${fmt(t.count)}</td>

   <td class="num">${retBadge(t)}</td>
   <td class="num" style="font-size:11px">${esc(t.lastDate||'')}</td></tr>`;
 });
 const totPct=tot.count>0?(tot.returns/tot.count*100):0;
 h+=`<tr class="tbl-total"><td colspan="4">الإجمالي (${traders.length} تاجر)</td>
  <td class="num">—</td><td class="num">${fmt(tot.count)}</td><td class="num">${rawFmt(tot.weight)} كجم</td>
  <td class="num">—</td><td class="num">${fmt(tot.amount)} ${cur}</td><td class="num">${fmt(tot.returns)} · ${totPct<0.05?'0':totPct.toFixed(1)}%</td><td>—</td></tr>`;
 h+=`</tbody></table></div>
 <div class="hint" style="margin-top:8px">💡 اضغط رقم الموبايل للاتصال مباشرة. «صفقات» = عدد عمليات البيع المنفصلة (كل بيعة بعرباتها = صفقة واحدة).<br>
 ⭐ <b>التقييم (من 100)</b>: حجم الشراء 40 نقطة (نسبةً لأعلى تاجر) + نظافة المرتجع 30 (0% = كاملة، 5%+ = صفر) + متوسط سعره مقابل متوسط السوق 15 + حداثة التعامل 15 (آخر أسبوع = كاملة). نسبة المرتجع: <span style="color:var(--green)">أخضر ≤1%</span> · <span style="color:var(--amber)">أصفر ≤2.5%</span> · <span style="color:var(--red)">أحمر أكثر</span> — كده التاجر الكبير مش بيتظلم لو مرتجعه كبير بالعدد بس نسبته طبيعية.</div></div>`;

}

let sellNowState={cycleId:'',price:'',feedPrice:'',days:3};
function repSellNow(){
 const pool=isManager()?mgrCycles():DB.cycles.filter(c=>c.status!=='مغلقة');
 if(!pool.length)return `<div class="card">${emptyState('🧮','لا توجد دورات نشطة لتحليلها.')}</div>`;
 let cyc=cycleById(sellNowState.cycleId);
 if(!cyc||!pool.find(c=>c.id===cyc.id))cyc=pool[0];
 sellNowState.cycleId=cyc.id;
 const F=cycleFinal(cyc);
 const age=ageOnDate(cyc,todayISO());
 const remain=birdsRemaining(cyc.id);
 const lw=lastWeight(cyc.id)/1000||0; // كجم
 const cur=DB.settings.currency;
 // أسعار افتراضية
 const price=Number(sellNowState.price)|| (F.avgPrice||0) || 55;
 const feedPrice=Number(sellNowState.feedPrice)|| (cyc.costs?.feedKg||0) || 20;
 const days=Number(sellNowState.days)||3;
 // منحنى النمو من Ross
 const refNow=rossRow(age)||{w:lw*1000,g:90,fc:0};
 const refFut=rossRow(age+days)||refNow;
 const futW=lw>0?(lw*1000+(refFut.w-refNow.w))/1000:(refFut.w/1000); // كجم متوقع
 const gainKg=Math.max(0,futW-lw);
 // العلف المتوقع خلال الفترة (من فرق العلف التراكمي في Ross × عدد الطيور)

 const feedCost=feedPerBird*remain*feedPrice;
 // القيم
 const valNow=remain*lw*price;
 const valFut=remain*futW*price; // بافتراض ثبات السعر
 const extraRevenue=valFut-valNow;
 const netGain=extraRevenue-feedCost;
 const breakEvenPrice=gainKg*remain>0?(feedCost/(gainKg*remain)):0; // السعر الذي يغطي تكلفة العلف فقط
 let h=`<div class="card"><div class="card-title">🧮 حاسبة قرار البيع — أبيع الآن ولا أستنى؟</div>
 <div class="toolbar" style="flex-wrap:wrap;gap:8px">

 </div>
 <div class="grid g3" style="margin-top:10px">

  <div class="field"><label>سعر العلف (${cur}/كجم)</label><input type="text" inputmode="decimal" step="0.1" value="${sellNowState.feedPrice||feedPrice}" oninput="sellNowState.feedPrice=this.value;renderReports()"></div>
  <div class="field"><label>أستنى كام يوم؟</label><input type="text" inputmode="decimal" min="1" max="14" value="${days}" oninput="sellNowState.days=this.value;renderReports()"></div>
 </div></div>`;
 if(remain<=0)return h+`<div class="card">${emptyState('🧮','لا يوجد طيور متبقية في هذه الدورة.')}</div>`;
 h+=`<div class="grid g2" style="margin-bottom:14px">
  <div class="kpi"><div class="lbl">الوضع الحالي (عمر ${age} يوم)</div>
   <div class="val">${valNow?fmt(valNow):0} ${cur}</div>
   <div class="sub">${fmt(remain)} طائر × ${lw.toFixed(3)} كجم × ${price} ${cur}</div></div>
  <div class="kpi c"><div class="lbl">بعد ${days} أيام (عمر ${age+days} يوم)</div>
   <div class="val">${valFut?fmt(valFut):0} ${cur}</div>
   <div class="sub">الوزن المتوقع ${futW.toFixed(3)} كجم/طائر (Ross)</div></div>
 </div>`;
 const verdict = netGain>0
  ? {c:'#16a34a',t:'✅ الانتظار مربح',d:`تنتظر ${days} أيام تكسب <b>${fmt(netGain)} ${cur}</b> صافي إضافي (بعد خصم العلف)، بشرط ثبات السعر.`}
  : {c:'#dc2626',t:'🔴 البيع الآن أفضل',d:`الانتظار ${days} أيام سيكلّفك <b>${fmt(-netGain)} ${cur}</b> أكثر مما يعود (تكلفة العلف أكبر من قيمة الزيادة).`};
 h+=`<div class="card" style="border:2px solid ${verdict.c};background:${verdict.c}0d">
  <div style="font-size:18px;font-weight:800;color:${verdict.c};margin-bottom:6px">${verdict.t}</div>
  <div style="font-size:14px">${verdict.d}</div></div>`;
 h+=`<div class="card"><div class="card-title">📊 تفاصIل الحساب</div>
  <div class="tbl-wrap"><table><tbody>
   <tr><td>الزيادة المتوقعة في الوزن</td><td class="num"><b>${gainKg.toFixed(3)} كجم/طائر</b> (${fmt(gainKg*remain,0)} كجم إجمالي)</td></tr>
   <tr><td>الإيراد الإضافي (لو السعر ثبت)</td><td class="num" style="color:var(--green)"><b>+${fmt(extraRevenue)} ${cur}</b></td></tr>
