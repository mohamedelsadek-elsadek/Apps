/* ===== 📉 تحليل الفرق بين دورتين ===== */
let varState={a:'',b:''};
function repVariance(){
 const pool=isManager()?mgrCycles():DB.cycles;
 if(pool.length<2)return `<div class="card">${emptyState('📉','تحتاج دورتين على الأقل للمقارنة.')}</div>`;
 if(!varState.a||!pool.find(c=>c.id===varState.a))varState.a=pool[0].id;
 if(!varState.b||!pool.find(c=>c.id===varState.b))varState.b=pool[1].id;
 const opts=(sel)=>pool.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.code)} — ${esc(farmById(c.farm)?.name||'')}</option>`).join('');
 let h=`<div class="card"><div class="card-title">📉 تحليل الفرق — أين ذهبت الفلوس؟</div>
 <div class="grid g2">
  <div class="field"><label>الدورة (أ)</label><select onchange="varState.a=this.value;renderReports()">${opts(varState.a)}</select></div>
  <div class="field"><label>الدورة (ب)</label><select onchange="varState.b=this.value;renderReports()">${opts(varState.b)}</select></div>
 </div></div>`;
 if(varState.a===varState.b)return h+`<div class="card">${emptyState('📉','اختر دورتين مختلفتين.')}</div>`;
 const A=cycleFinal(cycleById(varState.a)), B=cycleFinal(cycleById(varState.b));
 const cur=DB.settings.currency;
 const profitDiff=A.profit-B.profit;
 const better=profitDiff>=0?'أ':'ب';
 const worse=profitDiff>=0?'ب':'أ';
 // تفكيك الفرق لعوامل (تقريبي مبني على نفس حجم القطيع)
 const meatBase=(A.totalMeat+B.totalMeat)/2||1;
 // فرق الإيراد بسبب السعر
 const priceEffect=(A.avgPrice-B.avgPrice)*meatBase;
 // فرق التكلفة بسبب FCR (علف)
 const feedPriceAvg=((A.costs?.feedKg||0)+(B.costs?.feedKg||0))/2||20;
 const fcrEffect=-((A.fcr-B.fcr)*meatBase*feedPriceAvg);
 // فرق النافق (قيمة الطيور النافقة الزائدة)
 const avgBirdVal=((A.avgWeightBird||0)*(A.avgPrice||0));
 const deadEffect=-((A.dead-B.dead)*avgBirdVal*0.5); // نصف القيمة تقريب (نافق مبكر أرخص)
 const factors=[
  {n:'فرق سعر البيع',v:priceEffect,d:`${A.avgPrice.toFixed(1)} مقابل ${B.avgPrice.toFixed(1)} ${cur}/كجم`},
  {n:'فرق كفاءة العلف (FCR)',v:fcrEffect,d:`${A.fcr.toFixed(3)} مقابل ${B.fcr.toFixed(3)}`},
  {n:'فرق النافق',v:deadEffect,d:`${A.deadPct.toFixed(1)}% مقابل ${B.deadPct.toFixed(1)}%`},
 ];
 const totalExplained=factors.reduce((s,f)=>s+f.v,0);
 const other=profitDiff-totalExplained;
 factors.push({n:'عوامل أخرى (حجم، تكاليف، مصاريف)',v:other,d:'الفرق المتبقي'});
 h+=`<div class="card" style="border:2px solid var(--primary);background:var(--primary-soft)">
  <div style="font-size:16px;font-weight:800;margin-bottom:4px">الدورة (${better}) ربحت أكثر بـ <span style="color:var(--primary-d)">${fmt(Math.abs(profitDiff))} ${cur}</span></div>
  <div class="hint">تفكيك سبب الفرق بين الدورتين:</div></div>`;
 h+=`<div class="card"><div class="tbl-wrap"><table><thead><tr><th>العامل</th><th class="num">التأثير</th><th class="num">النسبة</th><th>التفاصيل</th></tr></thead><tbody>`;
 factors.forEach(f=>{
  const favorsA=f.v>=0;
  const pct=profitDiff!==0?Math.abs(f.v/profitDiff*100):0;

/* ===== 🏅 بطاقات أداء الدورات ===== */
function cycleScore(F){
 // FCR 30 · نافق 25 · EPEF 25 · ربحية 20
 const fcrT=Number(DB.settings.fcrTarget)||1.6;
 let sFcr=F.fcr>0?Math.max(0,30-(F.fcr-fcrT)*60):0; sFcr=Math.min(30,sFcr);
 let sDead=Math.max(0,25-F.deadPct*2.5); sDead=Math.min(25,sDead);
 let sEpef=F.epef?Math.min(25,F.epef/400*25):0;
 let sProfit=F.profit>0?20:(F.profit===0?10:0);
 const total=Math.round(sFcr+sDead+sEpef+sProfit);
 return {total,sFcr:Math.round(sFcr),sDead:Math.round(sDead),sEpef:Math.round(sEpef),sProfit:Math.round(sProfit)};
}

  return;
 }
 $$('.cup').forEach(el=>{

 const dur=900,t0=performance.now();const neg=to<0;
 function step(t){const p=Math.min((t-t0)/dur,1);const e=1-Math.pow(1-p,3);

function drawOwnerBar(){
 const cv=$('#ownerBar');if(!cv)return;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
 ctx.clearRect(0,0,W,H);
 const data=DB.farms.map(f=>{const A=aggregateCycles(DB.cycles.filter(c=>c.farm===f.id));
 return {name:f.name,sales:A.salesAmount,profit:A.profit};}).filter(d=>d.sales||d.profit);
 if(!data.length){ctx.fillStyle='#9095af';ctx.font='13px Tahoma';ctx.textAlign='center';ctx.fillText('لا توجد بيانات',W/2,H/2);return;}
 const pad={l:8,r:8,t:14,b:50};const maxV=Math.max(...data.map(d=>Math.max(d.sales,Math.abs(d.profit))),1)*1.1;
 const gw=(W-pad.l-pad.r)/data.length;
 const Y=v=>H-pad.b-(v/maxV)*(H-pad.t-pad.b);
 ctx.strokeStyle='#e7e9f2';ctx.beginPath();ctx.moveTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();
 let prog=(typeof PERF_LITE!=='undefined'&&PERF_LITE)?0.94:0; // ⚡ أندرويد: فريم واحد نهائي
 function frame(){prog=Math.min(prog+0.06,1);ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='#e7e9f2';ctx.beginPath();ctx.moveTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();
 data.forEach((d,i)=>{const cx=pad.l+gw*i+gw/2;const bw=Math.min(gw*0.28,34);
 const hs=(H-pad.t-(H-pad.b))*0;
 const sH=(d.sales/maxV)*(H-pad.t-pad.b)*prog;const pH=(Math.abs(d.profit)/maxV)*(H-pad.t-pad.b)*prog;
 ctx.fillStyle='#22c55e';ctx.fillRect(cx-bw-2,H-pad.b-sH,bw,sH);
 ctx.fillStyle=d.profit>=0?'#7c5cff':'#fb5a6f';ctx.fillRect(cx+2,H-pad.b-pH,bw,pH);
 ctx.fillStyle='#b9b0e0';ctx.font='11px Tahoma';ctx.textAlign='center';
 const nm=d.name.length>10?d.name.slice(0,10)+'…':d.name;ctx.fillText(nm,cx,H-pad.b+16);});
 if(prog<1)requestAnimationFrame(frame);}
 frame();
}

 });

function daysBetween(from,to){
 if(!from)return 0;
 const a=new Date(from), b=new Date(to||todayISO());
 return Math.max(0,Math.round((b-a)/86400000)+1);
}
function absenceDaysInRange(workerId,from,to){
 const recs=DB.wAbsence.filter(a=>a.workerId===workerId);
 let absence=0,leave=0,mission=0;
 const rangeFrom=new Date(from), rangeTo=new Date(to||todayISO());
 recs.forEach(a=>{
  const af=new Date(a.from), at=new Date(a.to||a.from);
  const s=af>rangeFrom?af:rangeFrom, e=at<rangeTo?at:rangeTo;
  if(s<=e){const d=Math.round((e-s)/86400000)+1;
   if(a.type==='leave')leave+=d;else if(a.type==='mission')mission+=d;else absence+=d;}
 });
 return {absence,leave,mission,total:absence+leave+mission};
}

const ISSUE_TYPES=['تغذية','تهوية','مياه','صحة','إدارة','معدات','أمان حيوي','أخرى'];
function groupedIssues(farmId){
 const src=farmId?DB.issues.filter(i=>i.farmId===farmId):DB.issues;
 const map={};
 src.forEach(i=>{
 const key=i.farmId+'||'+i.title.trim().toLowerCase();
 if(!map[key])map[key]={farmId:i.farmId,title:i.title,type:i.type,count:0,lastDate:'',solution:'',status:'resolved',ids:[]};
 const g=map[key]; g.count++; g.ids.push(i.id);
 if(!g.lastDate||i.date>g.lastDate){g.lastDate=i.date; g.type=i.type;}
 if(i.solution)g.solution=i.solution;
 if(i.status==='open')g.status='open';
 });
 return Object.values(map).sort((a,b)=>b.count-a.count);
}
function daysAgoFmt(d){if(!d)return'';const n=Math.floor((Date.now()-new Date(d))/86400000);return n+'يوم';}

function runDataAudit(){
 const box=document.getElementById('auditResult');if(!box)return;
 const issues=[];
 const cycById={};DB.cycles.forEach(c=>cycById[c.id]=c);
 const farmById2={};DB.farms.forEach(f=>farmById2[f.id]=f);
 const houseSet={}; // cycleId -> set of valid houseIds (من مزرعة الدورة)
 DB.cycles.forEach(c=>{
  const f=farmById2[c.farm];
  houseSet[c.id]=new Set((f?.houses||[]).map(h=>h.id));
 });
 // فحص المبيعات
 DB.sales.forEach(s=>{
  const c=cycById[s.cycleId];
  if(!c){issues.push({t:'بيع',sev:'high',msg:`بيع بتاريخ ${s.date||'—'} (${fmt(s.count)} طائر) مربوط بدورة محذوفة/غير موجودة`,id:s.id,arr:'sales'});return;}
  const f=farmById2[c.farm];
  // farmId مختلف عن مزرعة الدورة
  if(s.farmId&&s.farmId!==c.farm){
   issues.push({t:'بيع',sev:'high',msg:`بيع (${fmt(s.count)} طائر) في دورة «${c.code}» بس farmId بتاعه = «${farmById2[s.farmId]?.name||s.farmId}» مش «${f?.name||'?'}»`,id:s.id,arr:'sales'});
  }
  // houseId مش من عنابر المزرعة
  if(s.houseId&&!houseSet[s.cycleId].has(s.houseId)){
   issues.push({t:'بيع',sev:'mid',msg:`بيع (${fmt(s.count)} طائر) في «${c.code}» بعنبر «${s.houseId}» مش موجود في مزرعة «${f?.name||'?'}»`,id:s.id,arr:'sales'});
  }
 });
 // فحص السجل اليومي
 DB.daily.forEach(d=>{
  const c=cycById[d.cycleId];
  if(!c){issues.push({t:'يومي',sev:'high',msg:`سجل يومي بتاريخ ${d.date||'—'} مربوط بدورة غير موجودة`,id:d.id,arr:'daily'});return;}
  if(d.farmId&&d.farmId!==c.farm){issues.push({t:'يومي',sev:'high',msg:`سجل يومي في «${c.code}» بس farmId مختلف`,id:d.id,arr:'daily'});}
  if(d.houseId&&d.houseId!=='_farm_'&&!houseSet[d.cycleId].has(d.houseId)){issues.push({t:'يومي',sev:'mid',msg:`سجل يومي ${d.date} في «${c.code}» بعنبر «${d.houseId}» مش من المزرعة`,id:d.id,arr:'daily'});}
 });
 // فحص حركات العلف
 DB.feedMoves.forEach(m=>{
  const c=cycById[m.cycleId];
  if(!c){issues.push({t:'علف',sev:'high',msg:`حركة علف (${fmt(m.qty)} كجم) مربوطة بدورة غير موجودة`,id:m.id,arr:'feedMoves'});}
 });
 // النتيجة
 if(!issues.length){
  box.innerHTML=`<div style="padding:14px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:700">✅ سليم تماماً — لا يوجد أي تداخل في البيانات.</div>`;
  return;

function roleSave(id){

 const perms=[...document.querySelectorAll('.roleperm:checked')].map(c=>c.value);
 const shifts=[...document.querySelectorAll('.roleshift:checked')].map(c=>c.value);
 const color=$('#roleColor').value||'#0ea5e9';
 if(!DB.settings.customRoles)DB.settings.customRoles=[];
 if(id){const r=customRoles().find(x=>x.id===id);Object.assign(r,{name,color,perms,shifts});}
 else{DB.settings.customRoles.push({id:'role_'+uid(''),name,color,perms,shifts});}
 save();closeModal();toast('تم حفظ الوظيفة ✓');renderSettings();
}

/* تصدير جدول HTML إلى CSV (يفتح في Excel — مع BOM لدعم العربي) */
function tableToCSV(tableEl){
 if(!tableEl)return '';
 const rows=[];
 tableEl.querySelectorAll('tr').forEach(tr=>{
  const cells=[];
  tr.querySelectorAll('th,td').forEach(td=>{
   // تجاهل أعمدة الأزرار
   if(td.querySelector&&td.querySelector('button'))return;
   let t=(td.textContent||'').replace(/\s+/g,' ').trim();
   if(/[",\n]/.test(t))t='"'+t.replace(/"/g,'""')+'"';
   cells.push(t);
  });
  if(cells.length)rows.push(cells.join(','));
 });
 return rows.join('\r\n');
}
function downloadCSV(csv,name){
 const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=(name||'export')+'_'+todayISO()+'.csv';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

}

/* 🔢 v102: تطبيع الأرقام العربية/الفارسية لإنجليزية تلقائياً في أي خانة إدخال —
   بدون إجبار المستخدم على تغيير لغة الكتابة، ومن غير ما تفضل أرقام عربي معروضة في الحقل */
(function(){
 const AR='٠١٢٣٤٥٦٧٨٩', FA='۰۱۲۳۴۵۶۷۸۹';
 function normDigits(s){
  return String(s).replace(/[٠-٩۰-۹]/g,d=>{
   let i=AR.indexOf(d);if(i>-1)return i;
   i=FA.indexOf(d);if(i>-1)return i;
   return d;
  });
 }
 function isField(t){return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');}
 // beforeinput: نعترض الحرف قبل ما فحص صلاحية خانة النوع number يمسحه
 document.addEventListener('beforeinput',function(e){
  const t=e.target;if(!isField(t))return;
  const data=e.data;if(!data)return;
  const nd=normDigits(data);
  if(nd===data)return;
  e.preventDefault();
  try{
   const start=t.selectionStart!=null?t.selectionStart:t.value.length;
   const end=t.selectionEnd!=null?t.selectionEnd:t.value.length;
   if(typeof t.setRangeText==='function'){
    t.setRangeText(nd,start,end,'end');
   }else{
    t.value=t.value.slice(0,start)+nd+t.value.slice(end);
   }
  }catch(err){
   try{t.value=normDigits(t.value);}catch(e2){}
  }
  t.dispatchEvent(new Event('input',{bubbles:true}));
 },true);
 // فولباك لصق/إكمال تلقائي: أي قيمة لسه فيها أرقام عربي بعد التغيير بتتظبط
 document.addEventListener('input',function(e){
  const t=e.target;if(!isField(t))return;
  const v=t.value;if(v==null)return;
  const nv=normDigits(v);
  if(nv!==v){
   const pos=t.selectionStart;
   try{t.value=nv;if(pos!=null)t.setSelectionRange(pos,pos);}catch(err){}
  }
 },true);
})();

<script>
/* تسجيل Service Worker من ملف حقيقي (sw.js بجانب index.html) — التسجيل من Blob ممنوع في المتصفحات */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.update();
    setInterval(()=>reg.update(), 5*60*1000);
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw)return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          // نسخة جديدة جاهزة — أعِد التحميل مرة واحدة عند أول فرصة هادئة
          if(!sessionStorage.getItem('sw_reloaded')){
            sessionStorage.setItem('sw_reloaded','1');
            setTimeout(()=>{try{location.reload();}catch(_){}} ,800);
          }
        }
      });
    });
  }).catch(()=>{/* sw.js غير مرفوع — النظام يعمل عادي بدونه */});
}
</script>
