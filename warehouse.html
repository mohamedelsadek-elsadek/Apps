<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3f4f7;--surface:#fff;--surface2:#f8f9fb;--line:#e1e4eb;--ink:#1b2333;--sub:#5f6779;--mut:#9399a7;
  --pri:#1f5fa8;--pri-soft:#e5eefa;--on-pri:#fff;
  --ok:#17834a;--ok-soft:#e1f3e8;--warn:#b26b04;--warn-soft:#fcefd8;--bad:#c93636;--bad-soft:#fbe5e5;
  --c1:#2563eb;--c1s:#e3ecfd;--c2:#7c3aed;--c2s:#efe6fd;--c3:#0d9488;--c3s:#dcf4f1;--c4:#b45309;--c4s:#fbeedb;
  --hero:linear-gradient(135deg,#142a46 0%,#1e3a5f 55%,#28507f 100%);
  --sh:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06);--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1219;--surface:#171c26;--surface2:#1d2330;--line:#2a3140;--ink:#e5e9f0;--sub:#a1a9b8;--mut:#737b8b;
  --pri:#6ea8f0;--pri-soft:#1a2b44;--on-pri:#0a1628;
  --ok:#4cc982;--ok-soft:#163222;--warn:#f0b04a;--warn-soft:#3a2c14;--bad:#f07070;--bad-soft:#3b1c1c;
  --c1:#7aa7f7;--c1s:#1c2a45;--c2:#b394f5;--c2s:#2a2142;--c3:#4fd1c0;--c3s:#143331;--c4:#f0b04a;--c4s:#3a2c14;
  --hero:linear-gradient(135deg,#0b1626 0%,#122640 55%,#18345a 100%);--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#0e1219;--surface:#171c26;--surface2:#1d2330;--line:#2a3140;--ink:#e5e9f0;--sub:#a1a9b8;--mut:#737b8b;
  --pri:#6ea8f0;--pri-soft:#1a2b44;--on-pri:#0a1628;
  --ok:#4cc982;--ok-soft:#163222;--warn:#f0b04a;--warn-soft:#3a2c14;--bad:#f07070;--bad-soft:#3b1c1c;
  --c1:#7aa7f7;--c1s:#1c2a45;--c2:#b394f5;--c2s:#2a2142;--c3:#4fd1c0;--c3s:#143331;--c4:#f0b04a;--c4s:#3a2c14;
  --hero:linear-gradient(135deg,#0b1626 0%,#122640 55%,#18345a 100%);--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
body{font-family:'Cairo',-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.hero{background:var(--hero);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:40;box-shadow:0 6px 20px rgba(10,25,50,.25)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1000px;margin:0 auto}
.hero h1{font-size:18px;font-weight:800}
.hero .meta{font-size:11.5px;opacity:.9}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa;margin-left:4px}
.dot.on{background:#6ee7a8}.dot.wait{background:#fcd34d}.dot.err{background:#fca5a5}
.hbtn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:17px;cursor:pointer}
.wrap{padding:14px 16px 24px;max-width:1000px;margin:0 auto}
h2.sec{font-size:19px;font-weight:800;margin:4px 2px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h3 .sp{flex:1}
.card.editing{border:2px solid var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:11px;min-width:0}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--pri);background:var(--surface)}
input[type=date]{min-height:46px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;border:none;font-weight:800;font-size:14.5px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--on-pri)}.btn.ghost{background:var(--pri-soft);color:var(--pri)}.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1}
.ib{background:var(--surface2);border:1px solid var(--line);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--sub)}
.ib.bad{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surface2);color:var(--sub);padding:10px 9px;font-size:12px;font-weight:800;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tr.tot td{font-weight:800;background:var(--pri-soft)}
.n{text-align:left!important;direction:ltr}
.b{font-weight:800}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-pri{color:var(--pri)}.c-sub{color:var(--sub)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:800}
.k0{background:var(--c1s);color:var(--c1)}.k1{background:var(--c2s);color:var(--c2)}.k2{background:var(--c3s);color:var(--c3)}.k3{background:var(--c4s);color:var(--c4)}.kx{background:var(--surface2);color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .l{font-size:12px;color:var(--sub);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;color:var(--sub);margin-right:3px}
.kpi.hl{background:var(--hero);color:#fff;border:none}.kpi.hl .l,.kpi.hl small{color:rgba(255,255,255,.85)!important}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:var(--on-pri);border-color:transparent}
.alert{border-radius:12px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;font-weight:700}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.info{background:var(--pri-soft);color:var(--pri)}
.prev{background:var(--surface2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.empty{text-align:center;padding:26px 12px;color:var(--mut);font-weight:600}
.hint{font-size:12px;color:var(--sub);line-height:1.7}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;margin-bottom:6px}
.li .nm{flex:1;font-weight:700;min-width:0}
.search{margin-bottom:10px}
.xl td{padding:3px}.xl .ic{padding:8px 7px;border-radius:7px;font-size:15px;border-width:1px;background:var(--surface)}.xl .ic:focus{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-soft)}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;min-width:0;background:none;border:none;color:var(--mut);font-size:10.5px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px}
.bnav button b{font-size:19px;font-weight:400}
.bnav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,15,25,.5);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.mbox{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.mbox{border-radius:20px}}
.mbox h3{font-size:17px;font-weight:800;margin-bottom:12px}
.mbox .msg{color:var(--sub);margin-bottom:16px;line-height:1.8}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:700;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}.toast.bad{background:var(--bad);color:#fff}
.print-head{display:none}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface2:#f2f3f5;--line:#bbb;--ink:#000;--sub:#333}
  body{padding:0;background:#fff}.hero,.bnav,.no-print,.toast,.modal{display:none!important}
  .card{box-shadow:none;break-inside:avoid}.print-head{display:block;text-align:center;margin-bottom:12px}
  .tbl-wrap{overflow:visible}th,td,.pill,tr.tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
"use strict";
var APP_VER='v3';
var FB_CFG={apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",authDomain:"my-app-sync-11ad9.firebaseapp.com",databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-app-sync-11ad9",storageBucket:"my-app-sync-11ad9.firebasestorage.app",messagingSenderId:"177039534756",appId:"1:177039534756:web:367ecccc684c2cdfdd1431"};
var FB_PATH='warehouse/docs';
var LS_KEY='warehouse.state.v1',LS_ON='warehouse.sync.on',LS_BK='warehouse.bk.',LS_THEME='warehouse.theme';
var CATS=[['k0','💊','أدوية بيطرية'],['k1','💉','تحصينات'],['k2','🧴','مطهرات'],['k3','📦','خامات']];
var UNITS_SEED=['عبوة','زجاجة','لتر','كجم','جرام','جرعة','فيال','كيس','شكارة','طن','كرتونة','قطعة'];

/* ===== أدوات ===== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(ds,n){var p=ds.split('-');var d=new Date(+p[0],p[1]-1,+p[2]);d.setDate(d.getDate()+n);return ymd(d)}
function arDate(ds){if(!ds)return '';var p=ds.split('-');try{return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ds}}
function sd(ds){var p=(ds||'').split('-');return p.length===3?(+p[2])+'/'+(+p[1]):''}
function toEn(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776})}
function num(v){v=toEn(v).replace(/[,،\s]/g,'').replace('٫','.');var n=parseFloat(v);return isFinite(n)?n:0}
function r3(n){return Math.round((+n||0)*1000)/1000}
function fmt(n){n=+n||0;if(Math.abs(n)<0.0005)n=0;return n.toLocaleString('en-US',{maximumFractionDigits:2})}
function money(n){return fmt(Math.round((+n||0)*100)/100)}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function lsKeys(){var o=[];try{for(var i=0;i<localStorage.length;i++)o.push(localStorage.key(i))}catch(e){}return o}
function inRange(d,f,t){return !(f&&d<f)&&!(t&&d>t)}
var srvOff=0;function now(){return Date.now()+srvOff}
var tT;function toast(m,bad){var t=$('toast');t.textContent=m;t.className='toast show'+(bad?' bad':'');clearTimeout(tT);tT=setTimeout(function(){t.className='toast'},2500)}
function openModal(h){$('mbox').innerHTML=h;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
var askFn=null;
function ask(title,msg,fn,danger,yes){askFn=fn;openModal('<h3>'+title+'</h3>'+(msg?'<div class="msg">'+msg+'</div>':'')+'<div class="btnrow"><button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn '+(danger?'bad':'pri')+'" onclick="var f=askFn;askFn=null;closeModal();f&&f()">'+(yes||'تأكيد')+'</button></div>')}
function catOf(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i];return ['kx','•','—']}
function catPill(k){var c=catOf(k);return '<span class="pill '+c[0]+'">'+c[1]+' '+c[2]+'</span>'}

/* ===== البيانات: كل سجل وثيقة مستقلة بختم وقت + حذف ناعم ===== */
var S={docs:{}};
function seed(){var d=[];UNITS_SEED.forEach(function(n,i){d.push({id:'un'+(i+1),t:'unit',name:n,ord:i+1,u:1,c:1})});return d}
function load(){S.docs={};try{var o=JSON.parse(lsGet(LS_KEY)||'null');if(o&&o.docs)S.docs=o.docs}catch(e){}seed().forEach(function(d){if(!S.docs[d.id])S.docs[d.id]=d})}
function persist(){if(!lsSet(LS_KEY,JSON.stringify({docs:S.docs,ver:APP_VER})))toast('مساحة المتصفح ممتلئة — نزّل نسخة احتياطية',1)}
function clean(o){return JSON.parse(JSON.stringify(o))}
function put(d){var t=now();d.u=t;if(!d.c)d.c=t;S.docs[d.id]=clean(d);persist();pushDocs([d.id])}
function removeDoc(id){var d=Object.assign({},S.docs[id]);d.del=1;put(d)}
function all(t){var o=[];for(var k in S.docs){var d=S.docs[k];if(d&&d.t===t&&!d.del)o.push(d)}return o}
function items(cat){return all('item').filter(function(x){return !cat||x.cat===cat}).sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ar')})}
function units(){return all('unit').sort(function(a,b){return (a.ord||0)-(b.ord||0)})}
function nm(id){var d=S.docs[id];return d?d.name+(d.del?' (محذوف)':''):'—'}
function moves(t){return all(t).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.c||0)-(a.c||0)})}
function validDoc(d,k){return d&&typeof d==='object'&&d.id===k&&typeof d.t==='string'&&typeof d.u==='number'}

function mvCmp(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;if(a.t!==b.t)return a.t==='in'?-1:1;return (a.c||0)-(b.c||0)}
/* ===== الحسابات: متوسط مرجّح للتكلفة بالترتيب الزمني ===== */
function ledger(upTo){
  var L={};
  all('item').forEach(function(i){L[i.id]={inQ:0,inV:0,outQ:0,outV:0,cogs:0,qty:0,avg:0}});
  var mv=[].concat(all('in'),all('out')).filter(function(m){return L[m.item]&&(!upTo||m.date<=upTo)}).sort(mvCmp);
  mv.forEach(function(m){var r=L[m.item],q=+m.qty||0,p=+m.price||0;
    if(m.t==='in'){var v=r.qty*r.avg+q*p;r.qty+=q;r.avg=r.qty>0?v/r.qty:p;r.inQ+=q;r.inV+=q*p}
    else{r.cogs+=q*r.avg;r.qty-=q;r.outQ+=q;r.outV+=q*p}
    m._cost=m.t==='out'?r.avg:p});
  for(var k in L)L[k].val=Math.max(0,L[k].qty)*L[k].avg;
  return L;
}
function costMap(){var m={};var mv=[].concat(all('in'),all('out')).sort(mvCmp);var q={},a={};
  mv.forEach(function(x){var k=x.item;q[k]=q[k]||0;a[k]=a[k]||0;var qq=+x.qty||0,p=+x.price||0;if(x.t==='in'){var v=q[k]*a[k]+qq*p;q[k]+=qq;a[k]=q[k]>0?v/q[k]:p}else{m[x.id]=a[k];q[k]-=qq}});return m}

/* ===== التنقل ===== */
var PAGES=[['bal','📊','الرصيد'],['in','📥','وارد'],['out','📤','منصرف'],['inv','🧾','فاتورة'],['items','🗂️','الأصناف'],['rep','📈','التقارير'],['data','💾','البيانات']];
var page='bal',EDIT=null,CAT='',Q='';
function go(k){if(EDIT&&S.docs[EDIT]&&S.docs[EDIT].t!==k)EDIT=null;page=k;render();window.scrollTo(0,0)}
function render(){
  var p=PAGES.filter(function(x){return x[0]===page})[0];
  $('app').innerHTML='<header class="hero"><div class="hero-top"><div><h1>🏬 مخزن سطيح</h1><div class="meta"><span class="dot" id="syncDot"></span><span id="syncTxt"></span> · '+APP_VER+'</div></div><div style="display:flex;gap:6px"><button class="hbtn" onclick="toggleTheme()" aria-label="الوضع الليلي">🌓</button><button class="hbtn" onclick="window.print()" aria-label="طباعة">🖨️</button></div></div></header>'+
  '<main class="wrap" id="wrap"><div class="print-head"><h2>🏬 مخزن سطيح — '+p[2]+'</h2><p>'+arDate(today())+'</p></div>'+VIEWS[page]()+'</main>'+
  '<nav class="bnav">'+PAGES.map(function(x){return '<button class="'+(x[0]===page?'on':'')+'" onclick="go(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>'}).join('')+'</nav>';
  syncUI(syncState.s,syncState.t);
  if(POST[page])POST[page]();
}
var pendingR=false;
function typing(){var a=document.activeElement;return a&&$('wrap')&&$('wrap').contains(a)&&/^(INPUT|SELECT)$/.test(a.tagName)}
function softRender(){if(typing()){pendingR=true;return}pendingR=false;render()}
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingR&&!typing())softRender()},250)});
var VIEWS={},POST={};
function catChips(on){return '<div class="chips no-print"><div class="chip'+(!CAT?' on':'')+'" onclick="CAT=\'\';'+on+'">الكل</div>'+CATS.map(function(c){return '<div class="chip'+(CAT===c[0]?' on':'')+'" onclick="CAT=\''+c[0]+'\';'+on+'">'+c[1]+' '+c[2]+'</div>'}).join('')+'</div>'}

/* ===== الرصيد ===== */
VIEWS.bal=function(){
  var L=ledger(),its=items(CAT).filter(function(i){return !Q||i.name.indexOf(Q)>-1});
  var tv=0,neg=[],low=[];
  items().forEach(function(i){var r=L[i.id];tv+=r.val;if(r.qty<-0.0001)neg.push(i);else if(i.min>0&&r.qty<i.min)low.push(i)});

  var col=ICOLS[+el.getAttribute('data-c')][0],L=sugList(col);sugHide();if(!L)return;
  var q=el.value.trim();if(!q)return;
  var st=L.filter(function(x){return x.indexOf(q)===0}),ct=L.filter(function(x){return x.indexOf(q)>0});
  var m=st.concat(ct).slice(0,8);if(!m.length||(m.length===1&&m[0]===q))return;
  var b=document.createElement('div');b.id='sug';var rc=el.getBoundingClientRect();
  b.style.cssText='position:fixed;z-index:300;background:var(--surface);border:1.5px solid var(--pri);border-radius:10px;box-shadow:var(--sh);min-width:'+Math.max(rc.width,160)+'px;top:'+(rc.bottom+2)+'px;right:'+(window.innerWidth-rc.right)+'px;overflow:hidden';
  b.innerHTML=m.map(function(x,i){return '<div data-i="'+i+'" style="padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px">'+esc(x)+'</div>'}).join('');
  document.body.appendChild(b);SUG={el:el,m:m,i:0,box:b};sugMark();
  b.addEventListener('mousedown',function(e){var d=e.target.closest('[data-i]');if(!d)return;e.preventDefault();SUG.i=+d.getAttribute('data-i');sugPick();var r=+el.getAttribute('data-r'),c=+el.getAttribute('data-c');invNext(r,c,1)});
}
function sugMark(){if(!SUG)return;Array.prototype.forEach.call(SUG.box.children,function(d,i){d.style.background=i===SUG.i?'var(--pri-soft)':'';d.style.color=i===SUG.i?'var(--pri)':''})}
function sugHide(){var b=$('sug');if(b)b.remove();SUG=null}
function sugPick(){if(!SUG)return;var el=SUG.el;el.value=SUG.m[SUG.i];sugHide();invCellChanged(el)}
function invCellChanged(el){
  var r=+el.getAttribute('data-r'),c=+el.getAttribute('data-c'),k=ICOLS[c][0],row=INV.rows[r];if(!row)return;
  row[k]=el.value;
  if(k==='item'&&el.value.trim()){var pv=INV.rows[r-1];['date','party'].forEach(function(f,ix){if(!row[f]){row[f]=pv&&pv[f]?pv[f]:(f==='date'?dShow(INV.date||today()):INV.party);var fe=document.querySelector('.ic[data-r="'+r+'"][data-c="'+(f==='date'?0:5)+'"]');if(fe)fe.value=row[f]}})}
  if(k==='item'){var it=itemByName(el.value),ue=document.querySelector('.ic[data-r="'+r+'"][data-c="3"]'),pe=document.querySelector('.ic[data-r="'+r+'"][data-c="4"]');
    if(it){row.unit=nm(it.unit);if(ue){ue.value=row.unit;ue.readOnly=true;ue.tabIndex=-1;ue.style.opacity='.75'}
      if(!row.price){var p=0;if(INV.t==='out')p=it.sell||0;else{var last=moves('in').filter(function(m){return m.item===it.id})[0];if(last)p=last.price}if(p){row.price=String(p);if(pe)pe.value=p}}}
    else if(ue&&ue.readOnly){ue.readOnly=false;ue.removeAttribute('tabindex');ue.style.opacity='';ue.value=row.unit='';}}
  var te=$('it'+r);if(te){var v=num(row.qty)*num(row.price);te.textContent=v?money(v):''}
  var tt=$('invTot');if(tt)tt.textContent=money(invTotal());
  var tr=$('ir'+r);if(tr)tr.style.background='';
}
document.addEventListener('input',function(e){var el=e.target;if(!el.classList||!el.classList.contains('ic'))return;var c=toEn(el.value);if(ICOLS[+el.getAttribute('data-c')][0]!=='item'&&c!==el.value)el.value=c;invCellChanged(el);sugShow(el)});
document.addEventListener('focusout',function(e){if(e.target.classList&&e.target.classList.contains('ic'))setTimeout(function(){if(!SUG||document.activeElement!==SUG.el)sugHide()},120)});
document.addEventListener('keydown',function(e){
  var el=e.target;
  if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')&&page==='inv'){e.preventDefault();saveInv();return}
  if(!el.classList||!el.classList.contains('ic'))return;
  var r=+el.getAttribute('data-r'),c=+el.getAttribute('data-c');
  if(SUG&&SUG.el===el){
    if(e.key==='ArrowDown'){e.preventDefault();SUG.i=Math.min(SUG.m.length-1,SUG.i+1);sugMark();return}
    if(e.key==='ArrowUp'){e.preventDefault();SUG.i=Math.max(0,SUG.i-1);sugMark();return}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();sugPick();invNext(r,c,1);return}
    if(e.key==='Escape'){sugHide();return}
  }
  if(e.key==='Enter'){e.preventDefault();if(ICOLS[c][0]==='date'&&el.value&&parseD(el.value))el.value=dShow(parseD(el.value)),invCellChanged(el);invNext(r,c,e.shiftKey?-1:1);return}
  if(e.key==='ArrowDown'){e.preventDefault();invMoveV(r,c,1);return}
  if(e.key==='ArrowUp'){e.preventDefault();invMoveV(r,c,-1);return}
  var len=el.value.length,ss=el.selectionStart,se=el.selectionEnd,all=ss===0&&se===len;
  if(e.key==='ArrowLeft'&&(all||ss===len)){e.preventDefault();invNext(r,c,1);return}
  if(e.key==='ArrowRight'&&(all||ss===0)){e.preventDefault();invNext(r,c,-1);return}
});
function saveInv(){
  sugHide();
  var t=INV.t,errs=[],ok=[];
  INV.rows.forEach(function(r,i){
    if(!String(r.item).trim()&&!String(r.qty).trim()&&!String(r.price).trim())return;
    var d=parseD(r.date),n=String(r.item).trim(),q=r3(num(r.qty)),it=itemByName(n),un=it?it.unit:String(r.unit||'').trim();
    var bad=!d?'التاريخ':!n?'الصنف':q<=0?'الكمية':!un?'الوحدة (صنف جديد)':'';
    if(bad)errs.push([i,bad]);else ok.push({i:i,date:d,name:n,qty:q,price:num(r.price),party:String(r.party||'').trim(),it:it,unit:un});
  });
  document.querySelectorAll('#invBody tr').forEach(function(tr){tr.style.background=''});
  if(errs.length){errs.forEach(function(x){var tr=$('ir'+x[0]);if(tr)tr.style.background='var(--bad-soft)'});toast('سطر '+(errs[0][0]+1)+': ناقص '+errs[0][1],1);invFocus(errs[0][0],1);return}
  if(!ok.length){toast('الفاتورة فاضية',1);return}
  var doIt=function(){
    var newItems=0;
    ok.forEach(function(x){
      var it=x.it||itemByName(x.name);
      if(!it){var uid0=addUnit(x.unit);it={id:uid(),t:'item',name:x.name,cat:INV.cat,unit:uid0,sell:t==='out'?x.price:0,min:0};put(it);newItems++}
      put({id:uid(),t:t,item:it.id,date:x.date,qty:x.qty,price:x.price,party:x.party,note:INV.ref?'فاتورة '+INV.ref:''});
      if(t==='out'&&x.price&&!it.sell){var y=Object.assign({},S.docs[it.id]);y.sell=x.price;put(y)}
    });
    var tot=ok.reduce(function(s,x){return s+x.qty*x.price},0);
    INV.rows=[];INV.ref='';render();
    toast('اتحفظت الفاتورة: '+ok.length+' سطر · '+money(tot)+' ج'+(newItems?' · '+newItems+' صنف جديد':''));
  };
  var noPrice=ok.filter(function(x){return !x.price}).length;
  var warn=[];
  if(t==='out'){var L=ledger(),need={};ok.forEach(function(x){if(x.it)need[x.it.id]=(need[x.it.id]||0)+x.qty});
    for(var k in need){var b=L[k]?L[k].qty:0;if(need[k]-b>0.0001)warn.push(esc(nm(k))+' (الرصيد '+fmt(b)+')')}
    ok.forEach(function(x){if(!x.it)warn.push(esc(x.name)+' (صنف مش موجود — رصيده صفر)')})}
  if(warn.length||noPrice)ask('تأكيد الحفظ',(warn.length?'الكمية أكبر من الرصيد في: <b>'+warn.join('، ')+'</b><br>':'')+(noPrice?noPrice+' سطر من غير سعر.<br>':'')+'تحفظ برضه؟',doIt,false,'احفظ');
  else doIt();
}

function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function initSync(){
  if(lsGet(LS_ON)==='OFF'){syncUI('','محلي فقط');return}
  syncUI('wait','بيتصل...');var V='https://www.gstatic.com/firebasejs/10.12.2/';
  (window.firebase&&window.firebase.database?Promise.resolve():loadScript(V+'firebase-app-compat.js').then(function(){return loadScript(V+'firebase-database-compat.js')})).then(function(){
    var app;try{app=firebase.app('warehouse')}catch(e){app=firebase.initializeApp(FB_CFG,'warehouse')}
    if(!fbDb){fbDb=firebase.database(app);fbDb.ref('.info/serverTimeOffset').on('value',function(s){srvOff=+s.val()||0});
      fbDb.ref('.info/connected').on('value',function(s){if(lsGet(LS_ON)==='OFF')return;if(s.val())syncUI('on','متزامن');else syncUI('wait','أوفلاين')})}
    fbDb.goOnline();fbRoot=fbDb.ref(FB_PATH);
    if(!fbL){fbL=true;fbRoot.on('value',function(s){mergeCloud(s.val()||{})},function(e){syncUI('err','خطأ صلاحيات');console.warn(e)})}
  }).catch(function(){syncUI('err','مش متصل')});
}
function mergeCloud(c){var ch=false,up={};
  for(var k in c){var d=c[k];if(!validDoc(d,k))continue;var l=S.docs[k];if(!l||d.u>l.u){S.docs[k]=d;ch=true}}
  for(var k2 in S.docs){var l2=S.docs[k2],cd=c[k2];if(!cd||l2.u>(cd.u||0))up[k2]=l2}
  if(Object.keys(up).length&&fbRoot)fbRoot.update(clean(up)).catch(console.warn);
  if(ch){persist();softRender()}}
function pushDocs(ids){if(!fbRoot)return;var u={};ids.forEach(function(id){if(S.docs[id])u[id]=S.docs[id]});fbRoot.update(clean(u)).catch(function(){syncUI('err','فشل الرفع')})}
function toggleSync(){if(lsGet(LS_ON)==='OFF'){lsSet(LS_ON,'1');initSync()}else{lsSet(LS_ON,'OFF');if(fbRoot){fbRoot.off('value');fbL=false}if(fbDb)fbDb.goOffline();fbRoot=null;syncUI('','محلي فقط')}render()}

/* ===== عام ===== */
function applyTheme(){var t=lsGet(LS_THEME);if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function toggleTheme(){var c=document.documentElement.getAttribute('data-theme');var dark=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;lsSet(LS_THEME,dark?'light':'dark');applyTheme()}
document.addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});
window.addEventListener('storage',function(e){if(e.key===LS_KEY){load();softRender()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){dailyBackup();if(!typing())render()}});
applyTheme();load();persist();dailyBackup();render();initSync();
</script>
</body>
</html>
