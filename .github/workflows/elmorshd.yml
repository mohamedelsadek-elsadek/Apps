name: أسعار المرشد
on:
  schedule:
    - cron: '30 7 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: سحب الأسعار
        run: python3 tools/elmorshd.py
      - name: حفظ
        run: |
          git config user.name "prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "أسعار المرشد $(date -u +%F' '%H:%M)"
          git pull --rebase -q origin main && git push origin HEAD:main
