<script>/*SAFESYNC BEGIN*/
/* ===== SafeSync v1 — حماية البيانات المشتركة لكل البرامج =====
   1) merge3(base, local, remote): دمج ثلاثي سجل بسجل (حسب id) — جهاز قديم مايقدرش يمسح شغل جهاز تاني.
   2) lsSet(key, str): حفظ محلي؛ لو التخزين مليان يحفظ في IndexedDB ويظهر تحذير أحمر بدل الفشل الصامت.
   3) base: آخر نسخة اتفق عليها الجهاز مع السحابة (في IndexedDB) — أساس معرفة "مين اتغير".
   الكود ده بيتنسخ جوه كل برنامج (single-file) بين علامتي SAFESYNC BEGIN/END. */
(function(G){
  if(G.SafeSync) return;
  var TS_FIELDS=['u','updatedAt','_updatedAt','updated','_u','ts','_ts','t'];
  function isObj(x){return x!==null&&typeof x==='object'&&!Array.isArray(x);}
  function same(a,b){if(a===b)return true;try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return false;}}
  function recTs(r){if(!isObj(r))return 0;for(var i=0;i<TS_FIELDS.length;i++){var v=r[TS_FIELDS[i]];if(typeof v==='number'&&v>1e11)return v;if(typeof v==='string'&&/^\d{4}-\d\d-\d\dT/.test(v)){var p=Date.parse(v);if(p)return p;}}return 0;}
  /* Firebase بيحوّل الأراي اللي فيها فراغات لأوبجكت بمفاتيح أرقام */
  function asArr(x){if(Array.isArray(x))return x;if(isObj(x)){var ks=Object.keys(x);if(ks.length&&ks.every(function(k){return /^\d+$/.test(k);})){return ks.sort(function(a,b){return a-b;}).map(function(k){return x[k];});}}return x;}
  /* مفتاح السجل: id، ولو مش موجود نجرب uid/code/date (لازم يكون موجود في كل العناصر ومايتكررش) */
  var KEYS=['id','uid','code','date','name'];
  function keyOf(a){if(!Array.isArray(a))return null;var items=a.filter(function(x){return x!=null;});if(!items.length||!items.every(isObj))return null;
    for(var k=0;k<KEYS.length;k++){var f=KEYS[k],seen={},ok=true;for(var i=0;i<items.length;i++){var v=items[i][f];if(v===undefined||v===null||v===''||typeof v==='object'){ok=false;break;}v=String(v);if(seen[v]){ok=false;break;}seen[v]=1;}if(ok)return f;}return null;}
  var CUR_KEY='id';
  function idOf(r){var v=isObj(r)?r[CUR_KEY]:undefined;return (v!==undefined&&v!==null&&v!=='')?String(v):null;}
  function keyedArr(a){return keyOf(a)!==null;}
  function emptyArr(a){return Array.isArray(a)&&a.every(function(v){return v==null;});}
  function primArr(a){return Array.isArray(a)&&a.every(function(v){return v===null||typeof v!=='object';});}
  /* قرار قيمة واحدة: لو اتغيرت عند طرف واحد بس خد التغيير؛ لو الاتنين غيروا: الأحدث بالختم، وإلا المحلي (لو فيه base) أو السحابة (لو مفيش) */
  function pick(b,l,r,hasBase,lRec,rRec){
    if(same(l,r))return l;
    if(hasBase){if(same(l,b))return r;if(same(r,b))return l;}
    var lt=recTs(lRec),rt=recTs(rRec);
    if(lt&&rt&&lt!==rt)return lt>rt?l:r;
    return hasBase?l:r;
  }
  function merge3(b,l,r,hasBase,lRec,rRec){
    if(hasBase===undefined)hasBase=(b!==undefined&&b!==null);
    l=asArr(l);r=asArr(r);b=asArr(b);
    if(l===undefined)return hasBase&&same(r,b)?undefined:r;   /* اتمسح محلياً أو جديد من السحابة */
    if(r===undefined)return hasBase&&same(l,b)?undefined:l;   /* اتمسح في السحابة أو جديد محلي */
    if(same(l,r))return l;
    if(isObj(l)&&isObj(r)){
      var out={},keys={},k;
      for(k in r)keys[k]=1;for(k in l)keys[k]=1;
      for(k in keys){
        /* سياق "السجل" (للختم الزمني) بيتورث من الأراي المفهرسة بس — مش من جذر البيانات */
        var v=merge3(isObj(b)?b[k]:undefined,l[k],r[k],hasBase&&isObj(b),lRec,rRec);
        if(v!==undefined)out[k]=v;
      }
      /* ختم السجل = الأكبر */
      if(lRec!==undefined)TS_FIELDS.forEach(function(f){if(typeof l[f]==='number'&&typeof r[f]==='number'&&l[f]>1e11&&r[f]>1e11)out[f]=Math.max(l[f],r[f]);});

    if(kk&&(kl===kk||emptyArr(l))&&(kr===kk||emptyArr(r))&&(b===undefined||b===null||emptyArr(b)||kb===kk||(Array.isArray(b)&&b.every(function(x){return x==null||(isObj(x)&&x[kk]!=null);})))){

      l.forEach(function(x){var i=idOf(x);if(i!==null)lm[i]=x;});
      r.forEach(function(x){var i=idOf(x);if(i!==null){rm[i]=x;if(!seen[i]){seen[i]=1;order.push(i);}}});
      l.forEach(function(x){var i=idOf(x);if(i!==null&&!seen[i]){seen[i]=1;order.push(i);}});

        if(v!==undefined)res.push(v);
      });
      return res;
    }
    if(primArr(l)&&primArr(r)&&(b===undefined||primArr(b))){
      var bs=Array.isArray(b)?b.map(String):null,ls=l.map(String),rs=r.map(String),out2=[],s2={};
      function add(v){var k=String(v);if(!s2[k]){s2[k]=1;out2.push(v);}}
      r.forEach(function(v){var k=String(v);if(bs&&hasBase&&bs.indexOf(k)>=0&&ls.indexOf(k)<0)return;add(v);});
      l.forEach(function(v){var k=String(v);if(bs&&hasBase&&bs.indexOf(k)>=0&&rs.indexOf(k)<0)return;add(v);});
      return out2;
    }

  }
  /* شكل البيانات زي ما Firebase بيخزنها (بيشيل الأراي/الأوبجكت الفاضية والـnull) — للمقارنة بس */
  function fbNorm(x){
    x=asArr(x);
    if(Array.isArray(x)){var o=[];x.forEach(function(v){v=fbNorm(v);if(v!==undefined)o.push(v);});return o.length?o:undefined;}
    if(isObj(x)){var r={},n=0;Object.keys(x).sort().forEach(function(k){var v=fbNorm(x[k]);if(v!==undefined){r[k]=v;n++;}});return n?r:undefined;}
    if(x===null||x===undefined||(typeof x==='number'&&!isFinite(x)))return undefined;
    return x;
  }
  function sameFb(a,b){return JSON.stringify(fbNorm(a))===JSON.stringify(fbNorm(b));}
  function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x));}
  /* ---------- IndexedDB صغير ---------- */
  var _db=null;
  function idb(){if(_db)return _db;_db=new Promise(function(res,rej){try{var q=indexedDB.open('safesync',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv');};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};}catch(e){rej(e);}});return _db;}

  function idbSet(k,v){return idb().then(function(d){return new Promise(function(res){try{var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res(true);};t.onerror=function(){res(false);};}catch(e){res(false);}});}).catch(function(){return false;});}
  function idbDel(k){return idb().then(function(d){return new Promise(function(res){try{var t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=function(){res(true);};}catch(e){res(false);}});}).catch(function(){return false;});}
  /* ---------- تحذير أحمر ---------- */
  function warn(msg){
    try{var el=document.getElementById('ss-warn');
      if(!el){el=document.createElement('div');el.id='ss-warn';el.setAttribute('dir','rtl');
        el.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;background:#b91c1c;color:#fff;font:600 13px/1.5 system-ui,Tahoma,sans-serif;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center';
        var s=document.createElement('span');s.style.flex='1';el.appendChild(s);
        var x=document.createElement('button');x.textContent='✕';x.style.cssText='background:none;border:0;color:#fff;font-size:16px;cursor:pointer';x.onclick=function(){el.remove();};el.appendChild(x);
        (document.body||document.documentElement).appendChild(el);}
      el.firstChild.textContent=msg;}catch(e){}
  }
  /* ---------- حفظ محلي آمن ---------- */
  function lsSet(key,str){
    try{localStorage.setItem(key,str);idbDel('ls:'+key);return true;}
    catch(e){
      idbSet('ls:'+key,{v:str,t:Date.now()});
      warn('⚠️ مساحة التخزين على الجهاز ده مليانة — بياناتك محفوظة على السحابة وفي مخزن احتياطي، بس فضّي مساحة (امسح نسخ احتياطية قديمة).');
      return false;
    }
  }
  /* يرجّع النسخة المحلية الأحدث (localStorage أو المخزن الاحتياطي لو الحفظ فشل قبل كده) */
  function lsGet(key){

  }
  /* ---------- base ---------- */
  function getBase(name){return idbGet('base:'+name);}
  function setBase(name,val){return idbSet('base:'+name,clone(val));}

  function countRecs(x,d){d=d||0;if(d>3||!x||typeof x!=='object')return 0;var n=0;x=asArr(x);

    Object.keys(x).forEach(function(k){n+=countRecs(x[k],d+1);});return n;}
  /* حارس الحذف الجماعي: الدمج مايشيلش أكتر من 30% من السجلات من غير ما يسأل */
  function massDelete(m,cur){var a=countRecs(m),b=countRecs(cur);if(b>10&&a<b*0.7){warn('⚠️ التحديث ده كان هيمسح سجلات كتير ('+b+' ← '+a+') — اتوقف تلقائياً. راجع البيانات قبل ما تكمل.');return true;}return false;}
  /* حقول ختم/عدّاد في الجذر: لو البرنامج بيشيلها محلياً متتفهمش إنها "اتمسحت" (كانت بتعمل رفع لا نهائي بين جهازين) */
  var META_RE=/^(_+updatedAt|updatedAt|_localStamp|_+ts|_+seq|_+u|_+by|_+mt|device)$/;
  function fillMeta(local,remote){
    if(!isObj(local)||!isObj(remote))return local;
    Object.keys(remote).forEach(function(k){if(META_RE.test(k)&&local[k]===undefined)local[k]=remote[k];});
    return local;
  }
  /* دمج بيانات جاية من السحابة مع المحلي. بيرجّع {data, push}: push=true لو المحلي فيه شغل لسه ماترفعش */
  function mergeRemote(name,local,remote,opt){
    opt=opt||{};
    if(remote===null||remote===undefined)return{data:local,push:true};
    if(opt.localEmpty||local===null||local===undefined){commitBase(name,remote);return{data:remote,push:false};}
    var m=merge3(BASES[name]==null?undefined:clone(BASES[name]),fillMeta(clone(local),remote),clone(remote),BASES[name]!=null);
    if(sameFb(m,remote)){commitBase(name,remote);return{data:remote,push:false};}
    if(massDelete(m,remote))return{data:local,push:false,blocked:true};
    return{data:m,push:true};
  }
  /* كتابة آمنة بـ transaction (Firebase SDK): بندمج على آخر نسخة فعلية في السحابة */
  function txSet(ref,name,local,opt){
    opt=opt||{};

      var blocked=false;
      function fn(cur){
        if(cur===null||cur===undefined){var c=clone(local);if(opt.stamp)opt.stamp(c);return c;}
        var m=merge3(BASES[name]==null?undefined:clone(BASES[name]),fillMeta(clone(local),cur),cur,BASES[name]!=null);
        if(massDelete(m,cur)){blocked=true;return;}
        if(opt.stamp)opt.stamp(m);
        return m;
      }
      function done(err,committed,snap){
        if(err)return rej(err);
        if(!committed)return res(blocked?{blocked:true}:null);

  G.SafeSync={merge3:function(b,l,r){var hb=b!==undefined&&b!==null;return merge3(hb?clone(b):undefined,clone(l),clone(r),hb);},

<title>الشيكات والأقساط v3.7</title>

<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1424; --panel:#121a2e; --panel2:#161f38;
  --line:#1f2c47; --line2:#2a3a5c;
  --primary:#3b82f6; --primary-d:#2563eb; --primary-soft:rgba(59,130,246,.12);
  --text:#e6edf7; --muted:#8497b8; --muted2:#5e6f8f;
  --green:#22c55e; --green-soft:rgba(34,197,94,.13);
  --red:#ef4444; --red-soft:rgba(239,68,68,.13);
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.13);
  --cyan:#06b6d4; --violet:#8b5cf6;
  --radius:16px; --radius-sm:11px;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --font:'Readex Pro',system-ui,sans-serif; --display:'Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 500px at 100% -5%, rgba(59,130,246,.10), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(139,92,246,.08), transparent 55%);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#243456;border-radius:20px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#314770}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit;text-decoration:none}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-inline-end:1px solid var(--line);padding:22px 14px;
  display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .logo{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--primary),var(--violet));
  display:grid;place-items:center;font-size:22px;box-shadow:0 6px 18px rgba(59,130,246,.4);
}
.brand h1{font-family:var(--display);font-size:15px;font-weight:800;line-height:1.3}
.brand span{font-size:11px;color:var(--muted2);font-weight:500}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--radius-sm);
  color:var(--muted);font-weight:600;font-size:13.5px;transition:.18s;position:relative;
}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:#fff}
.nav-item.active::before{content:"";position:absolute;inset-inline-start:0;top:18%;height:64%;width:3px;border-radius:4px;background:var(--primary)}
.nav-item .badge{margin-inline-start:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;font-weight:700}
.nav-sep{font-size:10.5px;color:var(--muted2);font-weight:700;letter-spacing:.5px;padding:14px 13px 6px;text-transform:uppercase}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:62px;display:flex;align-items:center;gap:14px;padding:0 26px;
  border-bottom:1px solid var(--line);background:rgba(10,14,26,.7);backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:30;
}
.topbar .menu-btn{display:none;font-size:22px;background:none;color:var(--text)}
.topbar h2{font-family:var(--display);font-size:18px;font-weight:800;flex:1}
.topbar .date{font-size:12.5px;color:var(--muted);font-weight:500}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;
  font-weight:700;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line);transition:.16s;
}
.btn:hover{border-color:var(--primary);background:var(--panel)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));border-color:transparent;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#fca5a5}
.btn.danger:hover{border-color:var(--red);background:var(--red-soft)}

/* كل البرامج على نفس الموقع بتتشارك نفس مساحة التخزين في المتصفح (حوالي 5MB).
   لو اتملت، الكتابة كانت بتوقف البرنامج كله — دلوقتي بنفضّي نسخنا الاحتياطية المحلية ونكمل،
   ولو برضه مفيش مساحة البرنامج بيكمل شغل والسحابة شايلة البيانات. */
function lsSafeSet(k,v){
  try{ localStorage.setItem(k,v); return true; }catch(e){}
  try{ if(k!=='cheques_erp_backups_v1'){ localStorage.removeItem('cheques_erp_backups_v1'); localStorage.setItem(k,v); return true; } }catch(e){}
  window.__lsFull=true; console.warn('مساحة التخزين المحلية مليانة — '+k); return window.SafeSync?SafeSync.lsSet(k,v):false;
}
window.addEventListener('error',function(e){ showBootErr((e.message||'')+' @'+(e.lineno||'')); });
window.addEventListener('unhandledrejection',function(e){ showBootErr('promise: '+((e.reason&&(e.reason.message||e.reason))||'')); });
function showBootErr(m){ try{ var b=document.getElementById('bootErr'); if(!b){ b=document.createElement('div'); b.id='bootErr'; b.style.cssText='position:fixed;bottom:8px;left:8px;right:8px;z-index:99999;background:#7f1d1d;color:#fff;padding:10px 12px;border-radius:10px;font:12px/1.6 monospace;direction:ltr;text-align:left;max-height:30vh;overflow:auto'; b.onclick=function(){b.remove()}; document.body.appendChild(b); } b.textContent+=(b.textContent?'\n':'')+'⚠ '+m; }catch(_){} }

/* ---------- أدوات تشفير بسيطة لكلمة السر ---------- */
async function sha256(txt){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

const FB_DEFAULT_CFG={apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",authDomain:"my-app-sync-11ad9.firebaseapp.com",databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-app-sync-11ad9",appId:"1:177039534756:web:367ecccc684c2cdfdd1431",workspace:"checks"};

let _fbLib=null;
/* نفس مكتبة Firebase (compat 9.23) اللي باقي برامج المركز شغالة بيها — متغلّفة بنفس أسماء الدوال */
function _loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector('script[src="'+src+'"]')) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('مقدرتش أحمّل مكتبة السحابة — اتأكد من النت')); document.head.appendChild(s); }); }
async function fbLoadLib(){
  if(_fbLib) return _fbLib;
  await _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
  await _loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');
  if(!window.firebase) throw new Error('مكتبة السحابة مااتحمّلتش');
  _fbLib={
    initializeApp:cfg=>{ try{ return firebase.app('checks'); }catch(e){ return firebase.initializeApp(cfg,'checks'); } },

    ref:(db,path)=>db.ref(path),

/* ---------- تهيئة الاتصال والاشتراك في التحديثات اللحظية ---------- */
async function fbInit(onData){
  const cfg=fbGetConfig(); if(!cfg) throw new Error('لا توجد إعدادات Firebase');
  const L=await fbLoadLib();
  FB.app = FB.app || L.initializeApp({
    apiKey:cfg.apiKey, authDomain:cfg.authDomain||(cfg.projectId+'.firebaseapp.com'),
    databaseURL:cfg.databaseURL, projectId:cfg.projectId,
    storageBucket:cfg.storageBucket||'', appId:cfg.appId||''
  });
  FB.db = L.getDatabase(FB.app);
  const root = cfg.workspace || 'main';
  FB.ref   = L.ref(FB.db, 'erp/'+root+'/data');
  FB.bkRef = L.ref(FB.db, 'erp/'+root+'/backups');
  FB._L = L;
  FB.onData = onData;
  FB.ready = true;

  // الاشتراك في التحديثات اللحظية من كل الأجهزة
  if(FB._sub) return true; FB._sub=true;
  L.onValue(FB.ref, (snap)=>{

    FB._replay(snap.val());
  });
  FB._replay=(val)=>{ if(val && FB.onData){ FB.onData(val); } };
  return true;
}

/* ---------- رفع البيانات للسحابة (يُستدعى بعد كل تعديل) ---------- */
let _pushT;
/* SafeSync: الرفع بيدمج ثلاثياً على آخر نسخة في السحابة (transaction) — جهاز قديم مايمسحش شغل جهاز تاني */
let _pushBusy=false,_pushAgain=false;
function fbPush(dbObj){
  if(!FB.ready) return;
  clearTimeout(_pushT);
  _pushT=setTimeout(async ()=>{
    if(_pushBusy){_pushAgain=true;return;}
    _pushBusy=true;
    try{
      FB.suppress=true;
      const local=JSON.parse(JSON.stringify(dbObj));
      const r=await SafeSync.txSet(FB.ref,'checks',local,{stamp:m=>{m._updatedAt=Date.now();}});
      FB._pendingVal=null;   /* أي لقطة وصلت قبل الحفظ أقدم من اللي اتحفظ — متتعادش */
      if(r&&r.data&&FB.onApplyMerged){
        const v=JSON.parse(JSON.stringify(r.data)); delete v._updatedAt; delete local._updatedAt;
        const curLocal=JSON.parse(JSON.stringify(FB.getLocal?FB.getLocal():dbObj)); delete curLocal._updatedAt;
        if(!SafeSync.same(curLocal,local)) _pushAgain=true;   /* اتعدل حاجة أثناء الرفع — متتمسحش */
        else if(!SafeSync.same(v,local)) FB.onApplyMerged(v,true);
      }
      setTimeout(()=>{ FB.suppress=false; const pv=FB._pendingVal; FB._pendingVal=null; if(pv&&FB.onData&&!_pushBusy) FB._replay&&FB._replay(pv); }, 400);
    }catch(e){ FB.suppress=false; toast('تعذّر الرفع للسحابة','err'); setTimeout(()=>fbPush(FB.getLocal?FB.getLocal():dbObj),5000); }
    _pushBusy=false;
    if(_pushAgain){_pushAgain=false;fbPush(FB.getLocal?FB.getLocal():dbObj);}
  }, 250);
}

function stats(){
  let dueTotal=0, collected=0, returned=0, deferred=0, cntDue=0, cntCol=0, cntRet=0, cntDef=0;
  let week=0, overdue=0, todayDue=0;
  DB.checks.forEach(c=>{
    const a=Number(c.amount)||0;
    if(c.status==='تحت التحصيل'){ dueTotal+=a; cntDue++;
      const dt=daysToDue(c);
      if(dt!=null){ if(dt<0) overdue++; else if(dt===0) todayDue++; else if(dt<=7) week++; }
    }
    else if(c.status==='تم التحصيل'){ collected+=a; cntCol++; }
    else if(c.status==='مرتجع'){ returned+=a; cntRet++; }
    else if(c.status==='مؤجل'){ deferred+=a; cntDef++; }
  });
  const inst = DB.checks.filter(isInstallment);
  let instRemain=0, instOverdue=0;
  inst.forEach(c=>{ if(c.status==='تحت التحصيل'){ instRemain+=Number(c.amount)||0; if((daysToDue(c)||0)<0) instOverdue+=Number(c.amount)||0; }});
  return {dueTotal,collected,returned,deferred,cntDue,cntCol,cntRet,cntDef,week,overdue,todayDue,
          total:DB.checks.length,instRemain,instOverdue,debt:dueTotal};
}

const ymKey=s=>(s||'').slice(0,7);
const ymLabel=k=>{if(!k)return '—';const [y,m]=k.split('-');return MONTHS_AR[+m-1]+' '+y};
const money0=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});

/* ---------- 1) الصياغة ---------- */
const RELABEL=[
  ['تحت التحصيل','لسه ماتصرفش'],['تم التحصيل','اتصرف'],['قيد التحصيل','عليه شيكات'],['تم تحصيله','اتصرف'],
  ['تاريخ التحصيل','تاريخ الصرف'],['إجمالي المحصّل','إجمالي المصروف'],['المحصّل','المصروف'],['محصّلة','اتصرفت'],['محصّل','اتصرف'],['محصل','اتصرف'],
  ['التحصيل','الصرف'],['تحصيل','صرف'],
  ['إجمالي المديونية الحالية','إجمالي الباقي عليّ'],['المديونية الحالية','الباقي عليّ'],['المديونية','الباقي عليّ'],
  ['القيمة القائمة على العملاء','لسه هتتدفع للمطوّرين'],['العملاء','المطوّرين'],['العميل','المطوّر'],['عميل','مطوّر'],
  ['البنك المسحوب منه','البنك (حسابي)']
];
function relabelStr(t){ if(!t||!/[حعدمب]/.test(t)) return t; let o=t; for(const [a,b] of RELABEL){ if(o.indexOf(a)>-1) o=o.split(a).join(b); } return o; }
function relabelNode(root){
  if(!root) return;
  if(root.nodeType===3){ const p=root.parentNode; if(p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)) return;
    if(p&&p.nodeName==='OPTION'&&!p.hasAttribute('value')) p.setAttribute('value',p.textContent);
    const n=relabelStr(root.nodeValue); if(n!==root.nodeValue) root.nodeValue=n; return; }
  if(root.nodeType!==1||/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.nodeName)) return;
  if(root.nodeName==='OPTION'&&!root.hasAttribute('value')) root.setAttribute('value',root.textContent);
  if(root.placeholder){ const n=relabelStr(root.placeholder); if(n!==root.placeholder) root.placeholder=n; }
  root.querySelectorAll&&root.querySelectorAll('option:not([value])').forEach(o=>o.setAttribute('value',o.textContent));
  root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(e=>{const n=relabelStr(e.placeholder);if(n!==e.placeholder)e.placeholder=n});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); let x; const arr=[]; while((x=w.nextNode())) arr.push(x); arr.forEach(relabelNode);
}
(function(){
  const mo=new MutationObserver(ms=>{ ms.forEach(m=>{ if(m.type==='characterData') relabelNode(m.target); else m.addedNodes.forEach(relabelNode); }); });
  mo.observe(document.body,{childList:true,subtree:true,characterData:true});
  relabelNode(document.body);
  const _toast=toast; toast=function(m,t){ return _toast(relabelStr(m),t); };
})();

/* ---------- 2) السيولة في البنوك ---------- */
function openChecks(){ return DB.checks.filter(c=>c.status===OPEN_ST&&c.due); }
function bankNeeds(fromIso,toIso){ const o={}; openChecks().forEach(c=>{ if((fromIso&&c.due<fromIso)||(toIso&&c.due>toIso)) return; const b=c.bank||'بدون بنك'; o[b]=o[b]||{sum:0,n:0,list:[]}; o[b].sum+=+c.amount||0; o[b].n++; o[b].list.push(c); }); return o; }
function addDaysIso(iso,n){ const d=new Date(iso); d.setDate(d.getDate()+n); return d.toLocaleDateString('en-CA'); }
function cashBanner(){
  DB.bankBal=DB.bankBal||{};
  const t=isoToday(),n30=bankNeeds(null,addDaysIso(t,30)),banks=Object.keys(n30);
  if(!banks.length) return `<div class="cash-banner ok">✅ مفيش شيكات مطلوب تغطيتها في الـ 30 يوم الجايين</div>`;
  return `<div class="cash-banner"><div class="cb-h"><b>💳 لازم يبقى في البنوك خلال 30 يوم</b><span style="flex:1"></span>
    <button class="btn sm" onclick="go('cash')">التفاصيل</button><button class="btn sm primary" onclick="waModal()">📲 واتساب</button></div>
    <div class="cb-list">${banks.map(b=>{const need=n30[b].sum,bal=DB.bankBal[b];const has=bal!==undefined&&bal!=='';const short=has?need-(+bal||0):0;
      const late=n30[b].list.filter(c=>c.due<t).length;
      return `<div class="cb-item ${has&&short>0?'bad':has?'good':''}"><div class="cb-b">${esc(b)}</div><div class="cb-v">${money0(need)} ج <small>(${n30[b].n} شيك)</small></div>
      ${has?(short>0?`<div class="cb-s">⚠️ ناقص ${money0(short)} ج</div>`:`<div class="cb-s">✅ الرصيد يغطي</div>`):`<div class="cb-s mut">اكتب رصيد الحساب من صفحة السيولة</div>`}
      ${late?`<div class="cb-s">🔴 ${late} شيك فات ميعاده</div>`:''}</div>`}).join('')}</div></div>`;
}
let CASH_SEL=null;

  const t=isoToday(),cur=ymKey(t),open=openChecks();

  const months=[];{let d=new Date(t);d.setDate(1);for(let i=0;i<12;i++){months.push(d.toLocaleDateString('en-CA').slice(0,7));d.setMonth(d.getMonth()+1);}}
  const cell={},cnt={};open.forEach(c=>{const b=c.bank||'بدون بنك';let k=c.due<t?'late':ymKey(c.due);if(k!=='late'&&k>months[11])k='later';cell[b+'|'+k]=(cell[b+'|'+k]||0)+(+c.amount||0);cnt[b+'|'+k]=(cnt[b+'|'+k]||0)+1});

      return `<td class="num ${v?'cash-c':''} ${over?'over':''}" ${v?`data-k="${k}" data-b="${esc(b)}"`:''}>${v?money0(v)+`<div class="cc-n">${cnt[b+'|'+k]} شيك</div>`:'—'}</td>`}).join('');
    if(!tot&&k==='later')return '';

    return `<tr class="${k===cur?'cur':''} ${k==='late'?'late':''}"><td><b>${lbl}</b></td>${cells}<td class="num"><b>${tot?money0(tot):'—'}</b></td></tr>`}).join('');
  const totB=banks.map(b=>open.filter(c=>(c.bank||'بدون بنك')===b).reduce((a,c)=>a+(+c.amount||0),0));
  $('#page-cash').innerHTML=`
  ${cashBanner()}

    <div class="bal-grid">${banks.map(b=>`<div class="field"><label>${esc(b)}</label><input class="input bal-in" data-b="${esc(b)}" inputmode="decimal" placeholder="اكتب الرصيد" value="${DB.bankBal[b]!=null?DB.bankBal[b]:''}"></div>`).join('')||'<div style="padding:10px;color:var(--muted)">مفيش شيكات مفتوحة</div>'}</div>
    <div style="font-size:12px;color:var(--muted);padding:0 16px 14px">الخانة الحمرا في الجدول = الشهر اللي الرصيد مش هيكفي فيه (بالتراكم من النهارده).</div></div>
  <div class="panel"><div class="panel-head"><h3>📆 المطلوب في كل بنك شهرياً</h3><span style="flex:1"></span><button class="btn sm primary" onclick="waModal()">📲 ابعت على واتساب</button></div>
    <div class="tbl-wrap"><table class="cash-t"><thead><tr><th>الشهر</th>${banks.map(b=>`<th>${esc(b)}</th>`).join('')}<th>الإجمالي</th></tr></thead>
    <tbody>${rowHtml}</tbody><tfoot><tr><td><b>كل الباقي</b></td>${totB.map(v=>`<td class="num"><b>${money0(v)}</b></td>`).join('')}<td class="num"><b>${money0(totB.reduce((a,b)=>a+b,0))}</b></td></tr></tfoot></table></div>
    <div id="cashList"></div></div>`;
  $$('#page-cash .bal-in').forEach(el=>el.onchange=()=>{const v=String(el.value).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,'').trim();
    if(v==='')delete DB.bankBal[el.dataset.b];else DB.bankBal[el.dataset.b]=Number(v)||0;save();renderCash();toast('اتحفظ الرصيد')});

    $('#cashList').innerHTML=`<div style="padding:12px 16px"><b>${esc(b)} — ${k==='late'?'فات ميعادها':k==='later'?'بعد كده':ymLabel(k)}</b>
      <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>رقم الشيك</th><th>المطوّر</th><th>القيمة</th><th>الاستحقاق</th><th></th></tr></thead><tbody>
      ${L.map(c=>`<tr><td><b>${esc(c.num)}</b></td><td>${esc(custName(c.cust))}</td><td class="num">${fmtMoney(c.amount)}</td><td class="num">${fmtDate(c.due)}</td><td><button class="btn sm" onclick="markPaid('${c.id}')">✅ اتصرف</button></td></tr>`).join('')}</tbody></table></div></div>`;

function markPaid(id){ const c=DB.checks.find(x=>x.id===id); if(!c) return; c.status=DONE_ST; if(!c.collectDate) c.collectDate=isoToday(); save(); toast('اتسجل إنه اتصرف ✓'); const a=document.querySelector('.nav-item.active'); go(a?a.dataset.page:'cash'); }

/* ---------- 4) واتساب ---------- */
function waBuild(range){
  const t=isoToday();let from=t,to=addDaysIso(t,7),title='شيكات الأسبوع الجاي';
  if(range==='30'){to=addDaysIso(t,30);title='شيكات الـ 30 يوم الجايين'}
  else if(range==='month'){from=t.slice(0,8)+'01';const d=new Date(t);d.setMonth(d.getMonth()+1,0);to=d.toLocaleDateString('en-CA');title='شيكات شهر '+ymLabel(ymKey(t))}
  else if(range==='next'){const d=new Date(t);d.setDate(1);d.setMonth(d.getMonth()+1);from=d.toLocaleDateString('en-CA');d.setMonth(d.getMonth()+1,0);to=d.toLocaleDateString('en-CA');title='شيكات شهر '+ymLabel(ymKey(from))}
  const late=openChecks().filter(c=>c.due<t).sort((a,b)=>a.due<b.due?-1:1);
  const L=openChecks().filter(c=>c.due>=from&&c.due<=to).sort((a,b)=>a.due<b.due?-1:1);
  const by={};L.forEach(c=>{const b=c.bank||'بدون بنك';(by[b]=by[b]||[]).push(c)});
  let m='🧾 '+title+'\n('+from+' → '+to+')\n';
  Object.keys(by).forEach(b=>{const s=by[b].reduce((a,c)=>a+(+c.amount||0),0);m+='\n🏦 '+b+' — '+money0(s)+' ج\n';
    by[b].forEach(c=>{m+='• '+c.due+' | '+money0(c.amount)+' ج | '+(custName(c.cust)||'')+' | شيك '+(c.num||'—')+'\n'});
    const bal=(DB.bankBal||{})[b];if(bal!==undefined&&bal!==''){const sh=s-(+bal||0);m+=sh>0?'⚠️ الرصيد ناقص '+money0(sh)+' ج\n':'✅ الرصيد يغطي\n'}});
  if(!L.length)m+='\nمفيش شيكات في الفترة دي ✅\n';
  else m+='\n💰 الإجمالي: '+money0(L.reduce((a,c)=>a+(+c.amount||0),0))+' ج ('+L.length+' شيك)';
  if(late.length)m+='\n\n🔴 شيكات فات ميعادها ولسه متعلّمة إنها ماتصرفتش: '+late.length+' ('+money0(late.reduce((a,c)=>a+(+c.amount||0),0))+' ج)';
  return m;
}
function waModal(){
  openModal(`<div class="modal-head"><h3>📲 ابعت الشيكات على واتساب</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-body"><div class="field full"><label>الفترة</label><select class="input" id="wa_r"><option value="7">الأسبوع الجاي</option><option value="30" selected>الـ 30 يوم الجايين</option><option value="month">الشهر ده</option><option value="next">الشهر الجاي</option></select></div>
   <div class="field full"><label>الرسالة</label><textarea class="input" id="wa_t" rows="12" style="font-size:12.5px;line-height:1.7"></textarea></div></div>
   <div class="modal-foot"><button class="btn primary" id="wa_me">📲 ابعت لنفسي</button><button class="btn" id="wa_any">👥 اختار حد</button><button class="btn" id="wa_cp">📋 نسخ</button></div>`);
  const upd=()=>{$('#wa_t').value=waBuild($('#wa_r').value)};upd();$('#wa_r').onchange=upd;
  const open=ph=>{const u='https://wa.me/'+(ph||'')+'?text='+encodeURIComponent($('#wa_t').value);window.open(u,'_blank')||(location.href=u)};
  $('#wa_me').onclick=()=>open(MY_WA);$('#wa_any').onclick=()=>open('');

}

/* ---------- 3) خطة السداد ---------- */
function parsePlanDate(s){ s=String(s||'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return ''; }
function planCompare(u){
  const plan=(u.plan||[]).filter(p=>p.due),L=unitChecks(u).filter(c=>c.status!=='مرتجع');
  const dates=[...new Set(plan.map(p=>p.due).concat(L.map(c=>c.due).filter(Boolean)))].sort();
  return dates.map(d=>{const P=plan.filter(p=>p.due===d),C=L.filter(c=>c.due===d);const pa=P.reduce((a,p)=>a+(+p.amount||0),0),ca=C.reduce((a,c)=>a+(+c.amount||0),0);
    let st='ok';if(!P.length)st='extra';else if(!C.length)st='none';else if(Math.abs(pa-ca)>0.5)st='diff';
    return {d,P,C,pa,ca,st,paid:C.length&&C.every(c=>c.status===DONE_ST)};});
}
function planSummary(u){ if(!(u.plan||[]).length) return null; const r=planCompare(u); return {ok:r.filter(x=>x.st==='ok').length,diff:r.filter(x=>x.st==='diff').length,none:r.filter(x=>x.st==='none').length,extra:r.filter(x=>x.st==='extra').length,planTot:(u.plan||[]).reduce((a,p)=>a+(+p.amount||0),0)}; }

let _idb=null;
function idb(){ if(_idb) return _idb; _idb=new Promise((res,rej)=>{const r=indexedDB.open('cheques_imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); return _idb; }
async function idbSet(k,v){ try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('i','readwrite');t.objectStore('i').put(v,k);t.oncomplete=res;t.onerror=rej})}catch(e){} }
async function idbGet(k){ try{const d=await idb();return await new Promise(res=>{const r=d.transaction('i').objectStore('i').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null} }
function imgRef(id){ const c=fbGetConfig()||{}; return FB._L.ref(FB.db,'erp/'+(c.workspace||'main')+'/imgs/'+id); }
async function imgPut(id,data){ await idbSet(id,data); if(FB.ready){ try{ await FB._L.set(imgRef(id),data);}catch(e){} } }
async function imgGet(id){ let v=await idbGet(id); if(!v&&FB.ready){ try{const s=await FB._L.get(imgRef(id)); v=s.exists()?s.val():null; if(v) idbSet(id,v);}catch(e){} } return v; }
function compressImg(file){ return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1100,sc=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.62))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)}); }
async function showImg(id){ const c=DB.checks.find(x=>x.id===id); openModal(`<div class="modal-head"><h3>📷 شيك ${esc(c?c.num:'')}</h3><button class="x" onclick="closeModal()">×</button></div><div style="padding:14px;text-align:center" id="imgBox">جاري التحميل…</div>`);

  const p=ps.find(x=>x.id===pid); return p?(+((p.shares||{})[cust])||0)/100:0;
}
function partnerData(pid){
  const L=DB.checks.filter(c=>c.status!=='مرتجع'&&shareOf(pid,c.cust)>0).map(c=>({c,sh:shareOf(pid,c.cust),part:(+c.amount||0)*shareOf(pid,c.cust)}));
  const paid=L.filter(x=>x.c.status===DONE_ST).sort((a,b)=>(a.c.due||'')<(b.c.due||'')?-1:1);
  const open=L.filter(x=>x.c.status===OPEN_ST).sort((a,b)=>(a.c.due||'')<(b.c.due||'')?-1:1);
  const by={};L.forEach(x=>{const k=x.c.cust;by[k]=by[k]||{paid:0,open:0,sh:x.sh};by[k][x.c.status===DONE_ST?'paid':'open']+=x.part});
  return {paid,open,by,paidSum:paid.reduce((a,x)=>a+x.part,0),openSum:open.reduce((a,x)=>a+x.part,0)};
}

let CHK_F = {q:'',bank:'',status:'',rep:'',type:''};

function filteredChecks(){
  return DB.checks.filter(c=>{
    if(CHK_F.q){ const q=CHK_F.q.toLowerCase();
      const hay=[c.num,c.cust,c.custName,custName(c.cust),c.ref,c.bank].join(' ').toLowerCase();
      if(!hay.includes(q)) return false; }
    if(CHK_F.bank && c.bank!==CHK_F.bank) return false;
    if(CHK_F.status && c.status!==CHK_F.status) return false;
    if(CHK_F.rep && c.rep!==CHK_F.rep) return false;
    if(CHK_F.type==='check' && isInstallment(c)) return false;
    if(CHK_F.type==='inst' && !isInstallment(c)) return false;
    return true;
  });
}

function drawChecksTable(){

/* ---------- تعديل مباشر بالضغط على الخانة ---------- */
function inlineEdit(el,id,field){
  if(el.querySelector('input,select')) return;
  const c=DB.checks.find(x=>x.id===id); if(!c) return;
  const old=el.innerHTML; let inp;
  if(field==='status'){
    inp=document.createElement('select'); inp.className='cell-edit-input';
    inp.innerHTML=DB.statuses.map(s=>`<option ${s===c.status?'selected':''}>${esc(s)}</option>`).join('');
  }else if(field==='bank'){
    inp=document.createElement('select'); inp.className='cell-edit-input';
    inp.innerHTML='<option value=""></option>'+DB.banks.map(s=>`<option ${s===c.bank?'selected':''}>${esc(s)}</option>`).join('');
  }else if(field==='due'){
    inp=document.createElement('input'); inp.type='date'; inp.className='cell-edit-input'; inp.value=c.due||'';
  }else{ inp=document.createElement('input'); inp.className='cell-edit-input'; inp.value=c[field]||''; }
  el.innerHTML=''; el.appendChild(inp); inp.focus();
  const commit=()=>{
    let v=inp.value;
    if(c[field]!==v){
      c[field]=v;
      if(field==='status'&&v==='تم التحصيل'&&!c.collectDate) c.collectDate=new Date().toLocaleDateString('en-CA');
      if(field==='status'&&v!=='تم التحصيل') c.collectDate='';
      save(); toast('تم تحديث الشيك'); drawChecksTable();
    } else { el.innerHTML=old; }
  };
  inp.onblur=commit;
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.onblur=null;el.innerHTML=old;} };
  if(inp.tagName==='SELECT') inp.onchange=()=>inp.blur();
}

/* ---------- نموذج إضافة/تعديل شيك ---------- */

      <div class="field"><label>تاريخ الاستحقاق</label><input class="input" id="m_due" type="date" value="${esc(c.due)}"></div>
      <div class="field"><label>الحالة</label><select class="input" id="m_status">${o(DB.statuses,c.status)}</select></div>
      <div class="field"><label>طريقة السداد / النوع</label><select class="input" id="m_method">${o(DB.methods,c.method)}</select></div>
      <div class="field"><label>المندوب</label><select class="input" id="m_rep"><option value=""></option>${o(DB.reps,c.rep)}</select></div>
      <div class="field"><label>تاريخ التحصيل</label><input class="input" id="m_collect" type="date" value="${esc(c.collectDate)}"></div>
      <div class="field full"><label>المرجع / المشروع / رقم الفاتورة</label><input class="input" id="m_ref" value="${esc(c.ref)}"></div>
      <div class="field full"><label>ملاحظات</label><textarea class="input" id="m_notes" rows="2">${esc(c.notes)}</textarea></div>
      <div class="field full"><label>📷 صورة الشيك</label><input class="input" type="file" accept="image/*" id="m_img">
        <div id="m_imgPrev" style="margin-top:8px"></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn primary" id="m_save">💾 حفظ</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>`);
  let newImg=null;
  if(id&&c.hasImg) imgGet(id).then(v=>{ if(v&&$('#m_imgPrev')) $('#m_imgPrev').innerHTML=`<img src="${v}" style="max-width:100%;max-height:220px;border-radius:10px">`; });
  $('#m_img').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ newImg=await compressImg(f); $('#m_imgPrev').innerHTML=`<img src="${newImg}" style="max-width:100%;max-height:220px;border-radius:10px"><div style="font-size:11px;color:var(--muted)">هتتحفظ مع الشيك</div>`; }catch(_){ toast('مقدرتش أقرا الصورة','err'); } };
  $('#m_save').onclick=()=>{
    const num=$('#m_num').value.trim(); const amount=parseFloat($('#m_amount').value);
    if(!num){ toast('أدخل رقم الشيك','err'); return; }
    if(isNaN(amount)){ toast('أدخل قيمة الشيك','err'); return; }
    const data={num,bank:$('#m_bank').value,cust:$('#m_cust').value,custName:custName($('#m_cust').value),
      amount,issue:$('#m_issue').value,due:$('#m_due').value,status:$('#m_status').value,
      method:$('#m_method').value,rep:$('#m_rep').value,collectDate:$('#m_collect').value,
      ref:$('#m_ref').value,notes:$('#m_notes').value};
    let cid=id;
    if(newImg) data.hasImg=true;
    if(id){ Object.assign(c,data); toast('تم تحديث الشيك'); }
    else { cid=uid(); DB.checks.push({id:cid,...data}); toast('تمت إضافة الشيك'); }
    if(newImg) imgPut(cid,newImg);
    save(); closeModal(); drawChecksTable(); 
  };

function delCheck(id){
  const c=DB.checks.find(x=>x.id===id);
  openModal(`<div class="modal-head"><h3>🗑 حذف شيك</h3><button class="x" onclick="closeModal()">×</button></div>

    <div class="modal-foot"><button class="btn danger" id="cd">نعم، احذف</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`);

}

  for(let d=1;d<=days;d++){
    const items=byDay[d]||[]; const isToday=(y===TODAY.getFullYear()&&m===TODAY.getMonth()&&d===TODAY.getDate());

    .cev{font-size:10.5px;font-weight:700;color:#fcd34d;background:var(--amber-soft);border-radius:7px;padding:3px 6px;line-height:1.4;margin-bottom:4px}
    .cev.over{color:#fca5a5;background:var(--red-soft)}
    .cdetail{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cmore{font-size:10px;color:var(--muted2);margin-top:2px}
  </style>
  <div class="panel">
    <div class="panel-head">
      <button class="btn sm" id="calPrev">‹ السابق</button>
      <h3 style="text-align:center;flex:1">${MONTHS_AR[m]} ${y}</h3>
      <button class="btn sm" id="calNext">التالي ›</button>
      <button class="btn sm" id="calToday">اليوم</button>
    </div>
    <div style="padding:8px 18px;font-size:13px;color:var(--muted)">إجمالي استحقاقات الشهر: <b style="color:var(--text)">${fmtMoney(monthDue)}</b></div>
    <div style="padding:8px 18px 20px">
      <div class="cal-head">${DAYS_AR.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>

  </div>`;
  $('#calPrev').onclick=()=>{ if(--UI.calMonth<0){UI.calMonth=11;UI.calYear--;} renderCalendar(); };
  $('#calNext').onclick=()=>{ if(++UI.calMonth>11){UI.calMonth=0;UI.calYear++;} renderCalendar(); };
  $('#calToday').onclick=()=>{ UI.calMonth=TODAY.getMonth();UI.calYear=TODAY.getFullYear(); renderCalendar(); };
}
/* ---------- التقارير ---------- */
function renderReports(){
  const presets=[['all','الكل'],['week','هذا الأسبوع'],['month','هذا الشهر'],['quarter','هذا الربع'],['year','هذه السنة'],['custom','مخصص']];
  $('#page-reports').innerHTML=`
  <div class="panel" style="margin-bottom:18px">
    <div class="panel-head"><h3>📊 نطاق التقرير</h3></div>
    <div style="padding:14px 18px">
      <div class="tabs" id="repTabs">${presets.map(([k,l])=>`<button class="tab ${UI.repPreset===k?'active':''}" data-p="${k}">${l}</button>`).join('')}</div>
      <div id="customRange" style="display:${UI.repPreset==='custom'?'flex':'none'};gap:12px;margin-top:14px;flex-wrap:wrap">
        <div class="field"><label>من</label><input class="input" type="date" id="repFrom" value="${UI.repFrom}"></div>
        <div class="field"><label>إلى</label><input class="input" type="date" id="repTo" value="${UI.repTo}"></div>
      </div>
    </div>
  </div>
  <div id="repBody"></div>`;
  $$('#repTabs .tab').forEach(t=>t.onclick=()=>{UI.repPreset=t.dataset.p;renderReports();});
  if(UI.repPreset==='custom'){
    $('#repFrom').onchange=e=>{UI.repFrom=e.target.value;drawReport();};
    $('#repTo').onchange=e=>{UI.repTo=e.target.value;drawReport();};
  }
  drawReport();
}
function reportRange(){
  const t=new Date(TODAY); let from=null,to=null;
  if(UI.repPreset==='week'){ from=new Date(t); from.setDate(t.getDate()-t.getDay()); to=new Date(from); to.setDate(from.getDate()+6); }
  else if(UI.repPreset==='month'){ from=new Date(t.getFullYear(),t.getMonth(),1); to=new Date(t.getFullYear(),t.getMonth()+1,0); }
  else if(UI.repPreset==='quarter'){ const q=Math.floor(t.getMonth()/3); from=new Date(t.getFullYear(),q*3,1); to=new Date(t.getFullYear(),q*3+3,0); }
  else if(UI.repPreset==='year'){ from=new Date(t.getFullYear(),0,1); to=new Date(t.getFullYear(),11,31); }
  else if(UI.repPreset==='custom'){ from=parseDate(UI.repFrom); to=parseDate(UI.repTo); }
  if(from) from.setHours(0,0,0,0); if(to) to.setHours(0,0,0,0);
  return {from,to};
}
function drawReport(){
  const {from,to}=reportRange();
  const inRange=c=>{ if(!from&&!to) return true; const d=parseDate(c.due); if(!d) return false;
    if(from&&d<from) return false; if(to&&d>to) return false; return true; };
  const rows=DB.checks.filter(inRange);
  const sum=st=>rows.filter(c=>c.status===st).reduce((a,c)=>a+(+c.amount||0),0);
  const cnt=st=>rows.filter(c=>c.status===st).length;

  // حسب البنك
  const byBank={}; rows.forEach(c=>{ const k=c.bank||'غير محدد'; byBank[k]=(byBank[k]||0)+(+c.amount||0); });
  const bankMax=Math.max(1,...Object.values(byBank));
  // حسب المندوب
  const byRep={}; rows.forEach(c=>{ const k=c.rep||'غير محدد'; byRep[k]=(byRep[k]||0)+(+c.amount||0); });

  const bar=(obj,max,color)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar-row"><span class="lbl" style="width:130px">${esc(k)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:${color}"></div></div>
      <span class="amt">${fmtMoney(v)}</span></div>`).join('')||'<div class="empty">لا بيانات</div>';

  $('#repBody').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi" style="--accent:var(--primary);--accent-soft:var(--primary-soft)"><div class="ico">🧾</div><div class="label">عدد الشيكات بالفترة</div><div class="val">${fmtNum(rows.length)}</div></div>
      <div class="kpi" style="--accent:var(--amber);--accent-soft:var(--amber-soft)"><div class="ico">💰</div><div class="label">مستحق</div><div class="val">${fmtMoney(sum('تحت التحصيل'))}</div><div class="sub">${cnt('تحت التحصيل')} شيك</div></div>
      <div class="kpi" style="--accent:var(--green);--accent-soft:var(--green-soft)"><div class="ico">✅</div><div class="label">محصّل</div><div class="val">${fmtMoney(sum('تم التحصيل'))}</div><div class="sub">${cnt('تم التحصيل')} شيك</div></div>
      <div class="kpi" style="--accent:var(--red);--accent-soft:var(--red-soft)"><div class="ico">❌</div><div class="label">مرتجع</div><div class="val">${fmtMoney(sum('مرتجع'))}</div><div class="sub">${cnt('مرتجع')} شيك</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h3>🏦 التوزيع حسب البنك</h3></div><div style="padding:14px 18px">${bar(byBank,bankMax,'linear-gradient(90deg,var(--primary),var(--cyan))')}</div></div>
      <div class="panel"><div class="panel-head"><h3>🧑‍💼 التوزيع حسب المندوب</h3></div><div style="padding:14px 18px">${bar(byRep,Math.max(1,...Object.values(byRep)),'linear-gradient(90deg,var(--violet),var(--primary))')}</div></div>
    </div>
    <div class="section-title">📄 تفاصيل الشيكات بالفترة</div>
    <div class="panel"><div class="tbl-wrap"><table>
      <thead><tr><th>رقم الشيك</th><th>العميل</th><th>البنك</th><th>القيمة</th><th>الاستحقاق</th><th>الحالة</th></tr></thead>
      <tbody>${rows.sort((a,b)=>(parseDate(a.due)||0)-(parseDate(b.due)||0)).map(c=>{const sp={'تحت التحصيل':'amber','تم التحصيل':'green','مرتجع':'red','مؤجل':'gray'}[c.status]||'gray';
        return `<tr><td><b>${esc(c.num)}</b></td><td>${esc(custName(c.cust))}</td><td>${esc(c.bank||'—')}</td>
        <td class="num" style="font-weight:700">${fmtMoney(c.amount)}</td><td class="num">${fmtDate(c.due)}</td>
        <td><span class="pill ${sp}">${esc(c.status)}</span></td></tr>`;}).join('')||'<tr><td colspan="6"><div class="empty">لا توجد شيكات في هذه الفترة</div></td></tr>'}</tbody>
    </table></div></div>`;
}

/* ---------- النسخ الاحتياطي التلقائي ---------- */
function loadBackups(){ try{ return JSON.parse(localStorage.getItem(BK_KEY))||[]; }catch(e){ return []; } }
function saveBackups(arr){ try{ arr=arr.slice(-5); localStorage.setItem(BK_KEY, JSON.stringify(arr)); }
  catch(e){} }

// نسخة تلقائية يومية: واحدة لكل يوم، تتحدّث كل ما يُفتح البرنامج، مع الاحتفاظ بآخر 30 يوم
function autoBackup(){
  const today=new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
  let arr=loadBackups();
  const snap={ date:today, ts:Date.now(), auto:true,
    counts:{checks:DB.checks.length,customers:DB.customers.length},
    data:JSON.stringify(DB) };
  const idx=arr.findIndex(b=>b.date===today && b.auto);
  if(idx>-1) arr[idx]=snap;      // حدّث نسخة اليوم
  else arr.push(snap);            // أو أنشئ نسخة جديدة لليوم
  // احتفظ بآخر 30 يوم فقط (للنسخ التلقائية) + احذف الأقدم من 30 يوم
  const cutoff=Date.now()-BK_KEEP_DAYS*86400000;
  arr=arr.filter(b=> !b.auto || b.ts>=cutoff);
  // وللأمان: لو زادت النسخ التلقائية عن 30، احذف الأقدم
  let autos=arr.filter(b=>b.auto).sort((a,b)=>a.ts-b.ts);
  while(autos.length>BK_KEEP_DAYS){ const old=autos.shift(); arr=arr.filter(b=>b!==old); }
  saveBackups(arr);
  // رفع النسخ للسحابة لو متصل (نسخ احتياطي سحابي)
  if(typeof FB!=='undefined' && FB.ready && typeof fbWriteBackups==='function'){ fbWriteBackups(arr); }
}

function restoreBackup(b){
  if(!confirm('سيتم استبدال البيانات الحالية بنسخة '+b.date+'. متأكد؟')) return;
  try{ const d=JSON.parse(b.data);
    DB=Object.assign({statuses:['تحت التحصيل','تم التحصيل','مرتجع','مؤجل']},d); normDB();
    save(); closeModal(); go('dashboard'); toast('تمت الاستعادة من نسخة '+b.date);
  }catch(e){ toast('تعذّر استعادة النسخة','err'); }
}
function downloadBackup(b){
  const blob=new Blob([b.data],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='backup_'+b.date+'.json'; a.click();
}
function deleteBackup(ts){ saveBackups(loadBackups().filter(b=>b.ts!==ts)); backupModal(); }

function backupModal(){
  const arr=loadBackups().sort((a,b)=>b.ts-a.ts);
  const rows=arr.map(b=>{
    const t=new Date(b.ts).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    return `<tr>
      <td><b>${esc(b.date)}</b><div style="font-size:11px;color:var(--muted2)">${b.auto?'🔄 تلقائي':'✋ يدوي'} • ${t}</div></td>
      <td class="num">${b.counts?b.counts.checks:'—'} شيك<br><span style="color:var(--muted)">${b.counts?b.counts.customers:'—'} عميل</span></td>
      <td style="white-space:nowrap">
        <button class="btn sm primary" data-r="${b.ts}">↩️ استعادة</button>
        <button class="btn sm" data-dl="${b.ts}">⬇️</button>
        <button class="btn sm danger" data-x="${b.ts}">🗑</button></td></tr>`;
  }).join('');
  openModal(`<div class="modal-head"><h3>💾 النسخ الاحتياطي والاستعادة</h3><button class="x" onclick="closeModal()">×</button></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
      <div style="background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:12px 15px;font-size:12.5px;line-height:1.7">
        ✅ <b>النسخ التلقائي مُفعّل.</b> يأخذ النظام نسخة تلقائية كل يوم عند فتح البرنامج، ويحتفظ بآخر <b>${BK_KEEP_DAYS} يوم</b>، ويحذف الأقدم تلقائياً. النسخ محفوظة داخل متصفحك.
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" id="bkNow">💾 أخذ نسخة الآن</button>
        <button class="btn" id="bkExport">⬇️ تصدير ملف JSON</button>
        <button class="btn" id="bkImport">⬆️ استيراد ملف</button>
      </div>
      <div style="font-weight:700;font-size:13px;margin-top:4px">📚 النسخ المحفوظة (${arr.length})</div>
      ${arr.length?`<div class="tbl-wrap" style="max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px">
        <table><thead><tr><th>التاريخ</th><th>المحتوى</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`:`<div class="empty" style="padding:24px"><div class="big">🗂️</div>لا توجد نسخ بعد</div>`}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">إغلاق</button></div>`);

  $('#bkNow').onclick=()=>{
    const today=new Date().toLocaleDateString('en-CA'); let a=loadBackups();
    a.push({date:today,ts:Date.now(),auto:false,counts:{checks:DB.checks.length,customers:DB.customers.length},data:JSON.stringify(DB)});
    saveBackups(a); toast('تم أخذ نسخة يدوية'); backupModal();
  };
  $('#bkExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='backup_checks_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    toast('تم تصدير النسخة الاحتياطية');
  };
  $('#bkImport').onclick=()=>$('#importFile').click();
  $$('[data-r]').forEach(b=>b.onclick=()=>{ const bk=loadBackups().find(x=>x.ts==b.dataset.r); if(bk) restoreBackup(bk); });
  $$('[data-dl]').forEach(b=>b.onclick=()=>{ const bk=loadBackups().find(x=>x.ts==b.dataset.dl); if(bk) downloadBackup(bk); });
  $$('[data-x]').forEach(b=>b.onclick=()=>deleteBackup(+b.dataset.x));
}
$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.checks||!d.customers) throw 0;
    DB=Object.assign({statuses:['تحت التحصيل','تم التحصيل','مرتجع','مؤجل']},d); normDB(); save(); closeModal(); go('dashboard'); toast('تم استيراد النسخة الاحتياطية');
  }catch(err){ toast('ملف غير صالح','err'); } };
  r.readAsText(f); e.target.value='';
};

/* ===== تدفق الإقلاع ===== */
async function boot(){
  load();
  /* لو الحفظ المحلي فشل قبل كده (التخزين مليان)، أحدث نسخة في المخزن الاحتياطي */
  SafeSync.idbGet('ls:'+LS_KEY).then(f=>{ if(f&&f.v){ try{ DB=JSON.parse(f.v); normDB(); go('dashboard'); }catch(e){} } });
  // 1) القفل بكلمة السر (لو مفعّل)
  if(typeof pinIsSet==='function' && pinIsSet() && !isUnlocked()){
    showLockScreen(startApp);
  } else {
    startApp();
  }
}
let CLOUD_ERR='';
async function startApp(){
  try{ setUnlocked && setUnlocked(); }catch(e){}
  /* اعرض لوحة التحكم فوراً من البيانات المحفوظة على الجهاز، والسحابة تتصل في الخلفية */
  try{ autoBackup(); }catch(e){ console.warn('backup',e); }
  try{ go('dashboard'); }catch(e){ console.error('dash',e); }
  cloudConnect();
}
async function cloudConnect(){
  if(!(typeof fbIsConfigured==='function' && fbIsConfigured())){ updateCloudBadge('local'); return; }
  if(FB.ready){ updateCloudBadge('online'); return; }
  updateCloudBadge('connecting');
  const timeout=ms=>new Promise((_,rej)=>setTimeout(()=>rej(new Error('الاتصال اتأخر أكتر من '+(ms/1000)+' ثانية')),ms));
  try{
    await SafeSync.loadBase('checks');
    FB.onApplyMerged=applyCloudData; FB.getLocal=()=>DB;
    await Promise.race([fbInit(applyCloudData),timeout(15000)]);
    const snap=await Promise.race([FB._L.get(FB.ref),timeout(15000)]);
    if(!snap.exists()){ delete DB._seeded; fbPush(DB); }
    else { const v=snap.val(); if(v) applyCloudData(v); }
    CLOUD_ERR=''; updateCloudBadge('online');
    toast('☁️ متصل بالسحابة — التزامن اللحظي مُفعّل');
  }catch(e){
    CLOUD_ERR=(e&&(e.code||e.message))||String(e); FB.ready=false;
    updateCloudBadge('offline');
    toast('تعذّر الاتصال بالسحابة: '+CLOUD_ERR,'err');
  }
}
/* الضغط على شارة الاتصال: يعيد المحاولة، ولو كان مقطوع يدوياً يرجّع الاتصال */
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('#cloudBadge'); if(!b) return;
  if(FB.ready){ toast('☁️ متصل — آخر مزامنة شغالة'); return; }
  try{ const c=JSON.parse(localStorage.getItem(FB_CFG_KEY)||'null'); if(c&&c.off) localStorage.removeItem(FB_CFG_KEY); }catch(_){ localStorage.removeItem(FB_CFG_KEY); }
  if(CLOUD_ERR) toast('آخر خطأ: '+CLOUD_ERR+' — بحاول تاني…','err');
  cloudConnect(); });
function updateCloudBadge(state){
  const el=$('#cloudBadge'); if(!el) return;
  const map={connecting:['⏳ جارٍ الاتصال...','amber'],online:['☁️ متصل — تزامن لحظي','green'],
    offline:['⚠️ غير متصل','red'],local:['💾 وضع محلي','gray']};
  const [t,c]=map[state]||map.local;
  el.className='pill '+c; el.textContent=t;
}

/* ===== شاشة القفل ===== */
function showLockScreen(onOk){
  const ov=document.createElement('div');
  ov.id='lockScreen';
  ov.innerHTML=`<div class="lock-card">
    <div class="lock-logo">🔒</div>
    <h2>نظام إدارة الشيكات</h2>
    <p>أدخل كلمة السر للدخول</p>
    <input type="password" id="lockPin" class="input" placeholder="كلمة السر" autofocus>
    <button class="btn primary" id="lockBtn" style="width:100%;justify-content:center;margin-top:6px">دخول</button>
    <div id="lockErr" style="color:#fca5a5;font-size:12.5px;min-height:18px;margin-top:8px"></div>
  </div>`;
  document.body.appendChild(ov);
  const tryUnlock=async ()=>{
    const v=$('#lockPin').value;
    if(await pinCheck(v)){ setUnlocked(); ov.remove(); onOk(); }
    else { $('#lockErr').textContent='كلمة السر غير صحيحة'; $('#lockPin').value=''; $('#lockPin').focus(); }
  };
  $('#lockBtn').onclick=tryUnlock;
  $('#lockPin').onkeydown=e=>{ if(e.key==='Enter') tryUnlock(); };
}

boot();

</script>
<script>
/* لو المتصفح فاتح نسخة قديمة من الكاش: يجيب آخر نسخة من الموقع ولو الرقم مختلف يعمل تحديث لوحده (مرة واحدة) */
(function(){
  if(location.protocol.indexOf('http')!==0) return;
  var cur=(document.getElementById('appVer')||{}).textContent||'';
  fetch(location.pathname+'?nocache='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
    var m=t.match(/id="appVer">([^<]+)</); if(!m||m[1]===cur) return;
    var k='chk_upd_'+m[1]; if(sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1');
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }).catch(function(){});
})();
</script>
