<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>دفتر الفلوس v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--card:#141a2e;--card2:#1c2440;--line:#26304f;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--txt:#e8edf7;--mut:#8b96b3}
body{font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:110px;font-size:15px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto}
.head{padding:18px 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0a0e1a 75%,rgba(10,14,26,0))}
.head h1{font-size:21px;font-weight:800}.head .sub{color:var(--mut);font-size:12px;margin-top:2px}
.head .sp{flex:1}
.sync{font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);white-space:nowrap}
.sync.on{color:var(--green);border-color:rgba(34,197,94,.4)}.sync.err{color:var(--red);border-color:rgba(239,68,68,.4)}
.iconb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:16px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 10px}
.sbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.sbox .lbl{font-size:12px;color:var(--mut);margin-bottom:5px}.sbox .val{font-size:20px;font-weight:800}
.sbox.me .val{color:var(--green)}.sbox.them .val{color:var(--red)}
.net{margin:0 16px 12px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.net .lbl{font-size:13px;color:var(--mut)}.net .val{font-size:18px;font-weight:800}
.alerts{margin:0 16px 12px;border-radius:14px;border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.08);padding:10px 12px}
.alerts h4{font-size:13px;margin-bottom:6px}
.al{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px dashed rgba(255,255,255,.08);cursor:pointer}
.al:first-of-type{border-top:0}.al .r{white-space:nowrap;font-weight:700}
.late{color:var(--red)}.soon{color:var(--amber)}
.tools{display:flex;gap:8px;padding:0 16px 10px}
.tools input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);font-size:15px;font-family:inherit;min-width:0}
.tabs{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:11px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:700}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.list{padding:4px 16px}
.empty{text-align:center;color:var(--mut);padding:40px 20px;font-size:14px;line-height:1.8}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pcard:active{transform:scale(.99)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--card2)}
.pcard .mid{flex:1;min-width:0}.pcard .nm{font-weight:800;font-size:15.5px}.pcard .mt{font-size:12px;color:var(--mut);margin-top:3px}
.pcard .bal{text-align:left;white-space:nowrap}.pcard .bal b{font-size:16px;display:block}.pcard .bal small{font-size:11px;color:var(--mut)}
.pos{color:var(--green)}.neg{color:var(--red)}.zero{color:var(--mut)}
.fabwrap{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.fab{background:var(--blue);color:#fff;border:none;border-radius:16px;padding:14px 22px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(59,130,246,.4);white-space:nowrap}
.fab.sec{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font-size:16px;font-family:inherit}
.field textarea{resize:none;height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-size:13px;font-weight:700;line-height:1.4}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg button.g.on{background:var(--green);border-color:var(--green)}.seg button.r.on{background:var(--red);border-color:var(--red)}
.save{width:100%;background:var(--blue);color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;margin-top:4px}
.cancel{width:100%;background:transparent;color:var(--mut);border:none;padding:12px;font-size:14px}
.hint{font-size:12px;color:var(--mut);line-height:1.7;margin:-4px 0 10px}
/* كشف الحساب */
.st-head{padding:6px 16px 12px}
.back{background:none;border:none;color:var(--blue);font-size:14px;font-weight:700;padding:6px 0}
.st-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:6px 16px 12px}
.st-card .nm{font-size:20px;font-weight:800}.st-card .kd{font-size:12px;color:var(--mut);margin-top:3px}
.st-card .bal{font-size:26px;font-weight:900;margin-top:12px}.st-card .bl{font-size:13px;color:var(--mut)}
.st-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}
.st-acts button{padding:12px 8px;border-radius:13px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13.5px;font-weight:800;line-height:1.4}
.st-acts .g{color:var(--green)}.st-acts .r{color:var(--red)}
.st-more{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap}
.st-more button{flex:1;padding:9px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12.5px;font-weight:700;min-width:90px}
.mv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin:0 16px 8px}
.mv .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mv .k{font-weight:800;font-size:14px}.mv .a{font-weight:800;white-space:nowrap}
.mv .m{font-size:12px;color:var(--mut);margin-top:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mv .n{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.6}
.mv .rb{font-size:12px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:7px;font-weight:700;margin-inline-start:4px}
.pill.late{background:rgba(239,68,68,.18)}.pill.soon{background:rgba(245,158,11,.18)}.pill.ok{background:rgba(139,150,179,.15);color:var(--mut)}
.mvx{display:flex;gap:6px;margin-top:8px}.mvx button{padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<div class="toast" id="toast"></div>

<!-- إضافة حركة -->
<div class="overlay" id="mvOv"><div class="sheet" id="mvSheet"></div></div>
<!-- شخص/شركة -->
<div class="overlay" id="pOv"><div class="sheet" id="pSheet"></div></div>

<script>
"use strict";
/* =====================================================================
   دفتر الفلوس v2 — الديون اللي ليك واللي عليك للأشخاص والشركات
   - كل طرف (شخص/شركة) له كشف حساب بحركات:
       lend   = دين ليك عنده (اديته فلوس / باعتله / هو مديون لك)   → +
       borrow = دين عليك له (اخدت منه / اشتريت بالآجل)            → −
       recv   = استلمت منه (رجّعلي / سدّد)                         → −
       pay    = دفعتله (سدّدت له)                                  → +
     الرصيد = موجب: ليك عنده · سالب: عليك له
   - كل سجل وثيقة مستقلة بختم وقت (u) وحذف ناعم (del) → مزامنة سجل بسجل
   ===================================================================== */
const APP_VER='v2.0';
const LS_DOCS='debtbook_v2_docs', LS_OLD='debtbook_v1', LS_MIG='debtbook_v2_migrated';
const FB_CFG={apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",authDomain:"my-app-sync-11ad9.firebaseapp.com",databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-app-sync-11ad9",appId:"1:177039534756:web:367ecccc684c2cdfdd1431"};
const FB_PATH='debtbook/docs';
const MY_WA='201000363852';
const KINDS={lend:{t:'دين ليك عنده',s:'اديته / عليه ليك',sign:1,ic:'⬆️',c:'pos'},borrow:{t:'دين عليك له',s:'اخدت منه / عليك ليه',sign:-1,ic:'⬇️',c:'neg'},
  recv:{t:'استلمت منه',s:'رجّعلك / سدّدلك',sign:-1,ic:'💵',c:'pos'},pay:{t:'دفعتله',s:'سدّدت له',sign:1,ic:'💸',c:'neg'}};
const METHODS=['نقدي','تحويل بنكي','إنستاباي','فودافون كاش','شيك'];

/* ---------- أدوات ---------- */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(Number(n)||0).toLocaleString('en-US');
const now=()=>Date.now();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const arDate=iso=>{if(!iso)return '';try{return new Date(iso+'T00:00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'})}catch(e){return iso}};
const toEn=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2300)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- البيانات ---------- */
let DOCS={};
try{DOCS=JSON.parse(lsGet(LS_DOCS)||'{}')||{}}catch(e){DOCS={}}
function persist(){lsSet(LS_DOCS,JSON.stringify(DOCS))}
function put(d){d.u=now();DOCS[d.id]=JSON.parse(JSON.stringify(d));persist();cloudPut(d)}
function del(id){const d=DOCS[id];if(!d)return;put(Object.assign({},d,{del:1}))}
const parties=()=>Object.values(DOCS).filter(d=>d.t==='party'&&!d.del);
const moves=pid=>Object.values(DOCS).filter(d=>d.t==='mv'&&!d.del&&(!pid||d.party===pid));
function balanceOf(pid){return moves(pid).reduce((a,m)=>a+(KINDS[m.kind]?KINDS[m.kind].sign*(+m.amount||0):0),0)}
/* الديون اللي ليها ميعاد ولسه ماتسددتش: السداد بيتوزع على الأقدم الأول */
function openDues(pid){
  const L=moves(pid).sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:(a.u||0)-(b.u||0));
  const out=[];
  [['lend','recv'],['borrow','pay']].forEach(([dk,pk])=>{
    let paid=L.filter(m=>m.kind===pk).reduce((a,m)=>a+(+m.amount||0),0);
    L.filter(m=>m.kind===dk).sort((a,b)=>((a.due||a.date)<(b.due||b.date)?-1:1)).forEach(m=>{const take=Math.min(paid,+m.amount||0);paid-=take;const rem=(+m.amount||0)-take;if(rem>0.5)out.push({m,rem})});
  });
  return out;
}
function dueState(iso){if(!iso)return null;const d=Math.round((new Date(iso+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
  if(d<0)return{c:'late',t:'متأخر '+(-d)+' يوم'};if(d===0)return{c:'soon',t:'النهارده'};if(d<=7)return{c:'soon',t:'باقي '+d+' يوم'};return{c:'ok',t:arDate(iso)}}

/* ---------- نقل البيانات القديمة (v1) مرة واحدة ---------- */
function migrateOld(){
  if(lsGet(LS_MIG))return;
  let old=[];try{old=JSON.parse(lsGet(LS_OLD)||'[]')}catch(e){}
  if(!Array.isArray(old)||!old.length){lsSet(LS_MIG,'1');return}
  const byName={};parties().forEach(p=>byName[p.name.trim()]=p);
  old.forEach(o=>{
    const nm=String(o.name||'بدون اسم').trim();
    let p=byName[nm];if(!p){p={id:'pold_'+encodeURIComponent(nm).replace(/%/g,'').slice(0,40),t:'party',name:nm,kind:'شخص',phone:'',note:''};put(p);byName[nm]=p}
    const dt=o.id&&+o.id>1e12?new Date(+o.id):new Date();const iso=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    const k=o.type==='alaya'?'borrow':'lend';
    if(!DOCS['mold_'+o.id])put({id:'mold_'+o.id,t:'mv',party:p.id,kind:k,amount:+o.amount||0,date:iso,due:o.due||'',note:o.note||'',method:''});
    if(+o.paid>0&&!DOCS['mold_p_'+o.id])put({id:'mold_p_'+o.id,t:'mv',party:p.id,kind:k==='lend'?'recv':'pay',amount:+o.paid,date:iso,due:'',note:'سداد مسجّل في النسخة القديمة',method:''});
  });
  lsSet(LS_MIG,'1');toast('اتنقل '+old.length+' بند من الدفتر القديم ✓');
}

/* ---------- المزامنة (Firebase compat — نفس باقي البرامج) ---------- */
let fbRef=null,syncSt='off';
function setSync(s){syncSt=s;const el=$('#syncB');if(el){el.className='sync '+(s==='on'?'on':s==='err'?'err':'');el.textContent=s==='on'?'☁️ متزامن':s==='err'?'⚠️ غير متصل':'⏳ جاري الاتصال'}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function cloudInit(){
  try{
    await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');
    let app;try{app=firebase.app('debtbook')}catch(e){app=firebase.initializeApp(FB_CFG,'debtbook')}
    fbRef=app.database().ref(FB_PATH);
    fbRef.on('value',snap=>{
      const cloud=snap.val()||{};let changed=false;const up=[];
      Object.keys(cloud).forEach(k=>{const c=cloud[k];if(!c||!c.id)return;const l=DOCS[k];if(!l||(c.u||0)>(l.u||0)){DOCS[k]=c;changed=true}});
      Object.keys(DOCS).forEach(k=>{const c=cloud[k];if(!c||(DOCS[k].u||0)>(c.u||0))up.push(DOCS[k])});
      if(changed){persist();softRender()}
      up.forEach(d=>fbRef.child(d.id).set(d));
      setSync('on');
    },()=>setSync('err'));
  }catch(e){setSync('err')}
}
function cloudPut(d){if(fbRef){try{fbRef.child(d.id).set(d)}catch(e){}}}

/* ---------- الواجهة ---------- */
let VIEW={page:'home',filter:'open',kind:'',q:'',pid:null};
function softRender(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a))return;render()}
function render(){VIEW.page==='party'&&DOCS[VIEW.pid]&&!DOCS[VIEW.pid].del?renderParty():renderHome();setSync(syncSt)}
function headHtml(){return `<div class="head"><div><h1>💰 دفتر الفلوس</h1><div class="sub">الديون اللي ليك واللي عليك · ${APP_VER}</div></div><div class="sp"></div>
  <span class="sync" id="syncB"></span><button class="iconb" onclick="moreMenu()" title="نسخ احتياطي">⋯</button></div>`}
function renderHome(){
  const P=parties().map(p=>({p,b:balanceOf(p.id),n:moves(p.id).length}));
  let me=0,them=0;P.forEach(x=>{if(x.b>0)me+=x.b;else them-=x.b});
  const dues=[];P.forEach(x=>openDues(x.p.id).forEach(o=>{if(o.m.due)dues.push(Object.assign({p:x.p},o))}));
  const soonD=dues.filter(d=>d.m.due<=addDays(today(),14)).sort((a,b)=>a.m.due<b.m.due?-1:1);
  let L=P;
  if(VIEW.filter==='lik')L=L.filter(x=>x.b>0.5);else if(VIEW.filter==='alaya')L=L.filter(x=>x.b<-0.5);else if(VIEW.filter==='zero')L=L.filter(x=>Math.abs(x.b)<=0.5);else L=L.filter(x=>Math.abs(x.b)>0.5);
  if(VIEW.kind)L=L.filter(x=>(x.p.kind||'شخص')===VIEW.kind);
  if(VIEW.q){const q=VIEW.q.trim();L=L.filter(x=>x.p.name.indexOf(q)>-1||(x.p.note||'').indexOf(q)>-1)}
  L.sort((a,b)=>Math.abs(b.b)-Math.abs(a.b));
  const tab=(k,t,grp)=>`<button class="tab ${VIEW[grp]===k?'on':''}" onclick="VIEW.${grp}='${k}';render()">${t}</button>`;
  $('#app').innerHTML=headHtml()+`
  <div class="summary"><div class="sbox me"><div class="lbl">ليك عند الناس</div><div class="val">${fmt(me)}</div></div><div class="sbox them"><div class="lbl">عليك للناس</div><div class="val">${fmt(them)}</div></div></div>
  <div class="net"><span class="lbl">الصافي</span><span class="val ${me-them>=0?'pos':'neg'}">${Math.abs(me-them)<=0.5?'خالص':(me-them>0?'ليك ':'عليك ')+fmt(Math.abs(me-them))}</span></div>
  ${soonD.length?`<div class="alerts"><h4>⏰ مستحق قريب (14 يوم) أو متأخر</h4>${soonD.slice(0,8).map(d=>{const s=dueState(d.m.due);return `<div class="al" onclick="openParty('${d.p.id}')"><span>${d.m.kind==='lend'?'⬆️ ليك عند':'⬇️ عليك لـ'} <b>${esc(d.p.name)}</b> <span class="pill ${s.c} ${s.c}">${s.t}</span></span><span class="r ${d.m.kind==='lend'?'pos':'neg'}">${fmt(d.rem)}</span></div>`}).join('')}</div>`:''}
  <div class="tools"><input placeholder="🔍 دوّر باسم شخص أو شركة" value="${esc(VIEW.q)}" oninput="VIEW.q=this.value;clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const i=document.querySelector('.tools input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></div>
  <div class="tabs">${tab('open','المفتوح','filter')}${tab('lik','ليك','filter')}${tab('alaya','عليك','filter')}${tab('zero','خالص','filter')}<span style="width:8px;flex:none"></span>${tab('','الكل','kind')}${tab('شخص','👤 أشخاص','kind')}${tab('شركة','🏢 شركات','kind')}</div>
  <div class="list">${L.length?L.map(x=>`<div class="pcard" onclick="openParty('${x.p.id}')"><div class="av">${x.p.kind==='شركة'?'🏢':'👤'}</div>
    <div class="mid"><div class="nm">${esc(x.p.name)}</div><div class="mt">${x.n} حركة${x.p.note?' · '+esc(x.p.note):''}</div></div>
    <div class="bal"><b class="${x.b>0.5?'pos':x.b<-0.5?'neg':'zero'}">${fmt(Math.abs(x.b))}</b><small>${x.b>0.5?'ليك عنده':x.b<-0.5?'عليك له':'خالص'}</small></div></div>`).join('')
    :`<div class="empty">${parties().length?'مفيش حد هنا':'لسه مفيش حد مسجّل.<br>اضغط «＋ حركة» وسجّل أول دين ليك أو عليك.'}</div>`}</div>
  <div class="fabwrap"><button class="fab sec" onclick="xferSheet()">⇄ تحويل</button><button class="fab" onclick="mvSheet(null)">＋ حركة</button></div>`;
}
function openParty(id){VIEW.page='party';VIEW.pid=id;render();window.scrollTo(0,0)}
function goHome(){VIEW.page='home';VIEW.pid=null;render()}
function renderParty(){
  const p=DOCS[VIEW.pid],L=moves(p.id).sort((a,b)=>(a.date||'')<(b.date||'')?-1:(a.date||'')>(b.date||'')?1:(a.u||0)-(b.u||0));
  let run=0;const rows=L.map(m=>{run+=KINDS[m.kind].sign*(+m.amount||0);return {m,run}}).reverse();
  const b=balanceOf(p.id),od=openDues(p.id).filter(o=>o.m.due);
  $('#app').innerHTML=headHtml()+`<div class="st-head"><button class="back" onclick="goHome()">→ رجوع</button></div>
  <div class="st-card"><div class="nm">${p.kind==='شركة'?'🏢':'👤'} ${esc(p.name)}</div><div class="kd">${esc(p.kind||'شخص')}${p.phone?' · 📞 '+esc(p.phone):''}${p.note?' · '+esc(p.note):''}</div>
    <div class="bal ${b>0.5?'pos':b<-0.5?'neg':'zero'}">${fmt(Math.abs(b))} ج</div><div class="bl">${b>0.5?'ليك عنده':b<-0.5?'عليك له':'الحساب خالص ✅'}</div>
    ${od.length?`<div style="margin-top:10px;font-size:13px;line-height:1.9">${od.map(o=>{const s=dueState(o.m.due);return `⏰ ${o.m.kind==='lend'?'ليك':'عليك'} ${fmt(o.rem)} — <span class="${s.c}">${s.t}</span>`}).join('<br>')}</div>`:''}</div>
  <div class="st-acts"><button class="g" onclick="mvSheet('lend')">⬆️ دين ليك عنده</button><button class="r" onclick="mvSheet('borrow')">⬇️ دين عليك له</button>
    <button class="g" onclick="mvSheet('recv')">💵 استلمت منه</button><button class="r" onclick="mvSheet('pay')">💸 دفعتله</button></div>
  <div class="st-more"><button onclick="waStatement()">📲 واتساب</button><button onclick="printStatement()">🖨️ PDF</button><button onclick="partySheet('${p.id}')">✏️ البيانات</button></div>
  ${rows.length?rows.map(({m,run})=>{const K=KINDS[m.kind],s=m.due&&(m.kind==='lend'||m.kind==='borrow')?dueState(m.due):null;
    return `<div class="mv"><div class="t"><div class="k">${K.ic} ${K.t}${s?` <span class="pill ${s.c} ${s.c}">⏰ ${s.t}</span>`:''}</div><div class="a ${K.sign>0?'pos':'neg'}">${K.sign>0?'+':'−'}${fmt(m.amount)}</div></div>
      <div class="m"><span>${arDate(m.date)}${m.method?' · '+esc(m.method):''}</span><span class="rb ${run>0.5?'pos':run<-0.5?'neg':'zero'}">الرصيد: ${fmt(Math.abs(run))} ${run>0.5?'ليك':run<-0.5?'عليك':''}</span></div>
      ${m.note?`<div class="n">${esc(m.note)}</div>`:''}<div class="mvx"><button onclick="mvSheet(null,'${m.id}')">✏️ تعديل</button><button onclick="delMove('${m.id}')">🗑 حذف</button></div></div>`}).join('')
    :'<div class="empty">مفيش حركات لسه</div>'}`;
}
function delMove(id){if(!confirm('حذف الحركة دي؟'))return;del(id);render();toast('اتحذفت')}

/* ---------- إضافة / تعديل حركة ---------- */
let MV=null;
function mvSheet(kind,editId){
  const e=editId?DOCS[editId]:null;
  MV={id:e?e.id:null,kind:e?e.kind:(kind||'lend'),party:e?e.party:(VIEW.page==='party'?VIEW.pid:''),dueOn:!!(e&&e.due)};
  const P=parties().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const kb=k=>`<button class="${KINDS[k].sign>0?'g':'r'} ${MV.kind===k?'on':''}" data-k="${k}">${KINDS[k].ic} ${KINDS[k].t}<br><small style="font-weight:500;opacity:.8">${KINDS[k].s}</small></button>`;
  $('#mvSheet').innerHTML=`<h2>${e?'✏️ تعديل حركة':'＋ حركة جديدة'}</h2>
   <div class="field"><label>مع مين؟</label><input id="m_party" list="m_pl" placeholder="اكتب الاسم — لو جديد هيتضاف" value="${esc(MV.party&&DOCS[MV.party]?DOCS[MV.party].name:'')}" autocomplete="off"><datalist id="m_pl">${P.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div>
   <div class="field" id="m_kindNew" style="display:none"><label>ده شخص ولا شركة؟</label><div class="seg"><button class="on" data-pk="شخص">👤 شخص</button><button data-pk="شركة">🏢 شركة</button></div></div>
   <div class="field"><label>نوع الحركة</label><div class="seg" id="m_kinds">${kb('lend')}${kb('borrow')}${kb('recv')}${kb('pay')}</div></div>
   <div class="row2"><div class="field"><label>المبلغ</label><input id="m_amount" inputmode="decimal" placeholder="0" value="${e?e.amount:''}"></div>
     <div class="field"><label>التاريخ</label><input id="m_date" type="date" value="${e?e.date:today()}"></div></div>
   <div class="field" id="m_dueBox"><label>ميعاد السداد (اختياري)</label><input id="m_due" type="date" value="${e&&e.due?e.due:''}">
     <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${[['أسبوع',7],['شهر',30],['3 شهور',90]].map(x=>`<button type="button" class="tab" onclick="document.getElementById('m_due').value=addDays(document.getElementById('m_date').value||today(),${x[1]})">بعد ${x[0]}</button>`).join('')}</div></div>
   <div class="field" id="m_methBox"><label>طريقة الدفع</label><select id="m_method"><option value="">—</option>${METHODS.map(x=>`<option ${e&&e.method===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>ملاحظة</label><textarea id="m_note" placeholder="السبب / التفاصيل">${esc(e?e.note:'')}</textarea></div>
   <div class="hint" id="m_hint"></div>
   <button class="save" id="m_save">💾 حفظ</button><button class="cancel" onclick="closeOv('mvOv')">إلغاء</button>`;
  const upd=()=>{$$('#m_kinds button').forEach(b=>b.classList.toggle('on',b.dataset.k===MV.kind));const debt=MV.kind==='lend'||MV.kind==='borrow';
    $('#m_dueBox').style.display=debt?'':'none';
    const nm=$('#m_party').value.trim(),ex=parties().find(p=>p.name===nm);$('#m_kindNew').style.display=nm&&!ex?'':'none';
    if(ex){const b=balanceOf(ex.id);$('#m_hint').textContent='رصيده دلوقتي: '+(Math.abs(b)<=0.5?'خالص':fmt(Math.abs(b))+(b>0?' ليك عنده':' عليك له'))}else $('#m_hint').textContent=''};
  $$('#m_kinds button').forEach(b=>b.onclick=()=>{MV.kind=b.dataset.k;upd()});
  $$('#m_kindNew button').forEach(b=>b.onclick=()=>{$$('#m_kindNew button').forEach(x=>x.classList.toggle('on',x===b))});
  $('#m_party').oninput=upd;upd();
  $('#m_save').onclick=()=>{
    const nm=$('#m_party').value.trim(),amt=parseFloat(toEn($('#m_amount').value));
    if(!nm){toast('اكتب الاسم');return}if(!amt||amt<=0){toast('اكتب مبلغ صحيح');return}
    let p=parties().find(x=>x.name===nm);
    if(!p){const kd=($$('#m_kindNew button.on')[0]||{}).dataset;p={id:'p_'+uid(),t:'party',name:nm,kind:kd?kd.pk:'شخص',phone:'',note:''};put(p)}
    const debt=MV.kind==='lend'||MV.kind==='borrow';
    const d=Object.assign(e?Object.assign({},e):{id:'m_'+uid(),t:'mv'},{party:p.id,kind:MV.kind,amount:amt,date:$('#m_date').value||today(),due:debt?$('#m_due').value:'',method:$('#m_method').value,note:$('#m_note').value.trim()});
    put(d);closeOv('mvOv');VIEW.page='party';VIEW.pid=p.id;render();toast('اتسجلت ✓');
  };
  openOv('mvOv');
}
/* ---------- تحويل: استلمت من حد وسددت بيه لحد ---------- */
function xferSheet(){
  const P=parties().map(p=>({p,b:balanceOf(p.id)}));const lik=P.filter(x=>x.b>0.5),al=P.filter(x=>x.b<-0.5);
  if(!lik.length||!al.length){toast('محتاج حد ليك عنده وحد عليك له');return}
  $('#mvSheet').innerHTML=`<h2>⇄ تحويل</h2><div class="hint">فلوس استلمتها من حد وسددت بيها لحد تاني — بتتسجل حركتين.</div>
   <div class="field"><label>استلمت من</label><select id="x_from">${lik.map(x=>`<option value="${x.p.id}">${esc(x.p.name)} — ليك ${fmt(x.b)}</option>`).join('')}</select></div>
   <div class="field"><label>ودفعت لـ</label><select id="x_to">${al.map(x=>`<option value="${x.p.id}">${esc(x.p.name)} — عليك ${fmt(-x.b)}</option>`).join('')}</select></div>
   <div class="row2"><div class="field"><label>المبلغ</label><input id="x_amt" inputmode="decimal" placeholder="0"></div><div class="field"><label>التاريخ</label><input id="x_date" type="date" value="${today()}"></div></div>
   <button class="save" id="x_save">تأكيد</button><button class="cancel" onclick="closeOv('mvOv')">إلغاء</button>`;
  $('#x_save').onclick=()=>{const a=parseFloat(toEn($('#x_amt').value));if(!a||a<=0){toast('اكتب مبلغ');return}
    const f=DOCS[$('#x_from').value],t=DOCS[$('#x_to').value],dt=$('#x_date').value||today();
    put({id:'m_'+uid(),t:'mv',party:f.id,kind:'recv',amount:a,date:dt,due:'',method:'تحويل',note:'تحويل — اتدفع لـ '+t.name});
    put({id:'m_'+uid(),t:'mv',party:t.id,kind:'pay',amount:a,date:dt,due:'',method:'تحويل',note:'تحويل — من فلوس '+f.name});
    closeOv('mvOv');render();toast('اتسجل التحويل ✓')};
  openOv('mvOv');
}
/* ---------- بيانات الطرف ---------- */
function partySheet(id){
  const p=DOCS[id];
  $('#pSheet').innerHTML=`<h2>✏️ ${esc(p.name)}</h2>
   <div class="field"><label>الاسم</label><input id="p_name" value="${esc(p.name)}"></div>
   <div class="field"><label>النوع</label><div class="seg" id="p_kind"><button data-k="شخص" class="${(p.kind||'شخص')==='شخص'?'on':''}">👤 شخص</button><button data-k="شركة" class="${p.kind==='شركة'?'on':''}">🏢 شركة</button></div></div>
   <div class="field"><label>رقم الموبايل (للواتساب)</label><input id="p_phone" inputmode="tel" value="${esc(p.phone||'')}" placeholder="01xxxxxxxxx"></div>
   <div class="field"><label>ملاحظة</label><input id="p_note" value="${esc(p.note||'')}"></div>
   <button class="save" id="p_save">💾 حفظ</button>
   <button class="cancel" id="p_del" style="color:var(--red)">🗑 حذف ${esc(p.name)} وكل حركاته</button>`;
  $$('#p_kind button').forEach(b=>b.onclick=()=>$$('#p_kind button').forEach(x=>x.classList.toggle('on',x===b)));
  $('#p_save').onclick=()=>{const n=$('#p_name').value.trim();if(!n){toast('اكتب الاسم');return}
    put(Object.assign({},p,{name:n,kind:$$('#p_kind button.on')[0].dataset.k,phone:$('#p_phone').value.trim(),note:$('#p_note').value.trim()}));closeOv('pOv');render();toast('اتحفظ ✓')};
  $('#p_del').onclick=()=>{if(!confirm('حذف '+p.name+' وكل حركاته؟'))return;moves(p.id).forEach(m=>del(m.id));del(p.id);closeOv('pOv');goHome();toast('اتحذف')};
  openOv('pOv');
}
/* ---------- واتساب و PDF ---------- */
function statementText(p){
  const L=moves(p.id).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1),b=balanceOf(p.id);
  let t='🧾 كشف حساب '+p.name+'\n';let run=0;
  L.forEach(m=>{run+=KINDS[m.kind].sign*(+m.amount||0);t+='\n• '+m.date+' | '+KINDS[m.kind].t+' | '+fmt(m.amount)+(m.note?' | '+m.note:'')});
  t+='\n\n💰 الرصيد: '+(Math.abs(b)<=0.5?'خالص ✅':fmt(Math.abs(b))+' ج '+(b>0?'ليّا عندك':'ليك عندي'));
  const od=openDues(p.id).filter(o=>o.m.due);if(od.length)t+='\n⏰ '+od.map(o=>fmt(o.rem)+' ميعادها '+o.m.due).join(' · ');
  return t;
}
function waStatement(){const p=DOCS[VIEW.pid];let ph=(p.phone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='2'+ph;
  const u='https://wa.me/'+ph+'?text='+encodeURIComponent(statementText(p));window.open(u,'_blank')||(location.href=u)}
function printStatement(){
  const p=DOCS[VIEW.pid],L=moves(p.id).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1),b=balanceOf(p.id);let run=0;
  const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف ${esc(p.name)}</title><style>@page{size:A4;margin:12mm}body{font-family:Tahoma,Arial;font-size:12.5px;color:#111}h1{font-size:19px;margin:0 0 4px}
   table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #bbb;padding:6px;text-align:right}th{background:#eef2ff;-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}.g{color:#047857}.r{color:#b91c1c}.b{font-size:16px;font-weight:800;margin-top:12px}</style></head><body>
   <h1>🧾 كشف حساب ${esc(p.name)}</h1><div>${esc(p.kind||'شخص')} · طُبع ${today()}</div>
   <table><tr><th>التاريخ</th><th>الحركة</th><th>مدين (ليّا)</th><th>دائن (عليّا)</th><th>الرصيد</th><th>ملاحظة</th></tr>
   ${L.map(m=>{const s=KINDS[m.kind].sign;run+=s*(+m.amount||0);return `<tr><td>${m.date}</td><td>${KINDS[m.kind].t}</td><td class="g">${s>0?fmt(m.amount):''}</td><td class="r">${s<0?fmt(m.amount):''}</td><td>${fmt(Math.abs(run))} ${run>0.5?'ليّا':run<-0.5?'عليّا':''}</td><td>${esc(m.note||'')}</td></tr>`}).join('')}</table>
   <div class="b">الرصيد النهائي: ${Math.abs(b)<=0.5?'خالص':fmt(Math.abs(b))+' ج '+(b>0?'ليّا عنده':'عليّا له')}</div></body></html>`;
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';document.body.appendChild(fr);
  const d=fr.contentWindow.document;d.open();d.write(html);d.close();setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){}setTimeout(()=>fr.remove(),60000)},400);
}
/* ---------- نسخ احتياطي ---------- */
function moreMenu(){
  $('#pSheet').innerHTML=`<h2>⋯ البيانات</h2>
   <button class="save" onclick="exportData()" style="margin-bottom:8px">⬇️ تنزيل نسخة احتياطية</button>
   <button class="save" style="background:var(--card2);border:1px solid var(--line)" onclick="document.getElementById('impF').click()">⬆️ استرجاع نسخة</button>
   <input id="impF" type="file" accept=".json" style="display:none" onchange="importData(this)">
   <div class="hint" style="margin-top:12px">البيانات بتتحفظ على الجهاز وبتتزامن مع السحابة لكل أجهزتك. النسخة القديمة من الدفتر (لو كانت على الجهاز ده) اتنقلت هنا أوتوماتيك.</div>
   <button class="cancel" onclick="closeOv('pOv')">قفل</button>`;openOv('pOv');
}
function exportData(){const blob=new Blob([JSON.stringify({app:'debtbook',v:2,docs:DOCS},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='دفتر-الفلوس-'+today()+'.json';document.body.appendChild(a);a.click();a.remove()}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
  if(Array.isArray(j)){lsSet(LS_OLD,JSON.stringify(j));localStorage.removeItem(LS_MIG);migrateOld()}
  else if(j&&j.docs){Object.values(j.docs).forEach(d=>{if(d&&d.id&&(!DOCS[d.id]||(d.u||0)>(DOCS[d.id].u||0))){DOCS[d.id]=d;cloudPut(d)}});persist()}
  else throw new Error('ملف مش صحيح');closeOv('pOv');render();toast('اترجعت ✓')}catch(e){alert('الملف مش صالح: '+e.message)}inp.value=''};r.readAsText(f)}
function openOv(id){$('#'+id).classList.add('show')}
function closeOv(id){$('#'+id).classList.remove('show')}
$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('show')}));

/* ---------- تشغيل ---------- */
try{migrateOld()}catch(e){console.error(e)}
render();setSync('wait');cloudInit();
</script>
</body>
</html>
