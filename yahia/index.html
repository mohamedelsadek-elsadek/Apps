<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم يحيى — منصة يحيى التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe6ff;--sky2:#e9f7ff;--sand:#ffe2a8;--ink:#2b2340;--soft:#6b6385;--card:#fff;--orange:#ff9f2e;--purple:#8a5cf6;--green:#2fb36d;--red:#ef4f5f;--yellow:#ffd23f;--shadow:0 6px 0 rgba(43,35,64,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--sand) 100%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{font-weight:800;font-size:24px;display:flex;align-items:center;gap:8px;background:none;padding:0}
.pills{display:flex;gap:6px}
.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:var(--shadow);font-size:17px;white-space:nowrap}
.back{background:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
.crumb{font-family:Cairo;color:var(--soft);font-size:14px;margin:0 0 6px}
h1{font-size:28px;margin:6px 0 4px} h2{font-size:23px;margin:4px 0 10px}
.sub{color:var(--soft);font-family:Cairo;font-size:15px;margin:0 0 14px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.note{font-family:Cairo;font-size:14px;color:var(--soft)}
#view{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* subjects */
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub-t{border-radius:26px;padding:16px 12px;color:#fff;text-align:right;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.sub-t .i{font-size:44px;line-height:1}
.sub-t b{font-size:22px}
.sub-t small{font-family:Cairo;font-size:13px;opacity:.9}
.sub-t.soon{filter:grayscale(.5);opacity:.6}
/* map */
.block{margin-bottom:18px}
.block>h2{display:flex;align-items:center;gap:8px}
.unit{background:linear-gradient(180deg,#9be08a,#5fbf5a);border-radius:28px;padding:14px;box-shadow:var(--shadow)}
.unit h3{margin:0 0 10px;color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.path{display:grid;gap:12px}
.stop{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border-radius:22px;padding:12px;box-shadow:var(--shadow);text-align:right;width:100%;font-size:18px}
.stop:nth-child(even){width:calc(100% - 28px);margin-right:28px}
.stop .ico{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:var(--sand);flex:none}
.stop b{display:block;font-size:20px} .stop small{font-family:Cairo;color:var(--soft);font-size:13px}
.stop .st{margin-inline-start:auto;font-size:22px}
.stop.lock{opacity:.55;filter:grayscale(.6)} .stop.done .ico{background:#c9f5c0}
.farm{margin-top:14px;background:#fff7e0;border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.farm .row{font-size:28px;letter-spacing:3px;word-break:break-all}
.farm .row.empty{font-size:15px;letter-spacing:0;font-family:Cairo;color:var(--soft)}
/* story */
.scene{font-size:70px;text-align:center;height:105px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.txt{font-family:Cairo;font-size:22px;line-height:2.1;font-weight:700}
.txt .w{border-radius:8px;padding:0 2px;transition:background .2s}
.txt .w.hl{background:var(--yellow)}
.txt .w.key{color:var(--purple);text-decoration:underline dotted 2px;cursor:pointer}
.row2{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.btn{background:var(--orange);color:#fff;font-weight:800;font-size:19px;border-radius:18px;padding:10px 18px;box-shadow:0 5px 0 #c7741a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c7741a}
.btn.g{background:var(--green);box-shadow:0 5px 0 #1d8a50} .btn.p{background:var(--purple);box-shadow:0 5px 0 #6337d0}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8d2e8} .btn.big{font-size:22px;padding:14px 22px;width:100%}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#d8d2e8} .dots i.on{background:var(--orange);width:24px;border-radius:6px}
/* cards */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{perspective:800px;height:150px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;text-align:center;padding:8px;box-shadow:var(--shadow)}
.flip .f{background:#fff} .flip .f .e{font-size:40px;line-height:1} .flip .f b{font-size:23px}
.flip .b{transform:rotateY(180deg);background:#fff2c4;font-family:Cairo;font-size:16px;font-weight:700}
.tag{display:inline-block;border-radius:10px;padding:0 8px;color:#fff;font-size:13px;margin:4px 0}
.tag.syn{background:var(--green)} .tag.ant{background:var(--red)} .tag.mean{background:var(--purple)}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:86px;border-radius:18px;font-size:21px;font-weight:800;box-shadow:var(--shadow);background:linear-gradient(135deg,#8a5cf6,#ff6fa5);color:#fff;transition:transform .2s}
.mc.open{background:#fff;color:var(--ink)} .mc.ok{background:#c9f5c0;color:var(--ink);transform:scale(.94)}
/* sort games */
.hud{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:8px}
.skybox{position:relative;height:210px;border-radius:24px;background:linear-gradient(180deg,#8fd3ff,#d9f2ff);overflow:hidden;box-shadow:var(--shadow)}
.cloud{position:absolute;font-size:40px;opacity:.9;animation:drift 18s linear infinite}
@keyframes drift{from{right:-60px}to{right:110%}}
.bird{position:absolute;top:36px;right:-170px;display:flex;flex-direction:column;align-items:center}
.bird .b1{font-size:56px;animation:flap .35s infinite alternate}
@keyframes flap{to{transform:translateY(-6px) rotate(6deg)}}
.bird .word{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:2px 14px;font-size:26px;font-weight:800;margin-top:-4px;white-space:nowrap}
.bigword{font-size:40px;font-weight:800;text-align:center;background:#fff;border-radius:24px;padding:22px 10px;box-shadow:var(--shadow)}
.bigword .al{color:var(--orange)}
.homes{display:grid;gap:10px;margin-top:12px}
.home{border-radius:22px;padding:10px 6px;font-size:20px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.home span{display:block;font-size:38px;line-height:1.2}
.home.noun{background:linear-gradient(180deg,#ffb347,#ff8a00)} .home.verb{background:linear-gradient(180deg,#7b8cff,#5b4de0)}
.home.sun{background:linear-gradient(180deg,#ffd23f,#ff9f2e);color:var(--ink)} .home.moon{background:linear-gradient(180deg,#5b6bbf,#2b2f6b)}
.hint{font-family:Cairo;font-size:15px;color:var(--soft);text-align:center;margin-top:8px;min-height:24px}
.shake{animation:shake .4s} @keyframes shake{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0) scale(.6);opacity:0;font-size:64px;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* quiz */
.eggs{display:flex;gap:4px;justify-content:center;font-size:24px;margin:6px 0 12px;flex-wrap:wrap}
.eggs span.hatch{animation:hatch .7s} @keyframes hatch{30%{transform:rotate(-15deg)}60%{transform:rotate(15deg) scale(1.3)}}
.q{font-size:23px;font-weight:800;margin-bottom:12px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:12px;font-size:21px;font-weight:700;box-shadow:0 5px 0 #d8d2e8;text-align:right;border:2px solid #f0edf7}
.opt.ok{background:#c9f5c0;box-shadow:0 5px 0 #7fcf72} .opt.no{background:#ffd0d5;box-shadow:0 5px 0 #f28b96}
.anim{font-size:54px;text-align:center}
table{width:100%;border-collapse:collapse;font-family:Cairo;font-size:15px} td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}
.bar{height:10px;border-radius:6px;background:#eee;overflow:hidden} .bar i{display:block;height:100%;background:var(--green)}
.end{text-align:center} .end .bigico{font-size:80px}
.confetti{position:fixed;top:-20px;font-size:26px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:8}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.err{background:#ffd0d5;border-radius:16px;padding:12px;font-family:Cairo}
.brand{white-space:nowrap}.pill{white-space:nowrap}
@media(max-width:430px){.brand span{display:none}.pill{font-size:15px;padding:4px 9px}}
.vbox{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:8px}.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.stop.vid{background:#ffe9e9}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="brand" onclick="route('home')">🌍 <span>عالم يحيى</span></button>
    <div class="pills"><button class="pill" id="kidPill" onclick="route('kids')"></button><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🐥 <b id="eggsN">0</b></span><span class="pill" id="cloud" title="المزامنة مع بابا">⏳</span></div>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== عالم يحيى — المحرّك =====================
   البيانات: data/manifest.json (مواد ← بلوكات ← وحدات ← دروس)
   كل درس: lessons/<id>.json فيه activities بالأنواع: story · cards · match · sort(bird|card) · quiz
   الصوت: audio/<lessonId>/<key>.mp3 لو موجود في lesson.audio، وإلا صوت الجهاز. */
const $=id=>document.getElementById(id);
let M=null, L=null, LID=null, ACT=null, AIDX=0;
/* ---------- اللاعبين (كل طفل ليه مساره) ---------- */
const BLANK=()=>({stars:0,eggs:0,done:{},miss:[]});
const AVATARS=["🦁","🐯","🐼","🦊","🐰","🐻","🦄","🐸","🐧","🦋","🐬","🐥"];
let KIDS={}, KID=null, S=BLANK();
try{KIDS=JSON.parse(localStorage.getItem("yw-kids")||"{}")||{}}catch(e){}
try{KID=localStorage.getItem("yw-kid")}catch(e){}
/* ترحيل التقدّم القديم (قبل الملفات الشخصية) ليحيى */
try{ if(!Object.keys(KIDS).length){ KIDS={yahia:{id:"yahia",name:"يحيى",emoji:"🦁",u:1}}; const old=localStorage.getItem("yahia-world"); if(old) localStorage.setItem("yw-state:yahia",old); localStorage.setItem("yw-kids",JSON.stringify(KIDS)); } }catch(e){}
const kid=()=>KIDS[KID]||{name:"",emoji:"🦁"};
const liveKids=()=>Object.values(KIDS).filter(k=>k&&!k.del).sort((a,b)=>(a.c||0)-(b.c||0));
function loadKidLocal(id){ let st=BLANK(); try{const x=JSON.parse(localStorage.getItem("yw-state:"+id)||"null"); if(x) st=Object.assign(st,x)}catch(e){} return st; }
function save(local){try{localStorage.setItem("yw-state:"+KID,JSON.stringify(S))}catch(e){} $("stars").textContent=S.stars; $("eggsN").textContent=S.eggs; if(!local) pushSync();}
/* ---------- المزامنة (Firebase — نفس قاعدة برامج محمد) ---------- */
const FB={apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",authDomain:"my-app-sync-11ad9.firebaseapp.com",databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-app-sync-11ad9",appId:"1:177039534756:web:367ecccc684c2cdfdd1431"};
let DB=null, REF=null, SYNC="off", pushT=null;
function mergeInto(T,r){ if(!r) return false; let ch=false;
  for(const lid in (r.done||{})){ T.done[lid]=T.done[lid]||{}; for(const i in r.done[lid]) if(!T.done[lid][i]){T.done[lid][i]=true;ch=true} }
  if((r.stars||0)>T.stars){T.stars=r.stars;ch=true} if((r.eggs||0)>T.eggs){T.eggs=r.eggs;ch=true}
  const seen=new Set(T.miss.map(m=>m.t)); (r.miss||[]).forEach(m=>{if(m&&!seen.has(m.t)){T.miss.push(m);ch=true}}); T.miss.sort((a,b)=>a.t-b.t); if(T.miss.length>80)T.miss=T.miss.slice(-80);
  return ch; }
function pushSync(){ if(!REF) return; clearTimeout(pushT); const r=REF, snap=Object.assign({},S,{u:Date.now()}); pushT=setTimeout(()=>{ try{ r.set(snap).then(()=>{SYNC="on"}).catch(()=>{SYNC="err"}) }catch(e){} },1200); }
/* ---------- فيديوهات الدروس (بابا بيختارها) ---------- */
let VIDS={}; try{VIDS=JSON.parse(localStorage.getItem("yw-vids")||"{}")||{}}catch(e){}
function ytId(s){s=String(s||"").trim();const m=s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);return m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(s)?s:"")}
function lessonVid(id){const v=VIDS[id];return v&&v.id&&!v.del?v.id:""}
function setVid(lid,raw){const id=raw?ytId(raw):"";if(raw&&!id)return false;VIDS[lid]={id,del:!id,u:Date.now()};try{localStorage.setItem("yw-vids",JSON.stringify(VIDS))}catch(e){} if(DB)try{DB.ref("yahia_world/videos/"+lid).set(VIDS[lid])}catch(e){} return true}
function saveKids(){ try{localStorage.setItem("yw-kids",JSON.stringify(KIDS))}catch(e){} if(DB) try{DB.ref("yahia_world/kids_meta").set(KIDS)}catch(e){} }
function initSync(){ try{ if(!window.firebase) return; const app=firebase.apps.length?firebase.app():firebase.initializeApp(FB);
  DB=firebase.database(app);
  DB.ref("yahia_world/kids_meta").on("value",snap=>{ const r=snap.val()||{}; let ch=false, push=false;
    for(const id in r){ const k=r[id]; if(!KIDS[id]||(k.u||0)>(KIDS[id].u||0)){KIDS[id]=k;ch=true} }
    for(const id in KIDS) if(!r[id]||(KIDS[id].u||0)>(r[id].u||0)) push=true;
    if(ch){ try{localStorage.setItem("yw-kids",JSON.stringify(KIDS))}catch(e){} const v=$("view"); if(v&&(v.dataset.r==="kids"||v.dataset.r==="parent")) refreshView(); }
    if(push) saveKids(); });
  DB.ref("yahia_world/videos").on("value",snap=>{const r=snap.val()||{};let ch=false;for(const id in r){if(!VIDS[id]||(r[id].u||0)>(VIDS[id].u||0)){VIDS[id]=r[id];ch=true}} for(const id in VIDS) if(!r[id]||(VIDS[id].u||0)>(r[id].u||0)) try{DB.ref("yahia_world/videos/"+id).set(VIDS[id])}catch(e){}
    if(ch){try{localStorage.setItem("yw-vids",JSON.stringify(VIDS))}catch(e){} const v=$("view"); if(v&&v.dataset.r==="lesson"&&LID&&r[LID]) viewLesson(LID);} });
  /* ترحيل الحالة القديمة yahia_world/state ليحيى مرة واحدة */
  DB.ref("yahia_world/state").once("value",snap=>{ const r=snap.val(); if(!r) return; DB.ref("yahia_world/kids/yahia/state").transaction(cur=>{ const T=Object.assign(BLANK(),cur||{}); mergeInto(T,r); T.u=Date.now(); return T; }).then(()=>DB.ref("yahia_world/state").remove()).catch(()=>{}); });
  if(KID) attachKid(KID);
 }catch(e){SYNC="err"} }
function attachKid(id){ if(!DB) return; if(REF) REF.off(); REF=DB.ref("yahia_world/kids/"+id+"/state");
  REF.on("value",snap=>{ if(KID!==id) return; SYNC="on"; const r=snap.val(); const ch=mergeInto(S,r); save(true);
    if(ch||!r) pushSync(); if(ch) refreshView(); },()=>{SYNC="err"}); }
function useKid(id){ KID=id; try{localStorage.setItem("yw-kid",id)}catch(e){} S=loadKidLocal(id); save(true); attachKid(id); $("kidPill").textContent=kid().emoji+" "+kid().name; route("home"); }
function setCloud(){const c=$("cloud");if(c)c.textContent=SYNC==="on"?"☁️":(!window.firebase||SYNC==="err")?"⚠️":"⏳"}
setInterval(setCloud,1500);
function refreshView(){ const v=$("view"); const r=v&&v.dataset.r; if(r==="home")viewHome(); else if(r==="parent")viewParent(PKID); else if(r==="kids")viewKids(); }
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const x=$("toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),650)}
function confetti(){const e=["🎉","⭐","🐥","🎈","✨"];for(let i=0;i<24;i++){const c=document.createElement("span");c.className="confetti";c.textContent=e[i%5];c.style.left=Math.random()*100+"vw";c.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),2400)}}
function miss(what){S.miss.push({l:L?L.title:"",a:ACT?ACT.title:"",what,t:Date.now()}); if(S.miss.length>80)S.miss.shift(); save();}

/* ---------- الصوت ---------- */
let arVoice=null,curAudio=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();arVoice=v.find(x=>/ar[-_]EG/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function stopVoice(){try{if(curAudio){curAudio.pause();curAudio=null}speechSynthesis.cancel()}catch(e){}}
function speak(text,key,onend,onmeta){
  stopVoice(); const src=key&&L&&L._blob&&L._blob[key];
  if(src){curAudio=new Audio(src);curAudio.onloadedmetadata=()=>onmeta&&onmeta(curAudio.duration);curAudio.onended=()=>onend&&onend();curAudio.play().catch(()=>sayTTS(text,onend));return}
  sayTTS(text,onend);
}
function sayTTS(text,onend){try{const u=new SpeechSynthesisUtterance(text);u.lang=arVoice?arVoice.lang:"ar-EG";if(arVoice)u.voice=arVoice;u.rate=.85;u.pitch=1.05;u.onend=()=>onend&&onend();speechSynthesis.speak(u)}catch(e){onend&&onend()}}

/* ---------- التحميل ---------- */
async function getJSON(p){const r=await fetch(p,{cache:"no-cache"}); if(!r.ok) throw new Error(p); return r.json()}
const LCACHE={};
async function loadLesson(id){
  if(LCACHE[id]) return LCACHE[id];
  const meta=findLesson(id); if(!meta||!meta.file) throw new Error("no lesson");
  const d=await getJSON(meta.file); LCACHE[id]=d; d._blob={};
  /* الصفحة مش بتشغّل ملفات صوت مباشرة — بنحمّلها blob الأول */
  Object.entries(d.audio||{}).forEach(([k,p])=>fetch(p).then(r=>r.ok?r.blob():null).then(b=>{if(b)d._blob[k]=URL.createObjectURL(b)}).catch(()=>{}));
  return d;
}
function findLesson(id){for(const s of M.subjects)for(const b of (s.blocks||[]))for(const u of b.units)for(const l of u.lessons) if(l.id===id) return Object.assign({},l,{subject:s,block:b,unit:u}); return null}
function lessonDone(id,T){const d=(T||S).done[id]||{}; return Object.keys(d).length}

/* ---------- التنقّل ---------- */
let stopGame=()=>{};
function route(r,arg){stopGame();stopGame=()=>{};stopVoice();window.scrollTo(0,0);const v=$("view");v.style.animation="none";v.offsetHeight;v.style.animation="";
  v.dataset.r=r; ({video:viewVideo,home:viewHome,subject:viewSubject,lesson:viewLesson,act:viewAct,parent:viewParent,kids:viewKids})[r](arg);}

function viewHome(){

/* ---------- sort (bird / card) ---------- */
function actSort(){
  const A=ACT; const Q=shuffle(A.items).slice(0,Math.min(10,A.items.length)); let i=0,score=0,hearts=3,lock=false,raf=null,x=0;
  const bins=`<div class="homes" style="grid-template-columns:repeat(${A.bins.length},1fr)">${A.bins.map(b=>`<button class="home ${b.cls}" data-b="${b.id}"><span>${b.ico}</span>${esc(b.label)}</button>`).join("")}</div>`;
  const bird=A.style==="bird";
  $("view").innerHTML=shell(`${A.help?`<div class="card note" style="font-size:15px">${A.help}</div>`:""}
   <div class="hud"><span id="hh">${bird?"❤️❤️❤️":"كلمة 1/"+Q.length}</span><span>✅ <b id="sc">0</b>/${Q.length}</span></div>
   ${bird?`<div class="skybox" id="sky"><span class="cloud" style="top:10px;animation-delay:-4s">☁️</span><span class="cloud" style="top:120px;animation-delay:-11s">☁️</span><div class="bird" id="bird"><span class="b1">🐦</span><span class="word" id="bw"></span></div></div>`:`<div class="bigword" id="bw"></div>`}
   ${bins}<div class="hint" id="hint">${esc(A.prompt)}</div>`);
  if(A.small){const e=$("bw");e.style.fontSize=bird?"19px":"25px";e.style.lineHeight="1.7";if(!bird)e.style.padding="18px 12px"}
  const binLabel=id=>{const b=A.bins.find(z=>z.id===id);return b.label+" "+b.ico};
  const stop=()=>{if(raf)cancelAnimationFrame(raf);raf=null}; stopGame=stop;
  const next=()=>{stop(); if(i>=Q.length)return finish(2,"برافو عليك!",`جبت ${score} من ${Q.length} صح.`,A.ico);
    lock=false; const w=Q[i][0];
    if(bird){$("bw").textContent=w;const W=$("sky").clientWidth;x=-170;const sp=Math.max(.7,1.3-i*.03)*(W/360);
      const step=()=>{x+=sp;$("bird").style.right=x+"px";if(x>W+20){wrong("طارت! ");return}raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
    else{$("hh").textContent=`كلمة ${i+1}/${Q.length}`;$("bw").innerHTML=(A.al?`<span class="al">${esc(w.slice(0,2))}</span>${esc(w.slice(2))}`:esc(w))+` <button class="back" style="font-size:20px" id="say">🔊</button>`;$("say").onclick=()=>speak(w)}
  };
  const wrong=pre=>{stop();lock=true;const [w,a]=Q[i];$(bird?"sky":"bw").classList.add("shake");setTimeout(()=>{const e=$(bird?"sky":"bw");e&&e.classList.remove("shake")},400);
    $("hint").textContent=`${pre}«${w}» ← ${binLabel(a)}. ${A.why?A.why[a]:""}`;miss(`${w} ← ${A.bins.find(z=>z.id===a).label}`);speak(w);i++;
    if(bird){hearts--;$("hh").textContent="❤️".repeat(Math.max(0,hearts))+"🤍".repeat(3-Math.max(0,hearts));
      if(hearts<=0){setTimeout(()=>{$("view").innerHTML=shell(`<div class="card end"><div class="bigico">🐣</div><h1>ولا يهمك! نجرب تاني؟</h1><p class="sub">جبت ${score} صح. ${esc(Object.values(A.why||{}).join(" · "))}</p><button class="btn g big" onclick="route('act',${AIDX})">العب تاني 🔁</button></div>`)},1000);return}}
    setTimeout(next,1300)};
  document.querySelectorAll(".home").forEach(b=>b.onclick=()=>{if(lock||!Q[i])return;const [w,a]=Q[i];
    if(b.dataset.b===a){lock=true;stop();score++;$("sc").textContent=score;toast(A.bins.find(z=>z.id===a).ico+"✅");$("hint").textContent=`صح! «${w}» ← ${binLabel(a)}. ${A.why?A.why[a]:""}`;speak(w);i++;setTimeout(next,1000)}
    else wrong("")});
  next();
}

  <td><input id="vi-${l.id}" placeholder="الصق لينك الفيديو" value="${v?"https://youtu.be/"+v:""}" style="width:100%;padding:6px;border-radius:8px;border:1px solid #ccc;font:inherit;direction:ltr">
  <div style="margin-top:4px"><button class="back" data-vl="${l.id}">حفظ</button> ${v?`<button class="back" data-vl="${l.id}" data-x="1">مسح</button>`:""} <span class="vst note"></span></div></td></tr>`)}))));return r.join("")}
