<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عالم يحيى — منصة يحيى التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe6ff;--sky2:#e9f7ff;--sand:#ffe2a8;--ink:#2b2340;--soft:#6b6385;--card:#fff;--orange:#ff9f2e;--purple:#8a5cf6;--green:#2fb36d;--red:#ef4f5f;--yellow:#ffd23f;--shadow:0 6px 0 rgba(43,35,64,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Baloo Bhaijaan 2','Cairo',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--sand) 100%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{font-weight:800;font-size:24px;display:flex;align-items:center;gap:8px;background:none;padding:0}
.pills{display:flex;gap:6px}
.pill{background:#fff;border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:var(--shadow);font-size:17px;white-space:nowrap}
.back{background:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
.crumb{font-family:Cairo;color:var(--soft);font-size:14px;margin:0 0 6px}
h1{font-size:28px;margin:6px 0 4px} h2{font-size:23px;margin:4px 0 10px}
.sub{color:var(--soft);font-family:Cairo;font-size:15px;margin:0 0 14px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.note{font-family:Cairo;font-size:14px;color:var(--soft)}
#view{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* subjects */
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub-t{border-radius:26px;padding:16px 12px;color:#fff;text-align:right;box-shadow:0 6px 0 rgba(0,0,0,.18);min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.sub-t .i{font-size:44px;line-height:1}
.sub-t b{font-size:22px}
.sub-t small{font-family:Cairo;font-size:13px;opacity:.9}
.sub-t.soon{filter:grayscale(.5);opacity:.6}
/* map */
.block{margin-bottom:18px}
.block>h2{display:flex;align-items:center;gap:8px}
.unit{background:linear-gradient(180deg,#9be08a,#5fbf5a);border-radius:28px;padding:14px;box-shadow:var(--shadow)}
.unit h3{margin:0 0 10px;color:#fff;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.path{display:grid;gap:12px}
.stop{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);border-radius:22px;padding:12px;box-shadow:var(--shadow);text-align:right;width:100%;font-size:18px}
.stop:nth-child(even){width:calc(100% - 28px);margin-right:28px}
.stop .ico{font-size:34px;width:56px;height:56px;display:grid;place-items:center;border-radius:18px;background:var(--sand);flex:none}
.stop b{display:block;font-size:20px} .stop small{font-family:Cairo;color:var(--soft);font-size:13px}
.stop .st{margin-inline-start:auto;font-size:22px}
.stop.lock{opacity:.55;filter:grayscale(.6)} .stop.done .ico{background:#c9f5c0}
.farm{margin-top:14px;background:#fff7e0;border-radius:22px;padding:12px;box-shadow:var(--shadow)}
.farm .row{font-size:28px;letter-spacing:3px;word-break:break-all}
.farm .row.empty{font-size:15px;letter-spacing:0;font-family:Cairo;color:var(--soft)}
/* story */
.scene{font-size:70px;text-align:center;height:105px;display:grid;place-items:center;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.txt{font-family:Cairo;font-size:22px;line-height:2.1;font-weight:700}
.txt .w{border-radius:8px;padding:0 2px;transition:background .2s}
.txt .w.hl{background:var(--yellow)}
.txt .w b.ph{color:#e2622b;font-weight:900}
.txt .w.key b.ph{color:#e2622b}
.txt .w.key{color:var(--purple);text-decoration:underline dotted 2px;cursor:pointer}
.row2{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.btn{background:var(--orange);color:#fff;font-weight:800;font-size:19px;border-radius:18px;padding:10px 18px;box-shadow:0 5px 0 #c7741a}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c7741a}
.btn.g{background:var(--green);box-shadow:0 5px 0 #1d8a50} .btn.p{background:var(--purple);box-shadow:0 5px 0 #6337d0}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d8d2e8} .btn.big{font-size:22px;padding:14px 22px;width:100%}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:10px;height:10px;border-radius:50%;background:#d8d2e8} .dots i.on{background:var(--orange);width:24px;border-radius:6px}
/* cards */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flip{perspective:800px;height:150px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:grid;place-items:center;text-align:center;padding:8px;box-shadow:var(--shadow)}
.flip .f{background:#fff} .flip .f .e{font-size:40px;line-height:1} .flip .f b{font-size:23px}
.flip .b{transform:rotateY(180deg);background:#fff2c4;font-family:Cairo;font-size:16px;font-weight:700}
.tag{display:inline-block;border-radius:10px;padding:0 8px;color:#fff;font-size:13px;margin:4px 0}
.tag.syn{background:var(--green)} .tag.ant{background:var(--red)} .tag.mean{background:var(--purple)}
/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{height:86px;border-radius:18px;font-size:21px;font-weight:800;box-shadow:var(--shadow);background:linear-gradient(135deg,#8a5cf6,#ff6fa5);color:#fff;transition:transform .2s}
.mc.open{background:#fff;color:var(--ink)} .mc.ok{background:#c9f5c0;color:var(--ink);transform:scale(.94)}
/* sort games */
.hud{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin-bottom:8px}
.skybox{position:relative;height:210px;border-radius:24px;background:linear-gradient(180deg,#8fd3ff,#d9f2ff);overflow:hidden;box-shadow:var(--shadow)}
.cloud{position:absolute;font-size:40px;opacity:.9;animation:drift 18s linear infinite}
@keyframes drift{from{right:-60px}to{right:110%}}
.bird{position:absolute;top:36px;right:-170px;display:flex;flex-direction:column;align-items:center}
.bird .b1{font-size:56px;animation:flap .35s infinite alternate}
@keyframes flap{to{transform:translateY(-6px) rotate(6deg)}}
.bird .word{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:2px 14px;font-size:26px;font-weight:800;margin-top:-4px;white-space:nowrap}
.bigword{font-size:40px;font-weight:800;text-align:center;background:#fff;border-radius:24px;padding:22px 10px;box-shadow:var(--shadow)}
.bigword .al{color:var(--orange)}
.homes{display:grid;gap:10px;margin-top:12px}
.home{border-radius:22px;padding:10px 4px;font-size:clamp(11px,3vw,20px);font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);line-height:1.15;min-width:0;overflow-wrap:break-word}
.home span{display:block;font-size:38px;line-height:1.2}
.home.noun{background:linear-gradient(180deg,#ffb347,#ff8a00)} .home.verb{background:linear-gradient(180deg,#7b8cff,#5b4de0)}
.home.sun{background:linear-gradient(180deg,#ffd23f,#ff9f2e);color:var(--ink)} .home.moon{background:linear-gradient(180deg,#5b6bbf,#2b2f6b)}
.hint{font-family:Cairo;font-size:15px;color:var(--soft);text-align:center;margin-top:8px;min-height:24px}
.shake{animation:shake .4s} @keyframes shake{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,0) scale(.6);opacity:0;font-size:64px;pointer-events:none;transition:.25s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
/* quiz */
.eggs{display:flex;gap:4px;justify-content:center;font-size:24px;margin:6px 0 12px;flex-wrap:wrap}
.eggs span.hatch{animation:hatch .7s} @keyframes hatch{30%{transform:rotate(-15deg)}60%{transform:rotate(15deg) scale(1.3)}}
.q{font-size:23px;font-weight:800;margin-bottom:12px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{background:#fff;border-radius:18px;padding:12px;font-size:21px;font-weight:700;box-shadow:0 5px 0 #d8d2e8;text-align:right;border:2px solid #f0edf7}
.opt.ok{background:#c9f5c0;box-shadow:0 5px 0 #7fcf72} .opt.no{background:#ffd0d5;box-shadow:0 5px 0 #f28b96}
.anim{font-size:54px;text-align:center}
table{width:100%;border-collapse:collapse;font-family:Cairo;font-size:15px} td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}
.bar{height:10px;border-radius:6px;background:#eee;overflow:hidden} .bar i{display:block;height:100%;background:var(--green)}
.end{text-align:center} .end .bigico{font-size:80px}
.confetti{position:fixed;top:-20px;font-size:26px;animation:fall 1.6s linear forwards;pointer-events:none;z-index:8}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.err{background:#ffd0d5;border-radius:16px;padding:12px;font-family:Cairo}
.brand{white-space:nowrap}.pill{white-space:nowrap}
@media(max-width:430px){.brand span{display:none}.pill{font-size:15px;padding:4px 9px}}
.vbox{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin-bottom:8px}.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.stop.vid{background:#ffe9e9}
#view.en .txt,#view.en .q,#view.en .opt,#view.en .sub,#view.en .note,#view.en .crumb,#view.en .stop small,#view.en .hint{font-family:'Nunito','Baloo Bhaijaan 2',system-ui,sans-serif}
#view.en .txt{font-size:21px;line-height:1.7}
#view.en .opt,#view.en .stop,#view.en .q,#view.en .txt,#view.en .labneed,#view.en .hint,#view.en h1,#view.en h2{text-align:left}#view.en .labneed{font-family:Nunito,system-ui,sans-serif}#view.en .stop b{font-family:Nunito,'Baloo Bhaijaan 2',system-ui,sans-serif}
.labneed{font-family:Cairo;font-size:17px;margin:4px 0 10px;padding-inline-start:22px}
.passage p{font-family:Cairo,serif;font-size:19px;line-height:2;margin:6px 0}.passage .pn{display:inline-block;background:#8a5cf6;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:14px}
.wplan{display:flex;gap:10px;align-items:flex-start;background:#f6f3ff;border-radius:12px;padding:8px 10px;margin:6px 0;font-family:Cairo;font-size:16px}.wplan>b{background:#8a5cf6;color:#fff;border-radius:50%;min-width:26px;height:26px;text-align:center;line-height:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#e9fbf1;border:2px solid #2fb36d;border-radius:20px;padding:4px 12px;font-family:Cairo;font-size:17px}
.wchk{display:block;font-family:Cairo;font-size:17px;padding:8px;border-radius:12px;background:#fff8e6;margin:6px 0}.wchk input{transform:scale(1.4);margin-inline-end:8px}
.cv{display:flex;justify-content:center;margin:6px 0}.cv svg{max-width:100%;height:auto}
/* ==== ترقية الجرافيك والصوت ==== */
button{touch-action:manipulation}
.skybg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.skybg .sun{position:absolute;top:26px;left:7%;width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c9,#ffd23f 60%,#ffb52e);box-shadow:0 0 60px 18px rgba(255,210,63,.5);animation:sunbob 7s ease-in-out infinite}
@keyframes sunbob{50%{transform:translateY(10px) scale(1.03)}}
.skybg .cl{position:absolute;opacity:.8;animation:driftx linear infinite}
@keyframes driftx{from{transform:translateX(110vw)}to{transform:translateX(-25vw)}}
.wrap{position:relative;z-index:1}
.scene{position:relative;border-radius:22px;margin:4px 0 8px;background:linear-gradient(180deg,#aee3ff 0%,#dff4ff 61%,#ffe9b8 61.5%,#ffdf9e 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),var(--shadow)}
.farm .row span{display:inline-block;animation:peck 1.8s ease-in-out infinite}
.farm .row span:nth-child(3n){animation-delay:.45s}.farm .row span:nth-child(3n+1){animation-delay:.95s}
@keyframes peck{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(2px) rotate(-9deg)}48%{transform:translateY(-3px)}}
.pill.pop{animation:pillpop .45s}
@keyframes pillpop{35%{transform:scale(1.3)}}
.sub-t,.stop,.opt,.btn,.mc,.flip{transition:transform .12s ease}
.sub-t:active,.stop:active,.opt:active,.mc:active{transform:scale(.965)}
.starfly{position:fixed;font-size:30px;pointer-events:none;z-index:10;animation:starfly .9s ease-out forwards}
@keyframes starfly{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translateY(-140px) scale(1.4) rotate(25deg)}}
.cans{font-size:34px;font-weight:800;text-align:center;background:#f6f3ff;border-radius:14px;padding:6px;margin:8px auto;min-width:120px;font-family:Nunito,system-ui}.cans small{font-size:18px;color:#777}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:6px auto;direction:ltr}.pk{font-size:26px;font-weight:800;padding:10px 0;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 0 #d8d2ea;font-family:Nunito,system-ui;cursor:pointer}.pk.go{background:#2fb36d;color:#fff}.pk.del{background:#ffe1e1}
.eggs span{font-size:18px}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../auth-gate.js"></script>
</head>
<body>
<div class="skybg" aria-hidden="true"><div class="sun"></div><span class="cl" style="top:11%;font-size:52px;animation-duration:58s">☁️</span><span class="cl" style="top:34%;font-size:36px;animation-duration:82s;animation-delay:-34s">☁️</span><span class="cl" style="top:58%;font-size:64px;animation-duration:100s;animation-delay:-62s">☁️</span><span class="cl" style="top:76%;font-size:30px;animation-duration:70s;animation-delay:-15s">☁️</span></div>
<div class="wrap">
  <div class="top">
    <button class="brand" onclick="route('home')">🌍 <span id="brandName">عالم يحيى</span></button>
    <div class="pills"><button class="pill" id="kidPill" onclick="route('kids')"></button><span class="pill">⭐ <b id="stars">0</b></span><span class="pill">🐥 <b id="eggsN">0</b></span><span class="pill" id="cloud" title="المزامنة مع بابا">⏳</span></div>
  </div>
  <div id="view"></div>
</div>

<script>
/* ===================== عالم يحيى — المحرّك =====================
   البيانات: data/manifest.json (مواد ← بلوكات ← وحدات ← دروس)
   كل درس: lessons/<id>.json فيه activities بالأنواع: story · cards · match · sort(bird|card) · quiz
   الصوت: audio/<lessonId>/<key>.mp3 لو موجود في lesson.audio، وإلا صوت الجهاز. */
const $=id=>document.getElementById(id);
let M=null, L=null, LID=null, ACT=null, AIDX=0;
/* ---------- المناهج: كل طفل على منهج مدرسته ---------- */
const CURS={nile:{name:"مدارس النيل الدولية",short:"🏫 النيل الدولية",file:"data/manifest.json"},
            exp:{name:"مدارس اللغات التجريبية",short:"🏫 لغات تجريبي",file:"data/exp/manifest.json"}};
const MS={};
async function loadCur(c){ c=CURS[c]?c:"nile"; if(!MS[c]) MS[c]=await getJSON(CURS[c].file); return MS[c]; }
const kidCur=k=>(k&&CURS[k.cur])?k.cur:"nile";
/* ---------- اللاعبين (كل طفل ليه مساره) ---------- */
const BLANK=()=>({stars:0,eggs:0,done:{},miss:[]});
let NEWCUR="nile";
const AVATARS=["🦁","🐯","🐼","🦊","🐰","🐻","🦄","🐸","🐧","🦋","🐬","🐥"];
let KIDS={}, KID=null, S=BLANK();
try{KIDS=JSON.parse(localStorage.getItem("yw-kids")||"{}")||{}}catch(e){}
try{KID=localStorage.getItem("yw-kid")}catch(e){}
/* ترحيل التقدّم القديم (قبل الملفات الشخصية) ليحيى */
try{ if(!Object.keys(KIDS).length){ KIDS={yahia:{id:"yahia",name:"يحيى",emoji:"🦁",u:1}}; const old=localStorage.getItem("yahia-world"); if(old) localStorage.setItem("yw-state:yahia",old); localStorage.setItem("yw-kids",JSON.stringify(KIDS)); } }catch(e){}
const kid=()=>KIDS[KID]||{name:"",emoji:"🦁"};
const liveKids=()=>Object.values(KIDS).filter(k=>k&&!k.del).sort((a,b)=>(a.c||0)-(b.c||0));
function loadKidLocal(id){ let st=BLANK(); try{const x=JSON.parse(localStorage.getItem("yw-state:"+id)||"null"); if(x) st=Object.assign(st,x)}catch(e){} return st; }
function save(local){try{localStorage.setItem("yw-state:"+KID,JSON.stringify(S))}catch(e){} const st=$("stars"); if(st.textContent!==String(S.stars)){const p=st.parentNode;p.classList.remove("pop");void p.offsetWidth;p.classList.add("pop")} st.textContent=S.stars; $("eggsN").textContent=S.eggs; if(!local) pushSync();}
/* ---------- المزامنة (Firebase — نفس قاعدة برامج محمد) ---------- */
const FB={apiKey:"AIzaSyAp3pbA-jRE1IhgZiBGsC18s8XOC9lWATs",authDomain:"my-app-sync-11ad9.firebaseapp.com",databaseURL:"https://my-app-sync-11ad9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-app-sync-11ad9",appId:"1:177039534756:web:367ecccc684c2cdfdd1431"};
let DB=null, REF=null, SYNC="off", pushT=null;
function mergeInto(T,r){ if(!r) return false; let ch=false;
  /* rev: نسخة مصحّحة من السحابة بتلغي القديم بدل ما تتدمج معاه */
  if((r.rev||0)>(T.rev||0)){ T.done={}; for(const lid in (r.done||{})){T.done[lid]={}; for(const i in r.done[lid]) if(r.done[lid][i]) T.done[lid][i]=true}
    T.stars=r.stars||0; T.eggs=r.eggs||0; T.miss=(r.miss||[]).filter(Boolean); T.rev=r.rev; return true; }
  if((T.rev||0)>(r.rev||0)) return true;
  for(const lid in (r.done||{})){ T.done[lid]=T.done[lid]||{}; for(const i in r.done[lid]) if(r.done[lid][i]&&!T.done[lid][i]){T.done[lid][i]=true;ch=true} }
  if((r.stars||0)>T.stars){T.stars=r.stars;ch=true} if((r.eggs||0)>T.eggs){T.eggs=r.eggs;ch=true}
  const seen=new Set(T.miss.map(m=>m.t)); (r.miss||[]).forEach(m=>{if(m&&!seen.has(m.t)){T.miss.push(m);ch=true}}); T.miss.sort((a,b)=>a.t-b.t); if(T.miss.length>80)T.miss=T.miss.slice(-80);
  return ch; }
/* ---- مسار احتياطي بالـ REST لو مكتبة Firebase ماشتغلتش على الجهاز ---- */
let REST=false, restPoll=null;
const RURL=p=>FB.databaseURL+"/"+p+".json";
async function rauth(p){const t=window.AppAuth?await AppAuth.restToken().catch(()=>null):null;return RURL(p)+(t?"?auth="+encodeURIComponent(t):"")}
async function rget(p){const r=await fetch(await rauth(p),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()}
async function rput(p,d){const r=await fetch(await rauth(p),{method:"PUT",body:JSON.stringify(d),headers:{"Content-Type":"application/json"}});if(!r.ok)throw new Error(r.status);return r.json()}
function restPush(){ if(!KID) return; const id=KID, snap=Object.assign({},S,{u:Date.now()}); rput("yahia_world/kids/"+id+"/state",snap).then(()=>{SYNC="on";setCloud()}).catch(()=>{SYNC="err";setCloud()}); }
async function restPull(){ if(!KID) return; const id=KID;

const ENBLOB={};
function enUI(id){ const k="ui__"+id; if(ENBLOB[k]||ENBLOB["_p"+k]) return; ENBLOB["_p"+k]=1; fetch("audio/en/"+k+".mp3").then(r=>r.ok?r.blob():null).then(b=>{if(b)ENBLOB[k]=URL.createObjectURL(b)}).catch(()=>{}) }
function enUIall(){ ["praise1","praise2","praise3","praise4","praise5","try","welcome","quizinst","cards","match","finish","bird"].forEach(enUI) }
function sayUI(id,arText){ let b=null;
  if(LANG==="ar") b=VOX_UI[arText||id]||VOX_UI[id];
  else if(LANG==="en"){ const u=ENBLOB["ui__"+id]; if(!u){ enUI(id); return false } stopVoice(); const a=new Audio(u); curAudio=a; a.play().catch(()=>{}); return true }
  if(!b) return false;
  try{ stopVoice(); const a=new Audio("data:audio/mp3;base64,"+b); curAudio=a; a.play().catch(()=>{}); return true; }catch(e){ return false; } }
const PRAISE_AR=["برافو!","أحسنت!","عاااش!","إجابة صحيحة!","بطل!"];
const PRAISE_EN=["Bravo!","Well done!","Hooray!","That's the right answer!","You're a star!"];
function sayPraise(){ if(LANG==="fr"){speak("Bravo !");return} const i=(Math.random()*5)|0;
  if(LANG==="ar"){ if(!sayUI("praise"+(i+1),PRAISE_AR[i])) speak(PRAISE_AR[i]); return }
  if(!sayUI("praise"+(i+1))) speak(PRAISE_EN[i]); }
function sayTry(){ if(LANG==="fr"){speak("Essaie encore");return}
  if(LANG==="ar"){ if(!sayUI("try","حاول تاني")) speak("حاول تاني"); return }
  if(!sayUI("try")) speak("Try again"); }

function unlockAudio(){ if(AUNLOCK) return; AUNLOCK=true; sxCtx();
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); }catch(e){}
 }

  let d=await getJSON(meta.file); const nm=(d.lang&&d.lang!=="ar"&&kid().nameEn)||(kid()&&kid().name)||"";

  if(d.lang==="en") loadEnIdx().then(()=>{ try{ d.activities.forEach(x=>{ if(x.type==="cards")x.items.forEach(it=>{enClip(it.w);enClip(it.w+". "+it.a)}); else if(x.type==="sort")x.items.forEach(it=>enClip(it[0])); else if(x.type==="quiz")x.items.forEach(q=>{enClip(q.q);enClip("The right answer is: "+String(q.o[q.a]).replace(/[^A-Za-z0-9 ,.'-]/g,""))}); else if(x.type==="match")x.pairs.forEach(p=>{enClip(p[0]);enClip(p[1])}); else if(x.type==="story")x.scenes.forEach(sc=>sc.t.split(" ").forEach(w=>{const c=w.replace(/[،؛:.!؟,?()"]/g,"");if((x.keys||[]).some(k=>c.toLowerCase().includes(k.toLowerCase())))enClip(c)})) }) }catch(e){} });

}

function actMatch(){

  <div class="mgrid">${cards.map((c,i)=>`<button class="mc" data-i="${i}">❓</button>`).join("")}</div>`);
  document.querySelectorAll(".mc").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(lock||b.classList.contains("open")||b.classList.contains("ok"))return;
    b.classList.add("open");b.textContent=cards[i].t;sfx("flip");speak(cards[i].t);open.push(b);
    if(open.length===2){lock=true;tries++;$("mt").textContent=tries;const [x,y]=open;
      if(cards[+x.dataset.i].k===cards[+y.dataset.i].k){setTimeout(()=>{x.classList.add("ok");y.classList.add("ok");open=[];lock=false;found++;$("mf").textContent=found;toast("✨");sfx("ok");
        if(found===A.pairs.length)setTimeout(()=>finish(2,tr("ذاكرة حديد!","Super memory!"),tr(`لقيت كل الأزواج في ${tries} محاولة.`,`You found all pairs in ${tries} tries.`),"🧠"),700)},500)}
      else{const p=A.pairs[cards[+x.dataset.i].k];setTimeout(()=>{x.classList.remove("open");y.classList.remove("open");x.textContent=y.textContent="❓";open=[];lock=false},1000)}}});
}

function actCalc(){
  const A=ACT,order=A.ordered?A.items.map((_,i)=>i):shuffle(A.items.map((_,i)=>i)),res=[];let qi=0,score=0,val="",tries=0;
  const norm=s=>String(s).replace(/\s+/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase();
  const pets=["🐶","🐱","🐰","🐼","🐨","🦊","🐯","🐸","🐵","🦄"];
  const bar=()=>order.map((_,i)=>`<span>${i<qi?(res[i]?"⭐":"⚪"):"▫️"}</span>`).join("");
  const show=()=>{
    if(qi>=order.length){S.eggs+=score;save();return finish(3,score>=order.length*0.8?tr("بطل الحساب!","Maths champion!"):tr("خلّصت التحدي!","Challenge complete!"),tr(`جاوبت ${score} من ${order.length} صح 🐥`,`You got ${score} of ${order.length} right 🐥`),score>=order.length*0.8?"🏆":"🧮")}
    const Q=A.items[order[qi]]; val=""; tries=0;
    const keys=(Q.keys||"7 8 9 4 5 6 1 2 3 0 ⌫ ✓").split(" ");
    $("view").innerHTML=shell(`<div class="eggs">${bar()}</div><div class="card"><div class="anim">${pets[qi%10]}</div>
      <div class="q" style="direction:ltr">${esc(Q.q)} <button class="back" style="font-size:16px" id="qs">🔊</button></div>
      ${Q.v?`<div class="cv">${Q.v}</div>`:""}
      <div class="cans" style="direction:ltr"><span id="cv">?</span>${Q.u?` <small>${esc(Q.u)}</small>`:""}</div>
      <div class="pad">${keys.map(k=>`<button class="pk ${k==="✓"?"go":k==="⌫"?"del":""}" data-k="${k}">${k}</button>`).join("")}</div>
      <div class="hint" id="ch"></div></div>`);
    $("qs").onclick=()=>speak(Q.say||Q.q); speak(Q.say||Q.q);

      if(k==="⌫"){val=val.slice(0,-1)}else if(k==="✓"){check();return}else if(val.length<10){val+=k}
      $("cv").textContent=val||"?";});
    const check=()=>{ if(!val) return; const ok=[].concat(Q.a).some(x=>norm(x)===norm(val));
      if(ok){score+=tries?0:1;res[qi]=!tries;toast(tries?"👍":"⭐");sfx("star");sayPraise();qi++;const t=setTimeout(show,1000);stopGame=()=>clearTimeout(t);return}
      tries++; if(tries<2){$("ch").textContent="🤔 "+(Q.hint||tr("حاول تاني","Try again!"));sfx("bad");sayTry();val="";$("cv").textContent="?";return}
      miss(`${Q.q} ← ${[].concat(Q.a)[0]}`); $("ch").innerHTML=`✅ ${tr("الإجابة:","Answer:")} <b>${esc([].concat(Q.a)[0])}</b>${Q.why?"<br>"+esc(Q.why):""}`;
      speak((LANG==="en"?"The answer is ":"الإجابة ")+[].concat(Q.a)[0]); res[qi]=false; qi++; const t=setTimeout(show,3200); stopGame=()=>clearTimeout(t); };
  }; show();

    <div class="card"><h2>🔑 حساب دخول لـ${esc(k.name)}</h2><p class="note">حساب بيفتح «عالم يحيى» بس — مش بيشوف أي برنامج تاني من برامجك. اعمله مرة واحدة وادّي الطفل الإيميل والباسورد.</p>
     <input id="kaE" value="${esc((k.nameEn||k.id).toLowerCase().replace(/[^a-z0-9]/g,""))}.world@kids.app" style="width:100%;padding:8px;border-radius:10px;border:1px solid #ccc;font:inherit;direction:ltr;margin-bottom:6px">
     <input id="kaP" value="${esc((k.nameEn||"kid").toLowerCase().replace(/[^a-z0-9]/g,""))}${Math.floor(1000+Math.random()*9000)}" style="width:100%;padding:8px;border-radius:10px;border:1px solid #ccc;font:inherit;direction:ltr;margin-bottom:6px">
     <button class="btn g" id="kaGo">اعمل الحساب</button><div id="kaR" class="note" style="margin-top:8px"></div></div>
    <div class="card note">${SYNC==="on"?"☁️ متزامن — كل طفل ليه مساره، وأي جهاز يشوف نفس المستوى.":SYNC==="err"?"⚠️ المزامنة مش شغالة دلوقتي — التقدّم محفوظ على الجهاز ده.":"⏳ بيوصل للمزامنة…"}</div>`;
  };
  const wireKA=()=>{const g=$("kaGo"); if(!g) return; g.onclick=async()=>{const e=$("kaE").value.trim().toLowerCase(), pw=$("kaP").value.trim(), R=$("kaR");
    if(pw.length<6){R.textContent="⚠️ الباسورد لازم 6 حروف أو أرقام على الأقل";return}
    R.textContent="⏳ بعمل الحساب…"; g.disabled=true;
    try{
      if(!window.AppAuth) throw new Error("لازم تكون داخل بحسابك الأول");
      const adm=await AppAuth.restToken();
      const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:pw,returnSecureToken:true})});
      const j=await r.json(); if(!r.ok) throw new Error(j.error&&j.error.message==="EMAIL_EXISTS"?"الإيميل ده متسجل قبل كده — غيّره":"تعذر عمل الحساب: "+(j.error&&j.error.message));
      const w=await fetch(FB.databaseURL+"/acl/"+j.localId+".json?auth="+encodeURIComponent(adm),{method:"PUT",body:JSON.stringify({apps:{yahia_world:true},name:k.name+" — عالم يحيى"})});
      if(!w.ok) throw new Error("الحساب اتعمل بس مقدرتش أديله صلاحية المنصة (حسابك مش أدمن؟)");
      R.innerHTML=`✅ اتعمل! ابعت لـ${esc(k.name)}:<br><b style="direction:ltr;display:inline-block">🌐 mohamedelsadek-elsadek.github.io/Apps/yahia/<br>📧 ${esc(e)}<br>🔒 ${esc(pw)}</b>`;
    }catch(err){R.textContent="⚠️ "+err.message; g.disabled=false}};};
  const wire=()=>{wireKA(); document.querySelectorAll("[data-vl]").forEach(b=>b.onclick=()=>{const lid=b.dataset.vl,inp=document.getElementById("vi-"+lid);
    if(b.dataset.x){setVid(lid,"");inp.value="";b.parentNode.querySelector(".vst").textContent="";return}
    if(setVid(lid,inp.value)){b.parentNode.querySelector(".vst").textContent="✅ اتحفظ"}else{b.parentNode.querySelector(".vst").textContent="⚠️ اللينك مش يوتيوب"}});};
  const _d=draw; const draw2=T=>{_d(T);wire()};
  if(PKID===KID) return draw2(S);
  const T=loadKidLocal(PKID); draw2(T);
  const upd=v=>{ if(mergeInto(T,v)&&$("view").dataset.r==="parent"&&PKID===k.id) draw2(T); };
  if(DB&&!REST) DB.ref("yahia_world/kids/"+PKID+"/state").once("value",snap=>upd(snap.val())); else rget("yahia_world/kids/"+PKID+"/state").then(upd).catch(()=>{});
}

function vidRows(PM){const r=[];(PM||M).subjects.forEach(s=>(s.blocks||[]).forEach(b=>b.units.forEach(u=>u.lessons.filter(l=>l.file).forEach(l=>{const v=lessonVid(l.id);
  const q=encodeURIComponent(l.vq||l.title);
  r.push(`<tr><td>${l.ico} ${esc(l.title)}<br><a class="note" href="https://www.youtube.com/results?search_query=${q}&sp=EgIYAQ%253D%253D" target="_blank" rel="noopener">🔎 دوّر على يوتيوب</a></td>
  <td><input id="vi-${l.id}" placeholder="الصق لينك الفيديو" value="${v?"https://youtu.be/"+v:""}" style="width:100%;padding:6px;border-radius:8px;border:1px solid #ccc;font:inherit;direction:ltr">
  <div style="margin-top:4px"><button class="back" data-vl="${l.id}">حفظ</button> ${v?`<button class="back" data-vl="${l.id}" data-x="1">مسح</button>`:""} <span class="vst note"></span></div></td></tr>`)}))));return r.join("")}
(async()=>{ if(KID&&KIDS[KID]){S=loadKidLocal(KID);$("kidPill").textContent=kid().emoji+" "+kid().name} else $("kidPill").textContent="👤 اختار"; save(true); initSync(); try{M=await loadCur(kidCur(KIDS[KID])); route(KID&&KIDS[KID]?"home":"kids")}catch(e){$("view").innerHTML=`<div class="err">مش قادر أحمّل المنصة. جرّب تفتحها تاني.</div>`}})();
</script>
</body>
</html>
